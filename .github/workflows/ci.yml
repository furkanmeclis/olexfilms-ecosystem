name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly full run (every job, whatever changed): the image build and the
  # DR drill stay proven even when no merge touched their inputs.
  schedule:
    - cron: "0 3 * * 1"

# One run per PR, and one per main push stream: a newer push to main cancels
# the older main run (merges in quick succession test and release only the
# newest commit). Not every main commit gets a v0.N tag any more; the
# surviving run diffs from the last v0.N tag (the last green, released main),
# so areas changed in cancelled runs are still tested and mobile/ changes
# still shipped. mobile-release and release-tag survive a cancel once they
# started (job and step conditions use !failure(), which a cancel does not
# flip), so an EAS build/update or a tag push is never killed half-way; the
# newer run waits for them. The event name keeps the weekly schedule and
# workflow_dispatch (also refs/heads/main) out of the push group, so they
# neither cancel nor get cancelled by a merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  SQLC_VERSION: "1.31.1"
  MIGRATE_VERSION: v4.19.1

jobs:
  # Decides which jobs a run needs (plain git diff, no third-party action).
  # PRs diff against their base; a push to main diffs against the last
  # release, i.e. the newest v0.N tag reachable from HEAD^ (normally HEAD^
  # itself; after cancelled main runs it covers their commits too; no tag
  # -> full). workflow_dispatch, the weekly schedule, a PR
  # labelled "ci-full" and a change to this file run everything (full=true).
  #   frontend/**                 -> frontend-check, frontend-unit, contracts
  #                                  + frontend-e2e unless only unit-test files
  #   backend/**, db/**           -> backend, contracts
  #   backend/migrations/**       -> backend, contracts, dr-drill
  #   mobile/**                   -> mobile
  #   docs/openapi.yaml,
  #   backend/docs/openapi.yaml   -> backend, frontend-*, contracts, mobile
  #   Dockerfiles, compose.prod.yml, deploy/**, backup/restore/dr-drill
  #   and gen-env-server scripts  -> image-build, dr-drill (infra)
  #   docs/**, *.md, .github/**   -> nothing (ci.yml itself -> everything)
  #   Makefile, scripts/, other   -> backend, frontend-*, contracts
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      contracts: ${{ steps.filter.outputs.contracts }}
      mobile: ${{ steps.filter.outputs.mobile }}
      infra: ${{ steps.filter.outputs.infra }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          # PR checkout is the merge commit; HEAD^1 is the current base.
          # Elsewhere full history + tags (blob-less: diff --name-only only
          # needs trees) so the last v0.N tag is found.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          filter: blob:none
      - name: Changed areas
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          backend=false; frontend=false; e2e=false; contracts=false
          mobile=false; infra=false; full=false
          files=""
          case "$EVENT" in
            pull_request)
              [ "$CI_FULL" = "true" ] && full=true || files=$(git diff --name-only HEAD^1 HEAD) ;;
            push)
              # Compare with the last release (newest v0.N tag before HEAD):
              # commits of main runs cancelled by this one are included. No
              # tag / no parent means full.
              if base=$(git describe --tags --abbrev=0 --match 'v0.[0-9]*' HEAD^ 2>/dev/null); then
                echo "diff base: $base ($(git rev-parse --short "$base^{commit}"))"
                files=$(git diff --name-only "$base" HEAD)
              else
                full=true
              fi ;;
            *) full=true ;;
          esac
          printf '%s\n' "$files"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/ci.yml) full=true ;;
              # Other workflows are manual; nothing here depends on them.
              .github/*) ;;
              docs/openapi.yaml|backend/docs/openapi.yaml)
                backend=true; frontend=true; e2e=true; contracts=true; mobile=true ;;
              # Markdown anywhere is never built, embedded or tested.
              *.md|docs/*) ;;
              backend/Dockerfile|frontend/Dockerfile|compose.prod.yml|deploy/*|\
              scripts/backup.sh|scripts/restore.sh|scripts/dr-drill.sh|scripts/gen-env-server.sh|.dockerignore|*/.dockerignore)
                infra=true ;;
              backend/migrations/*) backend=true; contracts=true; infra=true ;;
              # Unit-test-only files never reach the production build.
              frontend/*.test.ts|frontend/*.test.tsx|frontend/vitest.config.ts|frontend/src/test/*)
                frontend=true; contracts=true ;;
              frontend/*) frontend=true; e2e=true; contracts=true ;;
              mobile/*) mobile=true ;;
              backend/*|db/*) backend=true; contracts=true ;;
              *) backend=true; frontend=true; e2e=true; contracts=true ;;
            esac
          done <<< "$files"
          if [ "$full" = "true" ]; then
            backend=true; frontend=true; e2e=true; contracts=true; mobile=true; infra=true
          fi
          {
            echo "backend=$backend"; echo "frontend=$frontend"; echo "e2e=$e2e"
            echo "contracts=$contracts"; echo "mobile=$mobile"
            echo "infra=$infra"; echo "full=$full"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests skip when these are unset; here they always run
      # against the migrated service database.
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      - name: sqlc generate is up to date
        run: |
          sqlc generate
          git diff --exit-code -- internal/database/db
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
      - name: go vet
        run: go vet ./...
      - name: Migrate test database
        run: go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" up
      # Down files of the newest migrations must undo them cleanly: roll the
      # last two back and apply them again (up -> down -> up).
      - name: Migration roundtrip (last two)
        run: |
          go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" down 2
          go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" up
      - name: go test
        run: go test ./... -count=1
      - name: OpenAPI lint
        working-directory: .
        run: make openapi-lint

  # Lint, format and types. vitest (frontend-unit) and the production
  # build + mocked Playwright run (frontend-e2e) are separate jobs so the
  # three run side by side.
  frontend-check:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fonts are self-hosted (TEC-141); next/font/google fetches from
      # fonts.googleapis.com at build time and flakes main. grep instead of
      # rg: ripgrep is not guaranteed on the runner image.
      - name: No next/font/google
        working-directory: .
        run: "! grep -rn 'next/font/google' frontend/src"
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck

  # vitest: 268 files, ~5 min on one runner; two shards run side by side.
  frontend-unit:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests (shard ${{ matrix.shard }}/2)
        run: pnpm test -- --shard=${{ matrix.shard }}/2

  # TEC-183: mocked end-to-end run on the production build; page.route
  # answers the BFF calls, so no backend or database is needed. Skipped when
  # a PR only touches unit-test files (changes.e2e).
  frontend-e2e:
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04 # Playwright chromium henüz ubuntu-26.04 desteklemiyor
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # Next.js compiler cache: a lockfile+source hit is exact, otherwise the
      # newest cache for this lockfile is a warm start.
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ hashFiles('frontend/src/**', 'frontend/next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm build
      - name: Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (mocked API)
        run: pnpm test:e2e

  # Expo app (TEC-777): lint, typecheck, i18n parity and the committed API
  # types generated from docs/openapi.yaml. No native build here.
  mobile:
    needs: [changes]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: i18n
        run: npm run i18n:check
      - name: Placeholders
        run: npm run placeholders:check
      - name: api-generate is up to date
        run: |
          npm run api:generate
          git diff --exit-code -- src/core/api/schema.d.ts

  # Generated contracts must be committed: OpenAPI embed copy, frontend API
  # types, and i18n catalogs in parity.
  contracts:
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: api-generate is up to date
        run: |
          make api-generate
          git diff --exit-code -- docs/openapi.yaml backend/docs/openapi.yaml frontend/src/generated/
      - name: i18n
        run: make check-i18n
      - name: i18n translations
        run: make check-i18n-translations

  # Builds the production images exactly as Dokploy does (compose.prod.yml),
  # without pushing. A throw-away env file satisfies the required (:?) vars.
  # Only when its inputs change (Dockerfiles, compose.prod.yml, deploy/,
  # gen-env-server.sh: changes.infra), on a full run and weekly.
  image-build:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Exposes the runtime token the type=gha cache needs to the docker CLI.
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: CI env file (fake secrets)
        run: |
          scripts/gen-env-server.sh --app ci.example --realtime wss.ci.example --out "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f compose.prod.yml config -q
      - name: Build backend and frontend images
        run: |
          set -a; . "$RUNNER_TEMP/ci.env"; set +a
          docker buildx bake -f compose.prod.yml backend frontend \
            --set '*.cache-from=type=gha,scope=prod-images' \
            --set '*.cache-to=type=gha,scope=prod-images,mode=max'

  # Backups are only real if they restore: backup.sh, drop everything,
  # restore.sh, compare every table/file/index, sign in. Same triggers as
  # image-build plus migrations (changes.infra).
  dr-drill:
    needs: [changes]
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Disaster-recovery drill
        run: scripts/dr-drill.sh

  # Single required status check. Branch protection and auto-merge wait on
  # "ci"; it fails when any job above failed or was cancelled. Jobs the
  # path filter skipped count as passed; the filter itself must succeed.
  ci:
    name: ci
    if: always()
    needs: [changes, backend, frontend-check, frontend-unit, frontend-e2e, contracts, mobile, image-build, dr-drill]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::path filter job did not succeed"; exit 1
          fi
          if ! echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::a required CI job failed or was cancelled"; exit 1
          fi

  # TEC-1011: every green push to main that touched mobile/ (or the OpenAPI
  # spec) ships the app. The decision and the OTA run here (GitHub runner,
  # ~2 min) because EAS Workflows' Linux queue waited ~1 h per job; only a
  # native build goes to EAS (macOS queue, fast):
  #   fingerprint == latest finished store build -> eas update (channel
  #     production; the TestFlight binary picks it up on next launch)
  #   fingerprint changed, or no build yet      -> eas build --auto-submit
  #     -> new TestFlight build (native dep, config plugin, SDK...)
  # Build numbers: EAS remote counter (eas.json autoIncrement). The bundle's
  # EXPO_PUBLIC_API_URL comes from the EAS "production" environment. Needs
  # the EXPO_TOKEN secret (Expo robot "GitHub App"). Diffs from the last
  # v0.N tag before HEAD (same base as the changes job, so mobile/ changes of
  # cancelled main runs ship here, in one OTA/build decision), not
  # changes.mobile, so a ci.yml edit or the weekly run never ships.
  # Once started it is not cancelled by a newer main push (!failure()
  # instead of the implicit success() on the job and every step).
  # Full manual run from mobile/: npx eas-cli@latest workflow:run deploy-ios.yml
  mobile-release:
    needs: [ci]
    if: ${{ !failure() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ !failure() }}
        with:
          fetch-depth: 0
          filter: blob:none
      - name: mobile/ changed since the last release?
        if: ${{ !failure() }}
        id: changed
        run: |
          # HEAD^ so a tag release-tag just put on HEAD is never the base.
          if base=$(git describe --tags --abbrev=0 --match 'v0.[0-9]*' HEAD^ 2>/dev/null); then
            echo "diff base: $base"
            files=$(git diff --name-only "$base" HEAD -- . ../docs/openapi.yaml ../backend/docs/openapi.yaml \
                    | grep -vE '\.md$' || true)
          else
            files="(unknown range, shipping)"
          fi
          if [ -n "$files" ]; then
            printf '%s\n' "$files"; echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mobile/ unchanged, nothing shipped" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v7
        if: ${{ !failure() && steps.changed.outputs.run == 'true' }}
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: ${{ !failure() && steps.changed.outputs.run == 'true' }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set"; exit 1
          fi
          npm ci
      - name: Fingerprint vs latest store build
        if: ${{ !failure() && steps.changed.outputs.run == 'true' }}
        id: fp
        run: |
          # --json still prints progress lines to stdout; keep from the JSON start.
          last=$(npx eas-cli@latest build:list -p ios --status finished \
            --distribution store --limit 1 --json --non-interactive \
            | sed -n '/^\[/,$p' | jq -r '.[0].id // empty')
          if [ -z "$last" ]; then
            echo "no finished store build on EAS yet -> build"
            echo "mode=build" >> "$GITHUB_OUTPUT"; exit 0
          fi
          cmp=$(npx eas-cli@latest fingerprint:compare --build-id "$last" \
            --environment production --json --non-interactive | sed -n '/^{/,$p')
          remote=$(jq -r '.fingerprint1.hash // empty' <<<"$cmp")
          local=$(jq -r '.fingerprint2.hash // empty' <<<"$cmp")
          echo "latest build $last fingerprint=$remote local=$local"
          if [ -n "$remote" ] && [ "$remote" = "$local" ]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi
          echo "last=$last" >> "$GITHUB_OUTPUT"
      - name: OTA update (fingerprint unchanged)
        if: ${{ !failure() && steps.fp.outputs.mode == 'update' }}
        run: |
          npx eas-cli@latest update --channel production --platform ios \
            --environment production --non-interactive \
            --message "${GITHUB_SHA::8}: $(git log -1 --format=%s | cut -c1-100)"
          echo "EAS OTA update published to channel production (same fingerprint as build ${{ steps.fp.outputs.last }})" >> "$GITHUB_STEP_SUMMARY"
      - name: EAS build + TestFlight submit (fingerprint changed)
        if: ${{ !failure() && steps.fp.outputs.mode == 'build' }}
        run: |
          npx eas-cli@latest build -p ios --profile production \
            --auto-submit --non-interactive --no-wait
          echo "EAS iOS production build queued (auto-submit to TestFlight)" >> "$GITHUB_STEP_SUMMARY"

  # Every green main run not cancelled by a newer push tags its HEAD with the
  # next v0.N (first one: v0.1); Dokploy deploys on v0.* tag pushes. Once
  # started it finishes even if a newer push cancels the run (!failure() on
  # the job and its steps), so a tag is never half-pushed. Tags pushed with GITHUB_TOKEN do not
  # start other workflows, but GitHub still sends the tag push webhook.
  # A job skipped by the path filter would skip this one through the needs
  # chain (ci runs with always()), so the gate reads ci's result itself.
  release-tag:
    needs: [ci]
    if: ${{ !failure() && needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        if: ${{ !failure() }}
        with:
          fetch-depth: 0
      - name: Tag next version
        if: ${{ !failure() }}
        run: |
          git fetch --tags --force
          if git tag --points-at HEAD | grep -qE '^v0\.[0-9]+$'; then
            echo "HEAD already tagged: $(git tag --points-at HEAD)"; exit 0
          fi
          last=$(git tag -l 'v0.*' | grep -E '^v0\.[0-9]+$' | sed 's/^v0\.//' | sort -n | tail -1 || true)
          next="v0.$(( ${last:-0} + 1 ))"
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          echo "tagged $next" >> "$GITHUB_STEP_SUMMARY"
