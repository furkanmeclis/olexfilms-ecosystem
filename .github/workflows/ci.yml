name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per PR (or ref). PRs cancel superseded runs; main runs always
# finish so every green main commit gets its v0.N tag.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  SQLC_VERSION: "1.31.1"
  MIGRATE_VERSION: v4.19.1

jobs:
  # Decides which heavy jobs a PR needs (plain git diff, no third-party
  # action). Push to main, tags, workflow_dispatch and PRs labelled
  # "ci-full" run everything (full=true), as does a PR touching .github/.
  #   frontend/**                 -> frontend, contracts
  #   backend/**, db/**           -> backend, contracts
  #   docs/openapi.yaml,
  #   backend/docs/openapi.yaml   -> backend, frontend, contracts
  #   docs/**, *.md (alone)       -> nothing heavy
  #   .github/**                  -> everything (incl. image-build, dr-drill)
  #   Makefile, scripts/, other   -> backend, frontend, contracts
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contracts: ${{ steps.filter.outputs.contracts }}
      full: ${{ steps.filter.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          # PR checkout is the merge commit; HEAD^1 is the current base.
          fetch-depth: 2
      - name: Changed areas
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          CI_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
        run: |
          backend=false; frontend=false; contracts=false; full=false
          if [ "$EVENT" != "pull_request" ] || [ "$CI_FULL" = "true" ]; then
            full=true
          else
            files=$(git diff --name-only HEAD^1 HEAD)
            printf '%s\n' "$files"
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/openapi.yaml|backend/docs/openapi.yaml)
                  backend=true; frontend=true; contracts=true ;;
                # Markdown anywhere is never built, embedded or tested.
                *.md|docs/*) ;;
                frontend/*) frontend=true; contracts=true ;;
                backend/*|db/*) backend=true; contracts=true ;;
                .github/*) full=true ;;
                *) backend=true; frontend=true; contracts=true ;;
              esac
            done <<< "$files"
          fi
          if [ "$full" = "true" ]; then backend=true; frontend=true; contracts=true; fi
          {
            echo "backend=$backend"; echo "frontend=$frontend"
            echo "contracts=$contracts"; echo "full=$full"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests skip when these are unset; here they always run
      # against the migrated service database.
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app_test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_VERSION }}
      - name: sqlc generate is up to date
        run: |
          sqlc generate
          git diff --exit-code -- internal/database/db
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend
      - name: go vet
        run: go vet ./...
      - name: Migrate test database
        run: go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" up
      # Down files of the newest migrations must undo them cleanly: roll the
      # last two back and apply them again (up -> down -> up).
      - name: Migration roundtrip (last two)
        run: |
          go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" down 2
          go run -tags postgres "github.com/golang-migrate/migrate/v4/cmd/migrate@${MIGRATE_VERSION}" -path migrations -database "$TEST_DATABASE_URL" up
      - name: go test
        run: go test ./... -count=1
      - name: OpenAPI lint
        working-directory: .
        run: make openapi-lint

  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      # Fonts are self-hosted (TEC-141); next/font/google fetches from
      # fonts.googleapis.com at build time and flakes main. grep instead of
      # rg: ripgrep is not guaranteed on the runner image.
      - name: No next/font/google
        working-directory: .
        run: "! grep -rn 'next/font/google' frontend/src"
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # TEC-183: mocked end-to-end run on the build above; page.route
      # answers the BFF calls, so no backend or database is needed.
      - name: Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (mocked API)
        run: pnpm test:e2e

  # Generated contracts must be committed: OpenAPI embed copy, frontend API
  # types, and i18n catalogs in parity.
  contracts:
    needs: [changes]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: api-generate is up to date
        run: |
          make api-generate
          git diff --exit-code -- docs/openapi.yaml backend/docs/openapi.yaml frontend/src/generated/
      - name: i18n
        run: make check-i18n
      - name: i18n translations
        run: make check-i18n-translations

  # Builds the production images exactly as Dokploy does (compose.prod.yml),
  # without pushing. A throw-away env file satisfies the required (:?) vars.
  # Not on PRs (minutes): main push, tags, workflow_dispatch, a PR labelled
  # "ci-full" or a PR changing .github/ (changes.full).
  image-build:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Exposes the runtime token the type=gha cache needs to the docker CLI.
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: CI env file (fake secrets)
        run: |
          scripts/gen-env-server.sh --app ci.example --realtime wss.ci.example --out "$RUNNER_TEMP/ci.env"
          docker compose --env-file "$RUNNER_TEMP/ci.env" -f compose.prod.yml config -q
      - name: Build backend and frontend images
        run: |
          set -a; . "$RUNNER_TEMP/ci.env"; set +a
          docker buildx bake -f compose.prod.yml backend frontend \
            --set '*.cache-from=type=gha,scope=prod-images' \
            --set '*.cache-to=type=gha,scope=prod-images,mode=max'

  # Backups are only real if they restore: backup.sh, drop everything,
  # restore.sh, compare every table/file/index, sign in. Same triggers as
  # image-build (changes.full).
  dr-drill:
    needs: [changes]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Disaster-recovery drill
        run: scripts/dr-drill.sh

  # Single required status check. Branch protection and auto-merge wait on
  # "ci"; it fails when any job above failed or was cancelled. Jobs the
  # path filter skipped count as passed; the filter itself must succeed.
  ci:
    name: ci
    if: always()
    needs: [changes, backend, frontend, contracts, image-build, dr-drill]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs green
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "$RESULTS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::path filter job did not succeed"; exit 1
          fi
          if ! echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' >/dev/null; then
            echo "::error::a required CI job failed or was cancelled"; exit 1
          fi

  # Every green push to main gets the next v0.N tag (first one: v0.1);
  # Dokploy deploys on v0.* tag pushes. Tags pushed with GITHUB_TOKEN do not
  # start other workflows, but GitHub still sends the tag push webhook.
  release-tag:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag next version
        run: |
          git fetch --tags --force
          if git tag --points-at HEAD | grep -qE '^v0\.[0-9]+$'; then
            echo "HEAD already tagged: $(git tag --points-at HEAD)"; exit 0
          fi
          last=$(git tag -l 'v0.*' | grep -E '^v0\.[0-9]+$' | sed 's/^v0\.//' | sort -n | tail -1 || true)
          next="v0.$(( ${last:-0} + 1 ))"
          git tag "$next" "$GITHUB_SHA"
          git push origin "$next"
          echo "tagged $next" >> "$GITHUB_STEP_SUMMARY"
