# Public probes and bootstrap do not use authenticated 4xx responses.
# /readyz reports failure as 503.
../docs/openapi.yaml:
  operation-4xx-response:
    - "#/paths/~1healthz/get/responses"
    - "#/paths/~1readyz/get/responses"
    - "#/paths/~1v1~1app~1config/get/responses"
  # TEC-401: the OAuth authorization endpoint only redirects (302) or renders an error page.
  operation-2xx-response:
    - "#/paths/~1oauth~1authorize/get/responses"
