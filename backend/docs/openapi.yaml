        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalTextPublishRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalTextPublish"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- TEC-91: mobile API (tag Mobile) -----------------------------------
  /v1/mobile/auth/login:
    post:
      tags: [Mobile]
      operationId: postMobileAuthLogin
      summary: Mobile sign-in (device)
      description: |
        E-mail + password sign-in of the mobile app with the device
        description. Returns a mobile token pair (JWT `aud=mobile`, refresh
        30 days, `JWT_MOBILE_REFRESH_TTL`) and the session hydration. Same
        account rules as the panel (customer / fleet only accounts use the
        portal: 403 `NO_PANEL_ACCESS`). An older session of the same device
        ends. The app keeps the tokens itself and calls
        `/api/v1/mobile/*` with `Authorization: Bearer` (no cookies).
      security: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileLoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMobileLogin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/mobile/auth/refresh:
    post:
      tags: [Mobile]
      operationId: postMobileAuthRefresh
      summary: Rotate the mobile refresh token
      description: |
        Single-use rotation; the new pair continues the device chain. A
        rotated token presented again revokes the whole chain of that device
        (401 `REFRESH_TOKEN_REUSED`): the app signs in again. Web refresh
        tokens are refused here and mobile ones on `/v1/auth/refresh`.
      security: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileRefreshRequest"
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/me:
    get:
      tags: [Mobile]
      operationId: getMobileAuthMe
      summary: Mobile session
      description: |
        `/v1/auth/me` plus the device session and `current_warehouse`
        (reserved for F1, always null now).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMobileMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/logout:
    post:
      tags: [Mobile]
      operationId: postMobileAuthLogout
      summary: Sign this device out
      description: Ends every session of the caller's device and drops its Expo push tokens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/logout-all:
    post:
      tags: [Mobile]
      operationId: postMobileAuthLogoutAll
      summary: Sign out everywhere
      description: Ends every session of the user (all devices and browsers, this one included) and drops every push token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/organization-context:
    post:
      tags: [Mobile]
      operationId: postMobileAuthOrganizationContext
      summary: Switch the active organization
      description: |
        Re-issues the device's token pair with another active organization
        (`oid`); the current session ends. A `warehouse_id` context (`whid`)
        is reserved for F1.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationContextRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/push-token:
    put:
      tags: [Mobile]
      operationId: putMobilePushToken
      summary: Register the device's Expo push token
      description: |
        Idempotent upsert into `device_push_tokens` (same store and use case
        as `POST /v1/notifications/push-devices`). Shape of the previous
        mobile API: `expo_push_token` + `platform`; `device_id`, `platform`
        and `app_version` default to the session's device.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobilePushTokenRequest"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePushDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"
    delete:
      tags: [Mobile]
      operationId: deleteMobilePushToken
      summary: Delete an Expo push token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expo_push_token]
              properties:
                expo_push_token: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/qr/{code}:
    get:
      tags: [Mobile]
      operationId: getMobileAuthQR
      summary: Scan a QR web sign-in
      description: |
        Shows the browser's IP and user agent before the user decides and
        marks the challenge scanned (published as `{status: scanned}`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
        - $ref: "#/components/parameters/QRCode"
      responses:
        "200":
          description: Challenge summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRScan"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/QRLoginExpired"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/qr/{code}/approve:
    post:
      tags: [Mobile]
      operationId: postMobileAuthQRApprove
      summary: Approve a QR web sign-in
      description: |
        Signs the waiting browser in as the caller, in the session's active
        organization (panel realm rules apply). Mobile sessions only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
        - $ref: "#/components/parameters/QRCode"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/QRLoginExpired"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/qr/{code}/reject:
    post:
      tags: [Mobile]
      operationId: postMobileAuthQRReject
      summary: Reject a QR web sign-in
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
        - $ref: "#/components/parameters/QRCode"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/QRLoginExpired"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/measurements:
    post:
      tags: [Mobile]
      operationId: postMobileMeasurement
      summary: Upload a paint thickness measurement (minimal storage, K28)
      description: |
        Minimal F2 storage (TEC-233): the upload is kept as a raw record in
        the active organization (`measurement_results`; the whole request
        body is stored unchanged) and answers `202 {uuid, status}`. F3-02
        (TEC-113) adds mandatory VIN, the device registry, before/after
        pairing, the difference table and the PDF on the same record.

        Only `raw` (an object) is required. With a `vin` the status is
        `accepted`; without one it is `vin_pending` ("tamamlanacak", filled in
        later). `service_uuid` attaches the measurement to a service of the
        active organization (its vehicle too); another organization's service
        answers 404. Idempotent per organization by the `Idempotency-Key`
        header or `client_measurement_id`: a repeat answers the first result
        (same uuid and status) and writes nothing.

        Permission `measurements.write` (managed scope). Bearer with
        `aud=mobile`; a panel token answers 403 `REALM_FORBIDDEN`; a missing or
        unsupported `X-Mobile-Api-Version` answers 426. Invalid fields answer
        400 `VALIDATION_ERROR`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
        - name: Idempotency-Key
          in: header
          required: false
          description: Client generated key; a repeated key returns the first result.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileMeasurementRequest"
      responses:
        "202":
          description: Accepted (also the answer to a repeated key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMobileMeasurementAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  # --- TEC-235: mobile warehouse mirrors (tag Mobile) -------------------
  /v1/mobile/warehouse/warehouses:
    get:
      tags:
      - Mobile
      operationId: mobileListWarehouses
      summary: 'Mobile: Warehouses of the active organization'
      description: |
        Mobile mirror (TEC-235) of `GET /v1/warehouse/warehouses`: same handler, permission, warehouse module gate and active organization scope (a distributor reaches its own warehouses only, never the center's: K4, K20). Bearer with `aud=mobile`; a panel token answers 403 `REALM_FORBIDDEN`; a missing or unsupported `X-Mobile-Api-Version` answers 426.

        Needs `warehouse.read`; center and distributor organizations only (403 for dealers, K12). Works on the active organization's own warehouses. Ordered by sort_order. `active` filters.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MobileApiVersion'
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Warehouses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWarehouseList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '426':
          $ref: '#/components/responses/MobileApiVersionUnsupported'
  /v1/mobile/warehouse/scan:
    post:
      tags:
      - Mobile
      operationId: mobileResolveWarehouseScan
      summary: 'Mobile: Resolve one scanned code (location QR, unit barcode, SKU, short code)'
      description: |
        Mobile mirror (TEC-235) of `POST /v1/warehouse/scan`: same handler, permission, warehouse module gate and active organization scope (a distributor reaches its own warehouses only, never the center's: K4, K20). Bearer with `aud=mobile`; a panel token answers 403 `REALM_FORBIDDEN`; a missing or unsupported `X-Mobile-Api-Version` answers 426.

        Needs `warehouse.read` with the warehouse module on (center or distributor, 403 for dealers, K12). Resolution order: `OFW:LOC:<full_code>` -> a location of the active organization (404 SCAN_LOCATION_NOT_FOUND otherwise, nothing else is tried); `OFW:UNIT:<barcode>` -> that unit; a unit barcode (generated `<PREFIX>-<8 digits>`, roll split `<barcode>-S<n>`, legacy/import barcodes; exact, then upper-cased); a bare location full_code when `scan.bare_location_code_enabled`; a product SKU of the active brand when `scan.sku_enabled`; a 1-8 digit short code (optionally `-S<n>`) expanded to `<PREFIX>-<8 digits>` when `scan.short_code_enabled` (prefix `scan.short_code_prefix`, else the brand's default prefix). Units follow the caller's `stock.read` reach like the barcode history (a distributor sees its dealers' units, TEC-216); a unit outside the reach, or any unknown code, is 404 SCAN_NO_MATCH. An empty code is 400 VALIDATION_ERROR.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseScanInput'
      responses:
        '200':
          description: Resolved entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWarehouseScanResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: SCAN_NO_MATCH or SCAN_LOCATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          $ref: '#/components/responses/MobileApiVersionUnsupported'
      parameters:
      - $ref: '#/components/parameters/MobileApiVersion'
  /v1/mobile/warehouse/stock-counts:
    get:
      tags:
      - Mobile
      operationId: mobileListStockCounts
      summary: 'Mobile: Stock counts of the active organization'
      description: |
        Mobile mirror (TEC-235) of `GET /v1/warehouse/stock-counts`: same handler, permission, warehouse module gate and active organization scope (a distributor reaches its own warehouses only, never the center's: K4, K20). Bearer with `aud=mobile`; a panel token answers 403 `REALM_FORBIDDEN`; a missing or unsupported `X-Mobile-Api-Version` answers 426.

        Needs `warehouse.read` with the warehouse module on (center or distributor, 403 for dealers, K12). Newest first; no expected values.
