    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    CustomerType:
      type: string
      enum: [individual, corporate]

    CustomerOrganizationLink:
      type: object
      required: [uuid, name, type, linked_at, first_service_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [center, distributor, dealer] }
        linked_at: { type: string, format: date-time }
        first_service_at: { type: [string, "null"], format: date-time }

    CustomerSummary:
      type: object
      description: >-
        An anonymized customer is masked: `anonymized: true`, name is the
        localized "Anonymous customer" label, surname empty, contact fields
        null.
      required: [uuid, name, surname, email, phone, status, anonymized, type, company_name, locale, created_at, linked_at, first_service_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"], description: E.164 }
        status: { type: string, enum: [active, disabled, pending, anonymized] }
        anonymized: { type: boolean }
        type: { $ref: "#/components/schemas/CustomerType" }
        company_name: { type: [string, "null"] }
        locale: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        linked_at: { type: [string, "null"], format: date-time }
        first_service_at: { type: [string, "null"], format: date-time }

    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerSummary"
        - type: object
          required: [tax_office, national_id_last4, tax_no_last4, address, notification_prefs, editable, identity_editable, organizations]
          properties:
            tax_office: { type: [string, "null"] }
            national_id_last4:
              type: [string, "null"]
              description: Last four characters; the full value is never returned.
            tax_no_last4:
              type: [string, "null"]
              description: Last four characters; the full value is never returned.
            address: { type: object, additionalProperties: true }
            notification_prefs:
              type: object
              additionalProperties: { type: boolean }
            editable:
              type: boolean
              description: False for anonymized, disabled or merged accounts.
            identity_editable:
              type: boolean
              description: >-
                True when every link of the customer is in the caller's scope
                and the user has no panel membership; otherwise edits only
                fill empty fields.
            organizations:
              type: array
              description: Serving organizations inside the caller's scope.
              items: { $ref: "#/components/schemas/CustomerOrganizationLink" }

    CustomerWrite:
      allOf:
        - $ref: "#/components/schemas/CustomerDetail"
        - type: object
          required: [existing_user, ignored_fields]
          properties:
            existing_user:
              type: boolean
              description: The phone already belonged to a user, who was linked.
            ignored_fields:
              type: array
              description: Submitted values kept as stored (shared customer, fill-only).
              items: { type: string }

    CustomerCreateInput:
      type: object
      additionalProperties: false
      required: [phone, name]
      properties:
        phone: { type: string, description: Any format; normalized to E.164 }
        name: { type: string, maxLength: 100 }
        surname: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        locale: { type: string, example: tr }
        type: { $ref: "#/components/schemas/CustomerType" }
        company_name: { type: string, maxLength: 200 }
        tax_office: { type: string, maxLength: 150 }
        national_id: { type: string, description: "TC kimlik no; stored encrypted (5-20 letters/digits)" }
        tax_no: { type: string, description: Stored encrypted (5-20 letters/digits) }
        address: { type: object, additionalProperties: true }
        notification_prefs:
          type: object
          description: Keys whatsapp, email, sms, push.
          additionalProperties: { type: boolean }

    CustomerUpdateInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        surname: { type: [string, "null"], maxLength: 100 }
        email: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/CustomerType" }
        company_name: { type: [string, "null"], maxLength: 200 }
        tax_office: { type: [string, "null"], maxLength: 150 }
        national_id: { type: [string, "null"] }
        tax_no: { type: [string, "null"] }
        address: { type: [object, "null"], additionalProperties: true }
        notification_prefs:
          type: [object, "null"]
          additionalProperties: { type: boolean }

    CustomerUpgradeInput:
      type: object
      additionalProperties: false
      required: [organization_uuid, role]
      properties:
        organization_uuid: { type: string, format: uuid, description: An existing dealer }
        role: { type: string, enum: [dealer_owner, dealer_staff] }

    CustomerUpgrade:
      type: object
      required: [customer_uuid, organization, role, member_role]
      properties:
        customer_uuid: { type: string, format: uuid }
        organization:
          type: object
          required: [uuid, slug, name, type]
          properties:
            uuid: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            type: { type: string }
        role: { type: string, enum: [dealer_owner, dealer_staff] }
        member_role: { type: string, enum: [owner, staff] }

    VehicleCatalogRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    Vehicle:
      type: object
      required: [uuid, customer_uuid, organization_uuid, plate, plate_normalized, plate_country, vin, model_year, car_brand, car_model, created_at, updated_at, warnings]
      properties:
        uuid: { type: string, format: uuid }
        customer_uuid: { type: string, format: uuid }
        organization_uuid:
          type: [string, "null"]
          format: uuid
          description: Organization that registered the vehicle.
        plate: { type: [string, "null"] }
        plate_normalized: { type: [string, "null"] }
        plate_country: { type: [string, "null"], description: ISO 3166-1 alpha-2 }
        vin: { type: [string, "null"] }
        model_year: { type: [integer, "null"] }
        car_brand:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogRef"
            - type: "null"
        car_model:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        warnings:
          type: array
          description: After a write, vin_duplicate / plate_duplicate when another vehicle of the brand has the same value.
          items: { type: string, enum: [vin_duplicate, plate_duplicate] }

    VehicleCreateInput:
      type: object
      additionalProperties: false
      required: [customer_uuid, plate]
      properties:
        customer_uuid: { type: string, format: uuid }
        plate: { type: string, maxLength: 20 }
        plate_country: { type: string, description: "ISO alpha-2; default: organization country, then TR" }
        car_brand_uuid: { type: [string, "null"], format: uuid }
        car_model_uuid: { type: [string, "null"], format: uuid }
        model_year: { type: [integer, "null"], minimum: 1900 }
        vin: { type: string, description: "17 characters without I, O, Q" }

    VehicleUpdateInput:
      type: object
      additionalProperties: false
      properties:
        plate: { type: string, maxLength: 20 }
        plate_country: { type: [string, "null"] }
        car_brand_uuid: { type: [string, "null"], format: uuid }
        car_model_uuid: { type: [string, "null"], format: uuid }
        model_year: { type: [integer, "null"], minimum: 1900 }
        vin: { type: [string, "null"] }

    EnvelopeCustomer:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerDetail" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerWrite:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerWrite" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CustomerSummary" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerUpgrade:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerUpgrade" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehicle:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/Vehicle" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    VehicleTransfer:
      type: object
      description: >-
        A vehicle ownership transfer (TEC-190). Codes and hashes never leave
        the server; the new owner's phone is masked.
      required: [uuid, vehicle_uuid, status, to_phone_masked, new_owner_known, from_verified, to_verified,
                 attempts, max_attempts, expires_at, created_at, completed_at, cancelled_at, warranties_moved]
      properties:
        uuid: { type: string, format: uuid }
        vehicle_uuid: { type: string, format: uuid }
        status: { type: string, enum: [pending, completed, cancelled, expired] }
        to_phone_masked: { type: string }
        new_owner_known:
          type: boolean
          description: The new owner has an account (false = created at completion, name required).
        from_verified: { type: boolean }
        to_verified: { type: boolean }
        attempts: { type: integer, format: int32 }
        max_attempts: { type: integer, format: int32 }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        warranties_moved:
          type: integer
          description: Active warranties moved to the new owner (set on the completing call, else 0).

    VehicleTransferStartInput:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { type: string, description: New owner's phone (E.164 or national for the organization's country). }

    VehicleTransferVerifyInput:
      type: object
      additionalProperties: false
      properties:
        from_code: { type: string, pattern: "^[0-9]{6}$", description: Code sent to the current owner. }
        to_code: { type: string, pattern: "^[0-9]{6}$", description: Code sent to the new owner. }
        new_owner_name: { type: string, maxLength: 100, description: Required when the new owner has no account. }
        new_owner_surname: { type: string, maxLength: 100 }

    EnvelopeVehicleTransfer:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/VehicleTransfer" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehicleTransferList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/VehicleTransfer" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehiclePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Vehicle" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    Error:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    UpdateRequiredError:
      description: >-
        Error envelope of a 426. `data` is present for UPDATE_REQUIRED only
        (TEC-236).
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        data:
          $ref: "#/components/schemas/UpdateRequiredInfo"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    UpdateRequiredInfo:
      type: object
      required: [min_version, store_urls]
      properties:
        min_version:
          type: string
          description: Minimum supported app release
          examples: ["2.4.0"]
        current_version:
          type: [string, "null"]
          description: The release the request reported; null when unknown
        store_urls:
          type: object
          required: [ios, android]
          properties:
            ios: { type: [string, "null"], format: uri }
            android: { type: [string, "null"], format: uri }

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        refresh_expires_at:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [uuid, email, name, surname, status, is_super_admin, email_verified]
      properties:
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        status:
          type: string
          examples: [active, disabled]
        is_super_admin:
          type: boolean
        email_verified:
          type: boolean
        locale:
          description: The user's own language; null inherits from the organization (see Me.effective_locale).
          oneOf:
            - $ref: "#/components/schemas/Locale"
            - type: "null"
        timezone:
          type: [string, "null"]
          description: The user's own IANA timezone; null inherits from the organization.
          examples: ["Asia/Dubai"]

    Locale:
      type: string
      description: >-
        Canonical locale code (K10). Inputs are normalized: "zh_CN", "zh-cn"
        and "zh" become zh-CN; a regional code falls back to its language
        ("tr-TR" -> tr). Unknown codes are rejected with 422.
      enum: [tr, en, bg, de, el, uk, ru, fr, es, it, zh-CN, az, ar]

    MeLinks:
      type: object
      required: [profile, change_password, notification_preferences]
      properties:
        profile: { type: string, examples: ["/v1/auth/profile"] }
        change_password: { type: string, examples: ["/v1/auth/password/change"] }
        notification_preferences: { type: string, examples: ["/v1/notification-preferences"] }

    MeChannels:
      type: object
      properties:
        user:
          type: string
          description: Centrifugo channel hint
          examples: ["user:uuid"]

    MeRealtime:
      type: object
      required: [enabled, user_channel]
      properties:
        enabled: { type: boolean }
        ws_url: { type: string }
        user_channel:
          type: string
          examples: ["user:uuid"]

    Me:
      type: object
      required: [user, roles, permissions, links, channels, realtime, effective_locale, effective_timezone]
      properties:
        effective_locale:
          description: >-
            Resolved language: user -> active organization -> brand center ->
            Accept-Language -> tr.
          $ref: "#/components/schemas/Locale"
        effective_timezone:
          type: string
          description: >-
            Resolved IANA timezone: user -> active organization -> brand
            center -> Europe/Istanbul.
          examples: ["Europe/Istanbul"]
        user:
          $ref: "#/components/schemas/PublicUser"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        grants:
          type: object
          description: >-
            Permission slug -> scope in the active organization context (global
            roles + roles of the active membership).
          additionalProperties:
            $ref: "#/components/schemas/PermissionScope"
        active_organization_uuid:
          type: string
          format: uuid
        organization_roles:
          type: array
          description: Roles of the user in the active organization.
          items:
            type: string
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
        links:
          $ref: "#/components/schemas/MeLinks"
        channels:
          $ref: "#/components/schemas/MeChannels"
        realtime:
          $ref: "#/components/schemas/MeRealtime"
        impersonation:
          $ref: "#/components/schemas/MeImpersonation"

    MeImpersonation:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"

    OrganizationMembership:
      type: object
      required: [uuid, slug, name, role, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, staff]
        logo_url:
          type: [string, "null"]
        status:
          type: string
        access_ends_at:
          type: [string, "null"]
          format: date-time
        type:
          $ref: "#/components/schemas/OrganizationType"
        brand:
          $ref: "#/components/schemas/BrandRef"
        parent:
          oneOf:
            - $ref: "#/components/schemas/OrganizationParentRef"
            - type: "null"

    OrganizationType:
      type: string
      enum: [center, distributor, dealer]

    OrganizationStatus:
      type: string
      description: pending and expired are legacy values kept for compatibility.
      enum: [pending, active, read_only, suspended, expired]

    BrandRef:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        name:
          type: string

    OrganizationParentRef:
      type: object
      required: [uuid, name]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    PublicBrand:
      type: object
      required: [uuid, slug, name, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]

    PublicWarranty:
      type: object
      description: Public warranty projection (TEC-189); never carries personal data.
      required: [public_code, status, start_at, end_at, days_remaining, product, brand, dealer, vehicle]
      properties:
        public_code:
          type: string
        status:
          type: string
          enum: [active, expired, void]
          description: An active warranty past end_at reads expired before the nightly cron runs.
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        days_remaining:
          type: integer
          minimum: 0
          description: Whole days left (rounded up) while active, else 0.
        product:
          type: object
          required: [name]
          properties:
            name: { type: string }
        brand:
          type: object
          description: Brand of the request domain.
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
        dealer:
          type: object
          description: Organization that performed the service.
          required: [name, city]
          properties:
            name: { type: string }
            city: { type: string }
        vehicle:
          type: object
          required: [brand_name, brand_logo_uuid, model_name, model_year, plate_masked, vin_last4]
          properties:
            brand_name: { type: string }
            brand_logo_uuid:
              type: [string, "null"]
              format: uuid
              description: Car brand with a logo, served at /brand-logos/{uuid}.
            model_name: { type: string }
