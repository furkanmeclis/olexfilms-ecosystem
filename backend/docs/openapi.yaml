        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/entries:
    get:
      tags: [Accounting]
      operationId: listAccountingEntries
      summary: Ledger rows of a book, newest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountingOrganizationUUID"
        - name: account_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: cari_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: direction
          in: query
          schema: { $ref: "#/components/schemas/AccountingDirection" }
        - name: category
          in: query
          schema: { type: string, examples: [rent] }
        - name: source_type
          in: query
          description: manual, order, opening_balance, ...
          schema: { type: string }
        - name: date_from
          in: query
          description: First day (UTC, inclusive) of created_at
          schema: { type: string, format: date }
        - name: date_to
          in: query
          description: Last day (UTC, inclusive) of created_at
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntryPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Accounting]
      operationId: createAccountingEntry
      summary: Manual income, expense or cari charge (source_type manual)
      description: >-
        Written to the active organization's book through the posting API.
        Income/expense need an account and/or a cari; a charge needs a cari
        only. The cari is named by cari_uuid or by the counterparty
        organization (the parent or a direct child of the same brand; opened
        when missing). System categories (sale, purchase) are refused. A
        repeated idempotency_key answers 200 with the earlier entry.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryInput"
      responses:
        "200":
          description: Replayed (same idempotency_key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/accounting/entries/{uuid}:
    get:
      tags: [Accounting]
      operationId: getAccountingEntry
      summary: One ledger row
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - $ref: "#/components/parameters/AccountingOrganizationUUID"
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/entries/{uuid}/void:
    post:
      tags: [Accounting]
      operationId: voidAccountingEntry
      summary: Reverse a manual entry or an opening balance (step-up)
      description: >-
        Appends the mirror row (reversal_of_uuid, negated amounts); the
        ledger is append-only. Only open manual entries, cari opening
        balances (TEC-177) and cash/bank opening balances (TEC-198) of the
        active organization (409 ENTRY_NOT_VOIDABLE otherwise). Reversing
        an opening balance writes accounting.opening_balance_voided (or
        accounting.account_opening_voided) to the audit log; a new opening
        balance may then be booked. Needs a recent step-up (403
        STEP_UP_REQUIRED).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryVoidInput"
      responses:
        "201":
          description: Reversal row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/accounting/collections:
    post:
      tags: [Accounting]
      operationId: createAccountingCollection
      summary: Collection from a counterparty into a cash/bank account
      description: >-
        Lowers the cari receivable and raises the account; never writes
        income (TEC-99 decision 2). A repeated idempotency_key answers 200.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceSettlementInput"
      responses:
        "200":
          description: Replayed (same idempotency_key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/accounting/opening-balances:
    post:
      tags: [Accounting]
      operationId: createAccountingOpeningBalance
      summary: Book the one-off opening balance of a cari (step-up)
      description: >-
        TEC-177. Writes the balance a cari carries over (F2 migrator data or
        paper) in the active organization's book, once per cari: a debit
        side (the counterparty owes us) is a charge, a credit side (we owe
        the counterparty) an account-less collection; neither touches P&L or
        cash. The row is dated at opening_date (ledger order and rate day),
        so statements show it at the start of the cari's history. The same
        opening balance again answers 200 with the earlier entry; other
        values while one is open answer 409 OPENING_BALANCE_EXISTS. Correct
        it by reversing the entry (POST /v1/accounting/entries/{uuid}/void),
        then book it again. Needs accounting.write (dealer roles answer 403)
        and a recent step-up (403 STEP_UP_REQUIRED). Writes
        cari.opening_balance_posted to the outbox and
        accounting.opening_balance_posted to the audit log.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceOpeningBalanceInput"
      responses:
        "200":
          description: Replayed (the same opening balance is already booked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "201":
          description: Created opening balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/accounting/payments:
    post:
      tags: [Accounting]
      operationId: createAccountingPayment
      summary: Payment to a counterparty from a cash/bank account
      description: >-
        Lowers the cari debt and the account; never writes an expense. A
        repeated idempotency_key answers 200.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceSettlementInput"
      responses:
        "200":
          description: Replayed (same idempotency_key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/accounting/disputes:
    get:
      tags: [Accounting]
      operationId: listAccountingDisputes
      summary: Cari disputes inside the accounting.read scope, newest first
      description: >-
        A dispute is visible to the disputing organization and to the parent
        it addresses (K24); brand and all scopes see every dispute of the
        domain brand. A distributor sees the disputes of its dealers, another
        distributor does not.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AccountingDisputeStatus" }
        - name: organization_uuid
          in: query
          description: Only disputes opened by this organization
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Disputes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingDisputePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Accounting]
      operationId: openAccountingDispute
      summary: Dispute an entry the parent posted to the active organization (K24)
      description: >-
        Needs accounting.dispute. The entry must be an open (unreversed)
        sourced row on the active organization's cari with its parent
        (409 ENTRY_NOT_DISPUTABLE otherwise); one open dispute per entry
        (409 DISPUTE_ALREADY_OPEN). Writes accounting.dispute_opened.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingDisputeInput"
      responses:
        "201":
          description: Dispute opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingDispute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/accounting/disputes/{uuid}:
    get:
      tags: [Accounting]
      operationId: getAccountingDispute
      summary: One dispute inside the accounting.read scope
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingDispute"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/disputes/{uuid}/resolve:
    post:
      tags: [Accounting]
      operationId: resolveAccountingDispute
      summary: Resolve a dispute addressed to the active organization
      description: >-
        Needs accounting.resolve; only the parent the disputed entry came
        from resolves (other disputes read as 404). reversal reverses every
        open row of the source on both ledgers; revision reverses them and
        reposts corrected_amount (in the entry's orig_currency, at the
        frozen rate) as revision + 1 in the same transaction; reject needs a
        note and posts nothing. A final dispute answers 409 DISPUTE_NOT_OPEN.
        A reversal of an order sale that already has a received and booked
        return (TEC-223) answers 422 DISPUTE_SALE_RETURNED and writes
        nothing (the return already reversed it; revise or reject instead).
        Writes accounting.dispute_resolved or accounting.dispute_rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingDisputeResolveInput"
      responses:
        "200":
          description: Resolved dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingDispute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: DISPUTE_SALE_RETURNED, the order sale already has a booked return (TEC-229)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/accounting/cari/{uuid}/statement:
    get:
      tags: [Accounting]
      operationId: getAccountingCariStatement
      summary: Cari statement (ekstre) of a period with opening, running and closing balance
      description: >-
        Rows before `from` make up the opening balance; each period row shows
        debit (raises what the counterparty owes the book owner) or credit and
        the running balance. A reversal row is shown in the opposite column.
        `from`/`to` are calendar days (UTC, inclusive). Read scope as in
        TEC-172: the active organization's book or one below it; a dealer
        reads its own cari only. Labels follow the user language (K10) or
        `locale`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - $ref: "#/components/parameters/AccountingOrganizationUUID"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: locale
          in: query
          description: Label language override (one of the 13 app languages)
          schema: { type: string, example: tr }
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCariStatement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/cari/{uuid}/statement/export:
    post:
      tags: [Accounting]
      operationId: exportAccountingCariStatement
      summary: Queue a statement export job (PDF, XLSX or CSV)
      description: >-
        The job runs on worker-docs (exports queue). PDF is rendered by
        Gotenberg on the organization letterhead, in the user language
        (RTL for ar); XLSX/CSV headers are in the same language. Poll and
        download through /v1/accounting/exports/{uuid}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingExportInput"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

