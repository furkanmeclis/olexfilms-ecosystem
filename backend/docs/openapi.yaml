  /v1/leads/{uuid}/status:
    post:
      tags: [Leads]
      operationId: setLeadStatus
      summary: Move lead status through the pipeline
      description: >-
        Allowed transitions: new → contacted → quoted → won|lost, and
        lost → contacted. Invalid transitions return 422 LEAD_INVALID_TRANSITION.
      security:
