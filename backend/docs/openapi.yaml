  /v1/tenant/bulk-operations/{uuid}/undo:
    post:
      tags: [Tenant]
      operationId: undoTenantBulkOperation
      summary: Undo a bulk operation of the active organization (TEC-212)
      description: >-
        Restores the previous values of the records a bulk run changed. Only
        operations of the active organization are visible (another
        organization's operation is 404). The caller must hold the action's
        permission; an operation is undone once (second call 409
        BULK_UNDO_UNAVAILABLE) and within `bulk_undo_window_hours` (409
        BULK_UNDO_EXPIRED). Records changed after the run are skipped
        (`undo_result.skipped`, reason `conflict` or `gone`); nothing is
        overwritten.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Undone operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkOperation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/public/brand:
    get:
      tags: [Public]
      operationId: getPublicBrand
      summary: Brand of the request domain
      description: |
        Resolves the brand from X-Forwarded-Host, then Host; unknown hosts fall
        back to the default brand (DEFAULT_BRAND_SLUG, `olex`).
      security: []
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicBrand"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/public/dealers:
    get:
      tags: [Public]
      operationId: listPublicDealerCodes
      summary: Codes of the request brand's active dealers (sitemap)
      description: |
        TEC-251. No authentication. Lists only `code` (organization slug,
        the `/bayi/{code}` path) and `updated_at` of the active, serving
        (access window open) dealers and distributors of the brand resolved
        from the request domain, sorted by code, at most 5000. Same filters
        as `GET /v1/public/dealers/{code}`. Used by the frontend sitemap.
        Rate limited per client IP (30 per minute); over the limit 429 with
        Retry-After.
      security: []
      responses:
        "200":
          description: Dealer codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicDealerCodes"
        "429":
          description: Rate limited per client IP
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/public/dealers/nearby:
    get:
      tags: [Public]
      operationId: getPublicNearbyDealers
      summary: Nearby dealers of the request brand ("find a dealer")
      description: |
        TEC-240. No authentication. Lists the active, serving (access window
        open) dealers and distributors of the brand resolved from the request
        domain that have coordinates, within `radius_km` of (`lat`, `lng`).
        Distance is the haversine great-circle distance in km, computed in
        SQL; results are nearest first, at most 50. Organizations without
        coordinates, suspended / pending ones and other brands' organizations
        are never returned. `whatsapp` is the organization phone when it is
        E.164, otherwise null. Rate limited per client IP (60 per minute);
        over the limit 429 with Retry-After.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lng
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: radius_km
          in: query
          required: false
          description: Search radius in km (default 100).
          schema: { type: number, exclusiveMinimum: 0, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Dealers, nearest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNearbyDealers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limited per client IP
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/public/dealers/{code}:
    get:
      tags: [Public]
      operationId: getPublicDealerShowcase
      summary: Public dealer showcase (page /bayi/{code})
      description: |
        TEC-250. No authentication. `code` is the organization slug. Returns
        the showcase of an active, serving (access window open) dealer or
        distributor of the brand resolved from the request domain: name,
        logo, address, province / district, coordinates and WhatsApp.
        Suspended / pending / expired organizations, other brands' dealers
        (e.g. Glorian on the Olex domain) and non-dealer organizations are
        404. Internal fields (tax number, account, members, e-mail,
        settings) are never returned. `latitude` / `longitude` are null
        together when the dealer has no map position; `whatsapp` is the
        organization phone when it is E.164, otherwise null. Rate limited
        per client IP (120 per minute); over the limit 429 with Retry-After.
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Dealer showcase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicDealer"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Rate limited per client IP
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/public/warranties/{public_code}:
    get:
      tags: [Public]
      operationId: getPublicWarranty
      summary: Public warranty lookup (QR page /garanti/{public_code})
      description: |
        TEC-189. No authentication. Looks up a warranty by its random public
        code inside the brand of the request domain (K20). Returns no personal
        data: no holder name, phone, e-mail or address; the plate is masked
        (e.g. `34 *** 12`) and only the last four VIN characters are shown.
        The warranty of an anonymized customer is still returned (K19).
        Malformed codes (outside `^[A-Za-z0-9_-]{4,32}$`) are 404 without a
        database lookup; malformed, unknown and other-brand codes share the same
        404 body. The path also accepts the old hub's shorter warranty numbers
        (e.g. `DS7K2M9QX4`), which the migrator keeps as the public code
        (TEC-248). Rate limited per client IP (WARRANTY_PUBLIC_RATE_LIMIT per
        WARRANTY_PUBLIC_RATE_WINDOW); over the limit 429 with Retry-After.
        Responses carry `Cache-Control: no-store` and `X-Robots-Tag: noindex`.
      security: []
      parameters:
        - name: public_code
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 32
            pattern: "^[A-Za-z0-9_-]{4,32}$"
      responses:
        "200":
          description: Warranty
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicWarranty"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Rate limited per client IP
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/public/warranties/{public_code}/pdf:
    get:
      tags: [Public]
      operationId: getPublicWarrantyPdf
      summary: Anonymous warranty PDF of the public page
      description: |
        TEC-248. No authentication. Renders (synchronously, Gotenberg) the
        PDF of one active warranty from the public projection only: product,
        period, vehicle brand / model / year, masked plate, last four VIN
        characters, dealer name and city, and a QR code to
        /garanti/{public_code}. No holder and no dealer contact. Malformed,
        unknown, other-brand, expired and void codes share the lookup's 404.
        Rate limited per client IP in its own bucket
        (WARRANTY_PUBLIC_PDF_RATE_LIMIT per WARRANTY_PUBLIC_RATE_WINDOW);
        over the limit 429 with Retry-After.
      security: []
      parameters:
        - name: public_code
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 32
            pattern: "^[A-Za-z0-9_-]{4,32}$"
        - name: lang
          in: query
          required: false
          description: Document language; else Accept-Language, else tr.
          schema:
            type: string
        - name: tz
          in: query
          required: false
          description: IANA time zone of the printed dates; invalid or missing is UTC.
          schema:
            type: string
      responses:
        "200":
          description: The PDF (attachment)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Rate limited per client IP
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: PDF rendering is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/public/short-urls/{token}:
    get:
      tags: [Public]
      operationId: getPublicShortUrl
      summary: Resolve a short URL (frontend /s/{token})
      description: |
        TEC-249. No authentication. Resolves a short URL token inside the
        brand of the request domain (K3) and counts the hit (`hit_count`,
        `last_hit_at`). The target is always an internal path of the brand
        frontend under `/portal`, `/garanti` or `/bayi` (never another
        origin); the frontend route `/s/{token}` answers 302 to it. Tokens are
        case-sensitive base62: new tokens are 10 characters, the old hub's
        migrated tokens 8 (TEC-263). Malformed (outside
        `^[A-Za-z0-9]{4,16}$`), unknown and other-brand tokens share the same
        404 body; an expired token is 410 SHORT_URL_EXPIRED. Rate limited per
        client IP (SHORT_URL_PUBLIC_RATE_LIMIT per
        SHORT_URL_PUBLIC_RATE_WINDOW); over the limit 429 with Retry-After.
        Responses carry `Cache-Control: no-store` and `X-Robots-Tag: noindex`.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 4
            maxLength: 16
            pattern: "^[A-Za-z0-9]{4,16}$"
      responses:
        "200":
          description: Target of the short URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePublicShortUrl"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          description: The short URL has expired (SHORT_URL_EXPIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited per client IP
          headers:
            Retry-After:
              description: Seconds until the window resets
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

