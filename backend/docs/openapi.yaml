        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/accounts/{uuid}/opening-balance:
    post:
      tags: [Accounting]
      operationId: createAccountingAccountOpening
      summary: Book the one-off opening balance of a cash/bank account (step-up)
      description: >-
        TEC-198. Writes the balance a cash or bank account of the active
        organization carries over, once per account: direction opening,
        account only (no cari), in the account's currency, dated at
        opening_date. It raises the account balance and never reaches
        income or expense (P&L). The same opening balance again answers 200
        with the earlier entry; other values while one is open answer 409
        OPENING_BALANCE_EXISTS. Correct it by reversing the entry (POST
        /v1/accounting/entries/{uuid}/void), then book it again. Needs
        accounting.write (dealer roles answer 403) and a recent step-up
        (403 STEP_UP_REQUIRED). Writes finance.entry_posted to the outbox
        and accounting.account_opening_posted to the audit log.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceAccountOpeningInput"
      responses:
        "200":
          description: Replayed (the same opening balance is already booked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "201":
          description: Created opening balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/accounting/cari:
