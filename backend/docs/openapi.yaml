  /v1/vehicles:
    get:
      tags: [Customers]
      operationId: listVehicles
      summary: Vehicles of customers in scope
      description: >-
        vehicles.read. Only vehicles whose customer is linked to an
        organization in scope (domain brand). `customer_uuid` outside the
        scope answers 404; `plate` is a prefix of the normalized plate.
        `q` (TEC-209) searches plate and VIN: the vehicles search index
        when it is up (same scope, hits reloaded from the database),
        otherwise a prefix of the normalized plate or the VIN.
      security:
        - bearerAuth: []
      parameters:
        - name: customer_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: plate
          in: query
          schema: { type: string }
        - name: vin
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehiclePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Customers]
      operationId: createVehicle
      summary: Register a vehicle for a customer in scope
      description: >-
        vehicles.write. The plate is validated against its country's format
        (400 INVALID_PLATE); plate_country defaults to the organization's
        country, then TR. The car brand/model come from the vehicle catalog
        (a model alone implies its brand). VIN is optional, 17 characters
        without I, O, Q. VIN and plate are not unique: `warnings` reports a
        duplicate in the brand.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleCreateInput"
      responses:
        "201":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/vehicles/{uuid}:
    get:
      tags: [Customers]
      operationId: getVehicle
      summary: One vehicle (customer in scope, else 404)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicle"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      operationId: updateVehicle
      summary: Edit a vehicle
      description: >-
        vehicles.write. Absent keys keep the stored value, null clears it
        (the plate cannot be cleared). A vehicle of an anonymized customer
        answers 409 CUSTOMER_ANONYMIZED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdateInput"
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicle"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Customers]
      operationId: deleteVehicle
      summary: Remove a vehicle (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/vehicles/{uuid}/transfers:
    get:
      tags: [Customers]
      operationId: listVehicleTransfers
      summary: Ownership transfers of a vehicle, newest first (TEC-190)
      description: >-
        vehicles.transfer; the vehicle's customer must be in scope (else
        404). A pending transfer past expires_at is shown as expired.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Transfers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleTransferList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Customers]
      operationId: startVehicleTransfer
      summary: Start a vehicle ownership transfer with two codes (TEC-190)
      description: >-
        vehicles.transfer. The new owner is given by phone (E.164, national
        numbers use the organization's country). Two random 6 digit codes
        are generated, one for the current owner and one for the new owner,
        and sent over WhatsApp (SMS fallback when enabled); only salted,
        keyed hashes are stored. The transfer expires after 15 minutes. A
        failed delivery saves nothing (502 VEHICLE_TRANSFER_DELIVERY_FAILED).
        Refusals (409): VEHICLE_TRANSFER_PENDING (one open transfer per
        vehicle), VEHICLE_TRANSFER_SAME_OWNER, VEHICLE_TRANSFER_OWNER_NO_PHONE,
        CUSTOMER_ANONYMIZED / CUSTOMER_INACTIVE. Writes
        vehicle.transfer_started and the audit row
        vehicles.transfer_started. Rate limited per user (429).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleTransferStartInput"
      responses:
        "201":
          description: Started; both codes sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: VEHICLE_TRANSFER_DELIVERY_FAILED (a code could not be delivered; nothing saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: VEHICLE_TRANSFER_UNAVAILABLE (no message sender configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/vehicle-transfers/{uuid}/verify:
    post:
      tags: [Customers]
      operationId: verifyVehicleTransfer
      summary: Enter transfer codes; completes the transfer when both are verified
      description: >-
        vehicles.transfer. Codes can be entered together or one by one. A
        wrong code counts one attempt (422 VEHICLE_TRANSFER_INVALID_CODE,
        details[].code = attempts left); at 5 attempts the transfer is
        cancelled (409 VEHICLE_TRANSFER_LOCKED). A transfer past expires_at
        is marked expired (409 VEHICLE_TRANSFER_EXPIRED). When both codes
        are verified, one transaction moves the vehicle and its active
        warranties to the new owner (one warranty.holder_changed event per
        warranty), links the new owner to the organization and writes
        vehicle.transfer_completed and the audit row; services keep their
        customer. A new owner without an account is created at completion
        and needs new_owner_name (400 VALIDATION_ERROR, nothing is
        verified then). Rate limited per transfer and user (429).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleTransferVerifyInput"
      responses:
        "200":
          description: Codes accepted (status completed when both sides are verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: VEHICLE_TRANSFER_INVALID_CODE (details[].field names the wrong code, details[].code the attempts left)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/vehicle-transfers/{uuid}/cancel:
    post:
      tags: [Customers]
      operationId: cancelVehicleTransfer
      summary: Cancel a pending vehicle transfer
      description: >-
        vehicles.transfer. Writes vehicle.transfer_cancelled (reason
        cancelled) and the audit row. A transfer that is no longer pending
        answers 409 VEHICLE_TRANSFER_NOT_PENDING (expired:
        VEHICLE_TRANSFER_EXPIRED).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

