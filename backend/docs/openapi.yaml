        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/transfers/{uuid}/lines/{line_uuid}:
    delete:
      tags: [Warehouse]
      operationId: deleteWarehouseTransferLine
      summary: Remove a line from a draft warehouse transfer
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - name: line_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarehouseTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/transfers/{uuid}/place:
    post:
      tags: [Warehouse]
      operationId: placeWarehouseTransferLines
      summary: Set the target location of transfer lines (pick or scan)
      description: >-
        Needs `warehouse.write`, draft or in_transit. Exactly one of
        `location_uuid` or `location_code`; the location must be active and
        in the target warehouse (400 otherwise). Lines: `line_uuids`, or the
        lines of the scanned `barcodes`, or every line.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockEntryPlaceInput" }
      responses:
        "200":
          description: Transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarehouseTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/transfers/{uuid}/ship:
    post:
      tags: [Warehouse]
      operationId: shipWarehouseTransfer
      summary: Ship a warehouse transfer (ledger transfer_out, draft -> in_transit)
      description: >-
        Needs `warehouse.write`. In one transaction every line gets a
        `transfer_out` (key
        `warehouse_transfer:warehouse_transfer_line:<line id>:transfer_out:<barcode>`);
        the unit is in transit, owned by the organization, and no other
        flow can pick it. 409 WAREHOUSE_TRANSFER_STATE when not a draft (a
        second ship writes nothing), WAREHOUSE_TRANSFER_EMPTY without lines,
        WAREHOUSE_UNIT_UNAVAILABLE / WAREHOUSE_UNIT_BUSY when a unit left
        the source warehouse or got reserved, WAREHOUSE_LEDGER_REFUSED when
        the ledger refuses (nothing is written).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: In-transit transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarehouseTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/transfers/{uuid}/complete:
    post:
      tags: [Warehouse]
      operationId: completeWarehouseTransfer
      summary: Receive a warehouse transfer (transfer_in + placement, in_transit -> completed)
      description: >-
        Needs `warehouse.write`. In one transaction every line gets the
        paired `transfer_in` and a `placement` onto its target location
        (line target, else the optional body location, else the transfer's
        default location; 409 WAREHOUSE_TRANSFER_UNPLACED when none). 409
        WAREHOUSE_TRANSFER_STATE when not in transit. The body is optional.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseTransferCompleteInput" }
      responses:
        "200":
          description: Completed transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarehouseTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/transfers/{uuid}/cancel:
    post:
      tags: [Warehouse]
      operationId: cancelWarehouseTransfer
      summary: Cancel a warehouse transfer
      description: >-
        Needs `warehouse.write`. A draft closes without stock; an in-transit
        transfer posts `transfer_cancel_restore` per line in one transaction
        (each unit goes back to its source location and status). 409
        WAREHOUSE_TRANSFER_STATE when completed or cancelled.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Cancelled transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarehouseTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/eod-reports:
    get:
      tags: [Warehouse]
      operationId: listEodReports
      summary: List end-of-day reports
      description: >-
        TEC-207. Needs `warehouse.read`; center and distributor only. Stored
        reports of the active organization, newest day first (the system
        report before the warehouse reports of a day). The hourly cron writes
        the previous local day of every center / distributor with a
        warehouse (kind auto); a manual run rewrites a day (kind manual).
      security:
        - bearerAuth: []
      parameters:
        - name: warehouse_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          description: "system: only system reports; warehouse: only warehouse reports."
          schema: { type: string, enum: [system, warehouse] }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Report page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEodReportPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Warehouse]
      operationId: generateEodReport
      summary: Build (or rebuild) an end-of-day report now
      description: >-
        TEC-207. Needs `warehouse.write`. Summarizes the ledger movements of
        one calendar day of the active organization in its time zone (stock
        entries, placements, transfers, order shipments / receipts, service
        consumption, returns, adjustments, disposals) by group, movement type
        and product, and stores it (kind manual, replacing an existing report
        of the same scope and day). Without warehouse_uuid it is the system
        report (every warehouse plus organization-level movements). date
        defaults to today (the day so far); a future day is 400.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EodReportGenerateInput"
      responses:
        "200":
          description: Stored report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEodReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/warehouse/eod-reports/{uuid}:
    get:
      tags: [Warehouse]
      operationId: getEodReport
      summary: An end-of-day report
      description: Needs `warehouse.read`. 404 EOD_REPORT_NOT_FOUND outside the active organization.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeEodReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/warehouse/eod-reports/{uuid}/pdf:
    post:
      tags: [Warehouse]
      operationId: requestEodReportPdf
      summary: Queue the PDF of an end-of-day report
      description: >-
        TEC-207. Needs `warehouse.read`. The stored report is rendered on the
        organization's letterhead by an export job on worker-docs (Gotenberg,
        RTL for ar) in the requested language. Poll and download through
        /v1/warehouse/eod-report-pdfs/{uuid}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePdfInput"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Exports are not configured

  /v1/warehouse/eod-report-pdfs/{uuid}:
    get:
      tags: [Warehouse]
      operationId: getEodReportPdfJob
      summary: An end-of-day report PDF job of the active organization
      description: download_url points at /v1/warehouse/eod-report-pdfs/{uuid}/download once completed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Export job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/warehouse/eod-report-pdfs/{uuid}/download:
    get:
      tags: [Warehouse]
      operationId: downloadEodReportPdf
      summary: Download a completed end-of-day report PDF
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/product-images/{key}:
    get:
      tags: [Catalog]
      operationId: getPublicProductImage
      summary: Product image (public, cacheable)
      description: >-
        No auth, no signed URL. The frontend serves it at the fixed URL
        `/product-images/{key}`. Answers the uploaded image with a strong
        `ETag` and `Cache-Control: public, max-age=86400`; a matching
        `If-None-Match` gets 304. Only images of active products are served;
        removed, unknown and inactive-product images are 404.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32}\\.(jpg|png|webp)$" }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Image bytes
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304":
          description: Not modified (If-None-Match matched the ETag)
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/brand-logos/{uuid}:
    get:
      tags: [VehicleCatalog]
      operationId: getPublicBrandLogo
      summary: Car brand logo (public, cacheable)
      description: >-
        No auth, no signed URL. The frontend serves it at the fixed URL
        `/brand-logos/{uuid}`. Answers the stored logo (JPEG/PNG/WebP) with a
        strong `ETag` and `Cache-Control: public, max-age=86400`; a matching
        `If-None-Match` gets 304. The ETag changes with every upload. A brand
        without a logo gets an SVG placeholder (`max-age=3600`).
      security: []
      parameters:
        - $ref: "#/components/parameters/VehicleCatalogUUID"
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Logo bytes (or the placeholder)
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "304":
          description: Not modified (If-None-Match matched the ETag)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/vehicle-heroes/default:
    get:
      tags: [VehicleCatalog]
      operationId: getPublicDefaultVehicleHero
      summary: Default vehicle hero image (public)
      security: []
      responses:
        "200":
          description: Default hero (SVG)
          content:
            image/svg+xml: { schema: { type: string, format: binary } }
        "304":
          description: Not modified

  /v1/public/vehicle-heroes/brands/{uuid}:
    get:
      tags: [VehicleCatalog]
      operationId: getPublicBrandHero
      summary: Car brand hero image (public, cacheable)
      description: Brand hero → default image. Same cache rules as the brand logo.
      security: []
      parameters:
        - $ref: "#/components/parameters/VehicleCatalogUUID"
      responses:
        "200":
          description: Hero bytes (or the default image)
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "304":
          description: Not modified
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/vehicle-heroes/models/{uuid}:
    get:
      tags: [VehicleCatalog]
      operationId: getPublicModelHero
      summary: Car model hero image (public, cacheable)
      description: Model hero → brand hero → default image. Same cache rules as the brand logo.
      security: []
      parameters:
        - $ref: "#/components/parameters/VehicleCatalogUUID"
      responses:
        "200":
          description: Hero bytes (or the fallback)
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "304":
          description: Not modified
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/vehicle-catalog/brands:
    get:
      tags: [VehicleCatalog]
      operationId: listVehicleBrands
      summary: Car brands (paged, searchable)
      description: >-
        Needs `vehicle_catalog.read`. Global reference data, no organization
        context. Readers without `vehicle_catalog.write` see active brands
        only and `active` is ignored for them.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleBrandPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/vehicle-catalog/brands/{uuid}:
    get:
      tags: [VehicleCatalog]
      operationId: getVehicleBrand
      summary: One car brand
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleCatalogUUID"
      responses:
        "200":
          description: Brand
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleBrand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/vehicle-catalog/models:
    get:
      tags: [VehicleCatalog]
      operationId: listVehicleModels
      summary: Car models (paged; search "brand model" or external id)
      description: >-
        Needs `vehicle_catalog.read`. `q` matches "brand model" text or the
        exact external id; `brand_uuid` limits to one brand. Readers without
        `vehicle_catalog.write` see active models of active brands only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - name: brand_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleModelPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/vehicle-catalog/models/{uuid}:
    get:
      tags: [VehicleCatalog]
      operationId: getVehicleModel
      summary: One car model
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VehicleCatalogUUID"
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleModel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Customers linked to the organizations in scope
      description: >-
        customers.read. A dealer sees the customers linked to its organization
        (customer_organizations), a distributor its subtree, the center the
        brand; always the domain brand (K20). Anonymized customers are listed
        masked (`anonymized: true`, localized name, no contact data). TEC-164:
        `q` searches the Meilisearch customers index when it is up (filtered
        on the scope's organizations and the brand, ranked by relevance; the
        hits are reloaded from Postgres with the same scope) and falls back to
        the SQL search otherwise. Anonymized customers are never indexed, so
        `status=anonymized` always uses the SQL search.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Q"
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled, pending, anonymized] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create or link a customer by phone (one phone = one user)
      description: >-
        customers.write. The phone is normalized to E.164 (default region:
        the organization's country, TR when unknown). An existing user with
        that phone is linked to the active organization instead of creating
        a second user (200, `existing_user: true`); its name, e-mail and
        profile are only filled where empty, differing values are listed in
        `ignored_fields`. A new user gets the customer role (201). National
        id and tax number are stored encrypted; only their last four
        characters are ever returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateInput"
      responses:
        "200":
          description: Existing user linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerWrite"
        "201":
          description: New customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerWrite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: PII_ENCRYPTION_UNAVAILABLE (CUSTOMER_PII_KEY not configured)

  /v1/customers/{uuid}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: One customer of the scope
      description: Out-of-scope customers answer 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Edit a customer
      description: >-
        customers.write. Absent keys keep the stored value, null or "" clears
        it. Values are replaced only when `identity_editable` is true (every
        link of the customer is in the caller's scope and the user has no
        panel membership); otherwise only empty fields are filled and the rest
        is listed in `ignored_fields`. Anonymized customers answer 409
        CUSTOMER_ANONYMIZED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerWrite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: PII_ENCRYPTION_UNAVAILABLE (CUSTOMER_PII_KEY not configured)

  /v1/customers/{uuid}/upgrade-to-dealer:
    post:
      tags: [Customers]
      operationId: upgradeCustomerToDealer
      summary: Make a customer a member of an existing dealer
      description: >-
        customers.write in a center organization or a distributor above the
        dealer (dealers get 403, dealers outside the reach 404). Adds an
        organization_members row with the dealer_owner or dealer_staff role;
        no organization is created. The customer role, links, vehicles and
        history stay, so the same user signs in to the portal (WhatsApp OTP)
        and to the panel. A second upgrade into the same dealer answers 409
        ALREADY_MEMBER.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpgradeInput"
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerUpgrade"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/customers/{uuid}/anonymize:
    post:
      tags: [Customers]
      operationId: anonymizeCustomer
      summary: KVKK/GDPR anonymization of a customer (irreversible, idempotent)
      description: >-
        customers.anonymize (center roles) in a center organization, plus a
        fresh step-up (403 STEP_UP_REQUIRED). No row is deleted: vehicles,
        plates/VINs, services and warranties stay attached to the user.
        Name, surname, e-mail, phone, timezone, address, company, tax office
        and the encrypted identity numbers are overwritten; the account gets
        status anonymized, its refresh tokens are revoked and it can no
        longer sign in. A second call answers 200 with changed=false and
        changes nothing. A customer who is also an organization user answers
        409 CUSTOMER_HAS_PANEL_ACCOUNT. Every call is written to the audit
        log (customers.anonymized).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Anonymized (or already anonymized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerAnonymizeResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/customers/{uuid}/merge/preview:
    post:
      tags: [Customers]
      operationId: previewCustomerMerge
      summary: Dry run of a customer merge (writes nothing)
      description: >-
        customers.merge (center roles) in a center organization. Runs the
        same statements as the merge in a transaction that is rolled back
        and reports what would move from this customer (source) to
        target_uuid: vehicles, services, warranties, organization links and
        consents, the unique-key conflicts that are folded (a link to the
        same organization on both users) and the records that stay with the
        source. No audit row, no event. Refusals (409):
        CUSTOMER_MERGE_SELF, CUSTOMER_ALREADY_MERGED (source or target was
        already merged), CUSTOMER_MERGE_ANONYMIZED,
        CUSTOMER_HAS_PANEL_ACCOUNT (either user is an organization user),
        CUSTOMER_MERGE_PENDING_TRANSFER (open vehicle transfer of the
        source), CUSTOMER_INACTIVE (target disabled).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerMergeInput"
      responses:
        "200":
          description: What the merge would move
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerMergeResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/customers/{uuid}/merge:
    post:
      tags: [Customers]
      operationId: mergeCustomer
      summary: Merge this customer (source) into another one (irreversible)
      description: >-
        customers.merge (center roles) in a center organization, plus a
        fresh step-up (403 STEP_UP_REQUIRED). One transaction: vehicles,
        services (following their vehicle), warranties (holder),
        organization links (duplicates folded into the target's link),
        consents and the profile move to target_uuid; the phone / e-mail the
        target lacks is handed over. Nothing is deleted: the source keeps
        its row with merged_into_user_id = target and status disabled, its
        refresh tokens are revoked and it can no longer sign in. Customer
        cari accounts are not moved (reported). Writes the audit row
        customers.merged and the outbox event customer.merged. Same
        refusals as the preview.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerMergeInput"
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerMergeResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

