  /v1/stock/organizations/{uuid}/units:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Stock]
      operationId: listStockOrganizationUnits
      summary: Units held by an organization
      description: >-
        Needs `stock.read`; the organization must be inside the viewer's
        reach (404 otherwise). The distributor roles distributor_owner and
        distributor_warehouse_staff hold `stock.read` at scope `subtree`
        (TEC-216, migration 000061), so a distributor lists the units of
        its own dealers; it still cannot write or adjust them. Serial units
        come from `unit_current_state` (one row, `quantity` 1), fixed
        barcodes from `fixed_barcode_holdings` (one row per barcode with
        the quantity on hand). Without `status` the list holds the units
        counted as stock (available, placed); `status` lists exactly that
        status. `barcode` is an exact match, `product_uuid` narrows to one
        product, `q` matches a part of the product name, SKU or barcode
        (TEC-210: when Meilisearch is up and no `barcode` is given the stock
        units index answers it, which also matches the bin full_code; hits
        are reloaded from Postgres with the same filters).
        `purchase_price` is the price the holding organization pays for
        the product (K8, in the organization's currency); it is null when
        the viewer's `pricing.purchase.read` does not reach the
        organization (a direct parent sees its child's purchase price
        through its own `pricing.sale.read`), for the center, or when no
        price is set.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/StockProductUUIDFilter"
        - $ref: "#/components/parameters/StockUnitStatusFilter"
        - $ref: "#/components/parameters/StockBarcodeFilter"
      responses:
        "200":
          description: Units of the organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockUnitPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

