        price: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        currency: { type: string, minLength: 3, maxLength: 3 }

    ServiceCatalogOverride:
      type: object
      required: [organization_uuid, price, currency]
