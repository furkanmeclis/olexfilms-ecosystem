        status, the customer (phone masked, anonymized customers labelled),
        the vehicle (brand, model, year, plate, VIN), every item with its
        unit barcode, amount (pieces / metres / whole unit) and applied parts,
        and the warranty summary with a QR code per warranty pointing at
        PUBLIC_FRONTEND_URL/garanti/{public_code}. The job runs on
        worker-docs (exports queue) and is rendered by Gotenberg in the
        requested language (RTL for ar). Needs services.read; a service
        outside the scope answers 404. Poll and download through
        /v1/service-pdfs/{uuid}.
