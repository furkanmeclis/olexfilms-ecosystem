  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Orders inside the orders.read scope (sales and purchases)
      description: >-
        Every order where an organization of the orders.read scope is the
        seller or the buyer (managed: the active organization's own sales and
        purchases; a dealer never sees its distributor's other dealers).
        side=seller|buyer limits the list to the active organization's sales
        or purchases. List rows carry no items or history. `q` (TEC-210)
        searches the order number, tracking number and external reference;
        when Meilisearch is up (and no created_from / created_to is given)
        the orders index answers it, which also matches the seller and
        buyer names and dealer codes, inside the same scope (hits are
        reloaded from Postgres).
      security:
        - bearerAuth: []
      parameters:
        - name: side
          in: query
          schema: { type: string, enum: [seller, buyer] }
        - $ref: "#/components/parameters/Q"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: created_from
          in: query
          description: >-
            Inclusive lower bound of created_at (TEC-170): RFC3339, or a
            YYYY-MM-DD day in UTC.
          schema: { type: string }
        - name: created_to
          in: query
          description: >-
            Exclusive upper bound of created_at: RFC3339, or a YYYY-MM-DD day
            in UTC that covers the whole day. Must be after created_from.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Open a draft order of the active organization to its parent (K6)
      description: >-
        The active organization is the buyer and its parent the seller:
        distributor -> center or dealer -> distributor (anything else is 422
        ORDER_NO_SUPPLIER). The currency is the brand currency. Unit prices
        are the buyer's effective purchase price from the pricing module
        (K8); price fields sent by the client are ignored. A product without
        a price in the order currency is 400 with detail code
        PRICE_NOT_FOUND. Needs orders.write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
