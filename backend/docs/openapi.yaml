        completed 422 SERVICE_REVIEW_NOT_COMPLETED; a read-only fleet
        session 403 PORTAL_READ_ONLY (TEC-245).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalServiceReviewInput"
      responses:
        "201":
          description: Review stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePortalServiceReview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
