  # TEC-203: universal scan resolver.
  /v1/warehouse/scan:
    post:
      tags: [Warehouse]
      operationId: resolveWarehouseScan
      summary: Resolve one scanned code (location QR, unit barcode, SKU, short code)
      description: >-
        Needs `warehouse.read` with the warehouse module on (center or
        distributor, 403 for dealers, K12). Resolution order:
        `OFW:LOC:<full_code>` -> a location of the active organization (404
        SCAN_LOCATION_NOT_FOUND otherwise, nothing else is tried);
        `OFW:UNIT:<barcode>` -> that unit; a unit barcode (generated
        `<PREFIX>-<8 digits>`, roll split `<barcode>-S<n>`, legacy/import
        barcodes; exact, then upper-cased); a bare location full_code when
        `scan.bare_location_code_enabled`; a product SKU of the active brand
        when `scan.sku_enabled`; a 1-8 digit short code (optionally `-S<n>`)
        expanded to `<PREFIX>-<8 digits>` when `scan.short_code_enabled`
        (prefix `scan.short_code_prefix`, else the brand's default prefix).
        Units follow the caller's `stock.read` reach like the barcode history
        (a distributor sees its dealers' units, TEC-216); a unit outside the
        reach, or any unknown code, is 404 SCAN_NO_MATCH. An empty code is 400
        VALIDATION_ERROR.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseScanInput" }
      responses:
        "200":
          description: Resolved entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarehouseScanResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: SCAN_NO_MATCH or SCAN_LOCATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/warehouse/stock-entries:
    get:
      tags: [Warehouse]
      operationId: listStockEntries
      summary: List the stock entry documents of the active organization
      description: >-
        Needs `warehouse.read` with the warehouse module on (center or
        distributor, K12). Newest first; entries written by an applied stock
        import (TEC-158) have mode `import`. An unknown status is 400
        VALIDATION_ERROR.
      security:
        - bearerAuth: []
      parameters:
