        category: { $ref: "#/components/schemas/ServiceCatalogCategory" }
        default_price: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        recurrence: { $ref: "#/components/schemas/ServiceCatalogRecurrence" }
        cancellation_fee: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$', default: "0" }
        contract_template_id: { type: [integer, "null"], format: int64 }
        is_active: { type: boolean, default: true }

    ServiceCatalogItemPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        category: { $ref: "#/components/schemas/ServiceCatalogCategory" }
        default_price: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        recurrence: { $ref: "#/components/schemas/ServiceCatalogRecurrence" }
        cancellation_fee: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
        contract_template_id: { type: [integer, "null"], format: int64 }
        is_active: { type: boolean }

    ServiceCatalogModulesInput:
