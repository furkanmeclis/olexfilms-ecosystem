      tags: [Orders]
      operationId: replaceOrderItems
      summary: Replace the lines of a draft order (buyer, orders.write)
      description: >-
        Prices are fetched again from the pricing module; client prices are
        ignored. Only drafts are editable (409 ORDER_NOT_EDITABLE).
      security:
        - bearerAuth: []
