        meters: { type: [string, "null"], description: Remaining meters of a roll when requested }
        unit_price: { type: [string, "null"], description: Giver's purchase price frozen at approval (K13) }
        line_total: { type: [string, "null"] }
        shipped: { type: boolean, description: The transfer_out movement is written }
        received: { type: boolean, description: The transfer_in movement is written }
        restored: { type: boolean, description: The transfer_cancel_restore movement is written }
