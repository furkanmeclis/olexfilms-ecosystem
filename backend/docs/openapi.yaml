        uuid: { type: string, format: uuid }
        date: { type: string, format: date-time }
        direction: { $ref: "#/components/schemas/AccountingDirection" }
        category: { type: string }
        category_label: { type: string, description: Category in the report language }
        description: { type: string, description: "Entry description, or the category label when empty" }
        source_type: { type: [string, "null"], example: manual }
        source_uuid: { type: [string, "null"], format: uuid }
        source_label: { type: string, example: Manual entry }
        reversal_of_uuid: { type: [string, "null"], format: uuid }
        reversed: { type: boolean, description: A later row reverses this one (no longer disputable) }
        orig_currency: { type: string, minLength: 3, maxLength: 3 }
        orig_amount: { $ref: "#/components/schemas/AccountingAmount" }
        debit: { $ref: "#/components/schemas/AccountingAmount" }
        credit: { $ref: "#/components/schemas/AccountingAmount" }
