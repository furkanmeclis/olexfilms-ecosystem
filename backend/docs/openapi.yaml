        Only while the service is draft, pending or processing (409
        SERVICE_NOT_EDITABLE). The unit must be held by the service
        organization (serial: available or placed; fixed barcode: enough
        pieces on hand), else 409 SERVICE_UNIT_NOT_AVAILABLE. A serial unit
        already in an open service (this one included) is 409
        SERVICE_UNIT_IN_USE; a roll may be cut (partial, meters) for several
        services but a whole roll excludes other uses. applied_parts must be
        in the product category's available_parts.
      security:
