    get:
      tags: [Portal]
      operationId: getPortalServicePdf
      summary: Service PDF of the signed-in customer
      description: >-
        TEC-239. Portal session (services.read, scope customer); same
        ownership rule as GET /v1/portal/services/{uuid} (else 404). Uses the
        service PDF render (TEC-196) and prints only the warranties the user
        holds. A completed render of the same locale, newer than the last
        service change and younger than 24 hours, answers 200 with its
        download_url; otherwise a running job (younger than 15 minutes) is
        returned or a new one is queued, with 202. Poll and download through
        /v1/portal/exports/{uuid}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - name: locale
          in: query
          required: false
          description: Document language (one of the 13 supported locales); defaults to the user language.
          schema: { type: string }
      responses:
        "200":
          description: A completed render exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "202":
          description: Render queued or running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Exports are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

