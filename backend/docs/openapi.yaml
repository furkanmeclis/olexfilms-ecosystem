        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockEntryPlaceInput" }
      responses:
        "200":
          description: Entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/stock-entries/{uuid}/confirm:
    post:
      tags: [Warehouse]
      operationId: confirmStockEntry
      summary: Confirm a stock entry (ledger entry + placement)
      description: >-
        Needs `warehouse.write`. In one transaction every line is posted
        through the stock ledger with the idempotency key
        `stock_entry:stock_entry_line:<line id>:<type>:<barcode>`: serial
        units get an `entry` into the organization and a `placement` on
        their location; fixed barcodes an `entry` straight into their
        location. Printed -> entry happens at a center only (403
        STOCK_ENTRY_CENTER_ONLY, K14). 409 STOCK_ENTRY_NOT_DRAFT when the
        entry is already confirmed (a second confirm writes nothing),
        STOCK_ENTRY_EMPTY without lines, STOCK_ENTRY_UNPLACED while a line
        has no location, STOCK_ENTRY_LEDGER_REFUSED when the ledger refuses a
        movement (nothing is written).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Confirmed entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not center/distributor, or STOCK_ENTRY_CENTER_ONLY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

