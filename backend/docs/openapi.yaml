      tags: [Portal]
      operationId: putPlatformLegalText
      summary: Publish a new version of one locale's text (Markdown)
      description: |
        Requires `platform.legal_texts.write`. A changed body becomes a new
        version and every portal user is asked again; an unchanged body is
        not a new version (`created=false`).
      security:
        - bearerAuth: []
      requestBody:
