        recurrence: { $ref: "#/components/schemas/ServiceCatalogRecurrence" }
        cancellation_fee:
          type: [string, "null"]
          description: Present only when pricing visibility permits it.
        contract_template_id: { type: [integer, "null"], format: int64 }
        is_active: { type: boolean }
        modules:
          type: array
          items: { type: string }
        effective_price:
          oneOf:
            - $ref: "#/components/schemas/ServiceCatalogPrice"
            - type: "null"
          description: Effective buyer price, omitted or null when pricing visibility is masked.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

