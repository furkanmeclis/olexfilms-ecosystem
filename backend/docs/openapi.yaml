    PriceAmount:
      type: string
      pattern: '^[0-9]{1,10}(\.[0-9]{1,4})?$'
      description: Non-negative decimal (NUMERIC(14,4)) as a string.
      example: "1250.50"

    EffectivePrice:
      type: object
      description: >-
        One currency of a product as the caller may see it. A field the caller
        may not see is absent. center: purchase_price (its own, source own,
        pricing.purchase.read), sale_price (to distributors,
        pricing.sale.read), recommended_sale_price (pricing.recommended.read).
        distributor: purchase_price (its distributor-specific price, else the
        center's sale price to distributors; source override or list) and
        sale_price (its own price to dealers). dealer: purchase_price only (its
        parent distributor's dealer price, source distributor).
      required: [currency]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3, example: TRY }
        purchase_price: { $ref: "#/components/schemas/PriceAmount" }
        purchase_price_source:
          type: string
          enum: [own, list, override, distributor]
        sale_price: { $ref: "#/components/schemas/PriceAmount" }
        recommended_sale_price: { $ref: "#/components/schemas/PriceAmount" }

    ProductPriceView:
      type: object
      required: [product_uuid, sku, name, viewer, prices]
      properties:
        product_uuid: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        viewer:
          type: string
          enum: [center, distributor, dealer]
        prices:
          type: array
          items: { $ref: "#/components/schemas/EffectivePrice" }

    ListPriceInput:
      type: object
      additionalProperties: false
      description: Absent keeps the stored value; null clears it.
      properties:
        purchase_price:
          oneOf:
            - $ref: "#/components/schemas/PriceAmount"
            - type: "null"
        sale_to_distributor_price:
          oneOf:
            - $ref: "#/components/schemas/PriceAmount"
            - type: "null"
        recommended_sale_price:
          oneOf:
            - $ref: "#/components/schemas/PriceAmount"
            - type: "null"

    PriceInput:
      type: object
      additionalProperties: false
      required: [price]
      properties:
        price: { $ref: "#/components/schemas/PriceAmount" }

    DistributorPrice:
      type: object
      required: [product_uuid, product_sku, product_name, distributor_uuid, distributor_name, currency, price, updated_at]
      properties:
        product_uuid: { type: string, format: uuid }
        product_sku: { type: string }
        product_name: { type: string }
        distributor_uuid: { type: string, format: uuid }
        distributor_name: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        price: { $ref: "#/components/schemas/PriceAmount" }
        updated_at: { type: string, format: date-time }

    EnvelopeProductPriceView:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ProductPriceView" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

