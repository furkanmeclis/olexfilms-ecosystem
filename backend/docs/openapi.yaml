          description: Currencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCurrencyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/platform/exchange-rates:
    get:
      tags: [Rates]
      operationId: listExchangeRates
      summary: Stored rates of a day (platform.rates.read)
      description: Without date the latest stored day up to today. effective marks the row the resolver uses.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: base
          in: query
          schema: { type: string, example: EUR }
      responses:
        "200":
          description: Rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExchangeRateDay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/exchange-rates/resolve:
    get:
      tags: [Rates]
      operationId: resolveExchangeRate
      summary: The rate a record of that day would freeze (rate_snapshot)
      description: >-
        Latest stored day not after `date` (up to 10 days back), on that day
        manual > tcmb > ecb, either direction; otherwise a cross rate via TRY
        or EUR. 404 RATE_NOT_FOUND when nothing qualifies.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: base
          in: query
          required: true
          schema: { type: string, example: EUR }
        - name: quote
          in: query
          required: true
          schema: { type: string, example: TRY }
      responses:
        "200":
          description: Rate snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRateSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/exchange-rates/override:
    put:
      tags: [Rates]
      operationId: setExchangeRateOverride
      summary: Manual rate for a day and pair; wins over TCMB/ECB (platform.rates.write)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateOverrideRequest"
      responses:
        "200":
          description: Stored override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRateSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Rates]
      operationId: clearExchangeRateOverride
      summary: Remove a manual rate; the fetched value applies again (platform.rates.write)
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: base
          in: query
          required: true
          schema: { type: string }
        - name: quote
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/platform/exchange-rates/fetch:
    post:
      tags: [Rates]
      operationId: fetchExchangeRates
      summary: Fetch TCMB and ECB now (platform.rates.write)
      description: The worker-core scheduler runs the same fetch on weekdays 18:30 and daily 10:15 (Europe/Istanbul).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fetch report per source (a failing source carries error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFetchReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/portal/consents/pending:
    get:
      tags: [Portal]
      operationId: getPortalPendingConsents
      summary: Legal texts the portal user still has to answer
      description: |
        Returns the current version of each legal text (AI guidelines, K22)
        the user has not answered yet. A declined text is not asked again
        until a new version is published. Locale: `locale` query, else
        Accept-Language; falls back to tr, then en.
      security:
        - bearerAuth: []
      parameters:
        - name: locale
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalTextList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/portal/consents:
    post:
      tags: [Portal]
      operationId: postPortalConsent
      summary: Record accept / decline of a legal text version
      description: |
        Records the decision with time, IP and user agent. Answering the same
        version twice keeps the first decision. A version that is no longer
        current answers 409 `LEGAL_TEXT_STALE`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentDecisionRequest"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConsent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: LEGAL_TEXT_STALE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/legal-texts/{kind}:
    parameters:
      - name: kind
