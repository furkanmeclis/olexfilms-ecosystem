        Mobile mirror (TEC-235) of `POST /v1/warehouse/transfers/{uuid}/place`: same handler, permission, warehouse module gate and active organization scope (a distributor reaches its own warehouses only, never the center's: K4, K20). Bearer with `aud=mobile`; a panel token answers 403 `REALM_FORBIDDEN`; a missing or unsupported `X-Mobile-Api-Version` answers 426.

        Needs `warehouse.write`, draft or in_transit. Exactly one of `location_uuid` or `location_code`; the location must be active and in the target warehouse (400 otherwise). Lines: `line_uuids`, or the lines of the scanned `barcodes`, or every line.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MobileApiVersion'
      - $ref: '#/components/parameters/ResourceUUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockEntryPlaceInput'
      responses:
        '200':
          description: Transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWarehouseTransfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/MobileApiVersionUnsupported'
  /v1/mobile/warehouse/transfers/{uuid}/ship:
    post:
      tags:
      - Mobile
      operationId: mobileShipWarehouseTransfer
      summary: 'Mobile: Ship a warehouse transfer (ledger transfer_out, draft -> in_transit)'
      description: |
        Mobile mirror (TEC-235) of `POST /v1/warehouse/transfers/{uuid}/ship`: same handler, permission, warehouse module gate and active organization scope (a distributor reaches its own warehouses only, never the center's: K4, K20). Bearer with `aud=mobile`; a panel token answers 403 `REALM_FORBIDDEN`; a missing or unsupported `X-Mobile-Api-Version` answers 426.

        Needs `warehouse.write`. In one transaction every line gets a `transfer_out` (key `warehouse_transfer:warehouse_transfer_line:<line id>:transfer_out:<barcode>`); the unit is in transit, owned by the organization, and no other flow can pick it. 409 WAREHOUSE_TRANSFER_STATE when not a draft (a second ship writes nothing), WAREHOUSE_TRANSFER_EMPTY without lines, WAREHOUSE_UNIT_UNAVAILABLE / WAREHOUSE_UNIT_BUSY when a unit left the source warehouse or got reserved, WAREHOUSE_LEDGER_REFUSED when the ledger refuses (nothing is written).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MobileApiVersion'
      - $ref: '#/components/parameters/ResourceUUID'
      responses:
        '200':
          description: In-transit transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWarehouseTransfer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/MobileApiVersionUnsupported'
  /v1/mobile/warehouse/transfers/{uuid}/complete:
    post:
      tags:
      - Mobile
      operationId: mobileCompleteWarehouseTransfer
      summary: 'Mobile: Receive a warehouse transfer (transfer_in + placement, in_transit -> completed)'
      description: |
        Mobile mirror (TEC-235) of `POST /v1/warehouse/transfers/{uuid}/complete`: same handler, permission, warehouse module gate and active organization scope (a distributor reaches its own warehouses only, never the center's: K4, K20). Bearer with `aud=mobile`; a panel token answers 403 `REALM_FORBIDDEN`; a missing or unsupported `X-Mobile-Api-Version` answers 426.

        Needs `warehouse.write`. In one transaction every line gets the paired `transfer_in` and a `placement` onto its target location (line target, else the optional body location, else the transfer's default location; 409 WAREHOUSE_TRANSFER_UNPLACED when none). 409 WAREHOUSE_TRANSFER_STATE when not in transit. The body is optional.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MobileApiVersion'
      - $ref: '#/components/parameters/ResourceUUID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseTransferCompleteInput'
      responses:
        '200':
          description: Completed transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWarehouseTransfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/MobileApiVersionUnsupported'
  /v1/mobile/warehouse/transfers/{uuid}/cancel:
    post:
      tags:
      - Mobile
      operationId: mobileCancelWarehouseTransfer
      summary: 'Mobile: Cancel a warehouse transfer'
      description: |
        Mobile mirror (TEC-235) of `POST /v1/warehouse/transfers/{uuid}/cancel`: same handler, permission, warehouse module gate and active organization scope (a distributor reaches its own warehouses only, never the center's: K4, K20). Bearer with `aud=mobile`; a panel token answers 403 `REALM_FORBIDDEN`; a missing or unsupported `X-Mobile-Api-Version` answers 426.

        Needs `warehouse.write`. A draft closes without stock; an in-transit transfer posts `transfer_cancel_restore` per line in one transaction (each unit goes back to its source location and status). 409 WAREHOUSE_TRANSFER_STATE when completed or cancelled.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MobileApiVersion'
      - $ref: '#/components/parameters/ResourceUUID'
      responses:
        '200':
          description: Cancelled transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeWarehouseTransfer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '426':
          $ref: '#/components/responses/MobileApiVersionUnsupported'

  # --- TEC-91: QR web sign-in (web side) ---------------------------------
  /v1/auth/qr/start:
    post:
      tags: [Mobile]
      operationId: postAuthQRStart
      summary: Start a QR web sign-in
      description: |
        For a browser that is not signed in. Returns the code (shown as the
        QR `payload`), a secret only this browser knows, and a short-lived
        anonymous Centrifugo connection token subscribed to `qr:{code}`
        only (subscribe-only namespace). The channel carries `{status}`
        only: `scanned`, `approved`, `rejected`, `consumed`. Lifetime
        `QR_LOGIN_TTL` (120 s). Fallback: poll `GET /v1/auth/qr/{code}/status`.
      security: []
      responses:
        "201":
          description: Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRStart"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/qr/{code}/status:
    get:
      tags: [Mobile]
      operationId: getAuthQRStatus
      summary: QR web sign-in status (polling)
      security: []
      parameters:
        - $ref: "#/components/parameters/QRCode"
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/QRLoginExpired"

  /v1/auth/qr/complete:
    post:
      tags: [Mobile]
      operationId: postAuthQRComplete
      summary: Exchange an approved QR sign-in for a panel session
      description: |
        Single use. Called server side by the BFF (Auth.js `qr-login`
        provider); the panel BFF never forwards it from the browser. 403
        `QR_LOGIN_REJECTED`, 409 `QR_LOGIN_PENDING` / `QR_LOGIN_CLOSED`, 410
        `QR_LOGIN_EXPIRED`, 422 `QR_LOGIN_INVALID_SECRET`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QRCompleteRequest"
      responses:
        "200":
          description: Panel token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRComplete"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/QRLoginExpired"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

