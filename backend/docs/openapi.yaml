openapi: 3.1.0
info:
  title: Olexfilms API
  version: 0.1.0
  summary: Olexfilms HTTP API — auth, RBAC, organizations, platform infrastructure
  description: |
    Olexfilms Ecosystem HTTP API (infrastructure layer of the F0 base).

    **In scope (F0 base):** authentication, global RBAC, platform users/roles,
    organizations, notifications, Web Push (VAPID), passkeys, step-up, storage,
    import/export/bulk engines, search, logs, and Centrifugo realtime tokens.

    Business modules arrive with their own Linear issues. Live Go routes
    (`backend/internal/modules/**/routes.go`) are the source of truth if a path
    below is missing from the router.

    **Roles (TEC-85, scoped RBAC):**
    - `super_admin` — platform role; assigned via `make create-super-admin`; the
      only role that may impersonate.
    - Organization roles granted per membership: `center_staff`,
      `center_warehouse`, `center_accounting`, `center_social`,
      `distributor_owner|staff|warehouse_staff|accounting`,
      `dealer_owner|staff|accounting`.
    - Global portal roles: `customer`, `fleet` (read-only).
    - Every grant has a scope: `all > brand > subtree > managed > assigned > own`
      (`customer` only covers itself). `make roles-sync` reconciles the DB with
      the Go catalog (`backend/internal/platform/rbac/catalog.go`).
    - Custom roles via `/v1/platform/roles`

    **Auth:** Bearer JWT access tokens + opaque refresh tokens.
    See `backend/docs/auth.md` for the permission matrix and token claims.
    Error catalog: `backend/docs/api/errors.md`.

    **Conventions:**
    - Success/error envelope: `{success,data|error,meta.request_id}` on all `/v1/*`.
    - Lists: `{items,total,limit,offset}` under `data` (`limit`/`offset`/`q`/`sort`; never `page`/`search`).
    - Probes `/healthz` and `/readyz` are **not** enveloped.
    - See `backend/API_CONVENTIONS.md` and `backend/docs/api/errors.md`.
  contact:
    name: Olexfilms
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://127.0.0.1:8080
    description: Local development

tags:
  - name: Health
    description: Liveness and readiness probes
  - name: Auth
    description: Register, login, tokens, sessions, profile
  - name: Search
    description: Command-palette search (Meilisearch-backed record lookup)
  - name: Platform
    description: Super-admin platform tenant/user catalog
  - name: Realtime
    description: Centrifugo connection and subscription tokens
  - name: Notifications
    description: In-app notification center, preferences, and admin send
  - name: Announcements
    description: "Duyuru API: authoring, feed, read receipts and unread badge"
  - name: WhatsApp
    description: WhatsApp gateway (wuzapi), phone OTP and the wuzapi webhook
  - name: Portal
    description: |
      Customer / fleet portal (TEC-90). `/v1/portal/*` accepts portal session
      tokens (JWT `aud=portal`) only; a portal token is refused on panel routes
      (platform, tenant, organizations, ...) with 403 `REALM_FORBIDDEN`.
  - name: Features
    description: Module packages (feature flags), Özellikler page, dealer standard
  - name: Documents
    description: PDF document templates (Gotenberg) and rendered documents
  - name: Geo
    description: Countries, provinces, districts, distributor territories and plate formats
  - name: Rates
    description: Currencies and daily exchange rates (TCMB, ECB, manual override)
  - name: Catalog
    description: Product categories and products of the active brand (center writes, K4)
  - name: Stock
    description: Stock ledger reads (barcode history, organization and bin stock), scoped on the holding organization
  - name: Warehouse
    description: Warehouse tree (warehouses, rooms, aisle/shelf/bin locations) of center and distributor organizations (K12, K20)
  - name: VehicleCatalog
    description: >-
      Car brands and models (TEC-149): global reference data, read by every
      organization role and portal customers, written by super_admin only.
      Logos and hero images are public, unsigned and cacheable.
  - name: Customers
    description: >-
      Customers and vehicles (TEC-160, K11/K20): one phone is one user, global
      customer profile, visibility through customer_organizations (dealer: own
      organization, distributor: subtree, center: brand). Identity numbers are
      encrypted and returned as last4 only.
  - name: Pricing
    description: >-
      Price list and effective price views (TEC-146, K8). The center writes the
      list price and distributor-specific prices, a distributor writes its
      price to dealers; every reader gets one view masked by pricing.* grants.
  - name: ServiceCatalog
    description: >-
      Non-product service catalog (TEC-306): center-managed items, module
      bundles, distributor-specific prices and effective visible prices for
      distributors and dealers.
  - name: Library
    description: >-
      Document library (TEC-331): center-managed folders, tagged items,
      localized file versions and short-lived download URLs.
  - name: Accounting
    description: >-
      Accounting core (TEC-99/TEC-172): cash/bank accounts, cari balances,
      manual entries, collections/payments and voids. The ledger is
      append-only; dealers read only (accounting.read) in F1.
  - name: Services
    description: >-
      Vehicle services (TEC-97/TEC-179): draft by the serving organization,
      items from its stock, the legacy status flow and images. Completion
      with stock consumption arrives with TEC-180.
  - name: Contracts
    description: >-
      Vehicle intake/service contracts: rendered template snapshots, customer
      OTP + KVKK proof, canvas signatures, staff signature, media and voiding.
  - name: Warranties
    description: >-
      Warranties opened from completed services (TEC-98): panel and portal
      list and detail, center void (TEC-191).
  - name: Orders
    description: >-
      Product orders down the tree (TEC-96/TEC-166, K6): draft by the buyer,
      server-side prices (K8), rate frozen at seller approval (K7), barcode
      assignment and shipping (TEC-167), receipt and cancel after shipping
      (TEC-168).
  - name: StockTransfers
    description: >-
      Stock transfer requests between sibling dealers or sibling
      distributors (TEC-197, K13): request, approval or rejection, shipping
      and receipt through the stock ledger.
  - name: Tasks
    description: >-
      Center tasks (TEC-214): follow-ups about a distributor or dealer of the
      brand, assigned to a center member, with priority, due date and
      comments. tasks.* are held by center roles only.
  - name: Leads
    description: >-
      Lead pipeline (TEC-313): organization-scoped leads, status transitions,
      follow-up queue, timeline notes and center task linkage.
  - name: Mobile
    description: |
      Mobile app API (TEC-91). `/v1/mobile/*` is reached through the BFF
      passthrough `/api/v1/mobile/*` with `Authorization: Bearer` and no
      cookies (a request with a Cookie header gets 400). Tokens carry JWT
      `aud=mobile`; a mobile token is accepted on `/v1/mobile/*` only and
      `/v1/mobile/*` accepts mobile tokens only (403 `REALM_FORBIDDEN`).
      Every `/v1/mobile/*` route requires `X-Mobile-Api-Version` within the
      configured range (`MOBILE_API_MIN_VERSION`..`MOBILE_API_MAX_VERSION`),
      otherwise 426 `MOBILE_API_VERSION_UNSUPPORTED`. Also the QR web sign-in
      (`/v1/auth/qr/*`).

      App version gate (TEC-236): the app sends its release in `X-App-Version`
      (e.g. `2.4.1`; without it a `OlexFilms/2.4.1` User-Agent token is read,
      tokens set by `MOBILE_APP_UA_PRODUCTS`). Below the minimum
      (system setting `mobile.app_min_version`, else `MOBILE_APP_MIN_VERSION`;
      both empty = no gate) every `/v1/mobile/*` route, legacy aliases
      included, answers 426 `UPDATE_REQUIRED` with a localized message and
      `data.store_urls` before any other check. An unknown version passes
      unless `mobile.app_version_required` (or
      `MOBILE_APP_VERSION_REQUIRED`) is on.

      Legacy aliases (TEC-234, TEC-284, removed in F5): with
      `MOBILE_LEGACY_ALIASES` on (default off, otherwise 404), the old hub
      app keeps its own paths and bodies under the base URL
      `/v1/mobile/legacy` (it was `/api/v1/mobile` on the hub):
      `POST auth/login`, `POST auth/logout`, `GET auth/me`, `GET services`,
      `GET services/{service}` (integer id or uuid), `POST nexptg-reports`
      (stored as a measurement upload), `PUT|DELETE push-token`. They are
      adapters over the routes above and `/v1/services` with the same
      gates, without the `X-Mobile-Api-Version` header, and answer in the
      hub's envelope (`success`, `message`, `data` / `errors`; validation
      errors are 422 there, as on the hub). They are not listed as paths.
      The old app has no refresh flow, so the legacy login answers a
      long-lived token (aud `mobile` with a `legacy` claim) that lives as
      long as its device session (`JWT_MOBILE_REFRESH_TTL`, 30 days) and is
      checked against that session on every request: logout, a device
      revoke, logout-all, a password change or deactivation end it at once.
      Only the legacy aliases accept it; every other route answers 401.

paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe
      description: Process is alive. Does not check dependencies.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"

  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Pings Postgres and Redis. Returns 200 when both are up, 503 otherwise.
        Object storage is a soft check (logged only).
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyzResponse"

  /v1/auth/register:
    post:
      tags: [Auth]
      operationId: postAuthRegister
      summary: Self-serve user register
      description: |
        Creates a global user account and returns it. Tokens are issued on login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRegister"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: postAuthLogin
      summary: Login
      description: |
        Authenticates with email/password and returns a token pair.
        `realm=portal` signs a fleet / customer account in to the portal
        (JWT `aud=portal`); staff get 403 `NO_PORTAL_ACCESS`. The default
        realm `panel` refuses accounts whose only roles are customer / fleet
        (403 `NO_PANEL_ACCESS`). The realm rule runs after the password check.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/organization-context:
    post:
      tags: [Auth]
      operationId: postAuthOrganizationContext
      summary: Switch organization context
      description: |
        Re-issues access and refresh tokens with the JWT `oid` claim set for the
        given organization. Requires an authenticated session and active membership.
        Returns 403 `BRAND_MISMATCH` when the organization belongs to another brand
        than the request domain (Host / X-Forwarded-Host).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationContextRequest"
      responses:
        "200":
          description: Organization context applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: postAuthRefresh
      summary: Refresh tokens
      description: Rotates an opaque refresh token and returns a new token pair.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: postAuthLogout
      summary: Logout
      description: Revokes the given refresh token. Requires a valid access JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: Current session
      description: Hydrates the authenticated user, roles, permissions, and tenant memberships.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search/specs:
    get:
      tags: [Search]
      operationId: getSearchSpecs
      summary: Searchable resource specs
      description: Returns Meilisearch-backed specs visible to the caller (permission-filtered).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Spec catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchSpecs"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search:
    get:
      tags: [Search]
      operationId: getSearch
      summary: Search indexed records
      description: Typo-tolerant search across allowed specs. Use `q` (not `search`). Optional `spec` scopes to one resource.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: spec
          in: query
          schema:
            type: string
            example: users
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Search hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchHits"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/search/global:
    get:
      tags: [Search]
      operationId: getSearchGlobal
      summary: Cmd+K global search of the active organization (TEC-213)
      description: |
        Searches every index the caller may read in the active organization and
        groups the hits by spec (customers, vehicles, services, warranties, orders,
        organizations, stock_units, plus tenant / brand scoped specs such as
        catalog products). Each list scoped group runs through its module list
        (`GET /v1/<module>?q=`) with the list permission, scope and module
        feature, so the index is never the only access check. A group the caller
        lacks the permission or the module feature for is not queried and not
        returned. When Meilisearch is off the allowed groups come back empty
        with `info = search_disabled`.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: spec
          in: query
          description: Narrow the answer to one group.
          schema:
            type: string
            example: customers
        - name: limit
          in: query
          description: Hits per group.
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Grouped hits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSearchGlobal"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up:
    get:
      tags: [Auth]
      operationId: getAuthStepUp
      summary: Step-up grant status
      description: Returns whether the caller has a recent step-up grant and enabled verification methods.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Step-up status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/password:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPassword
      summary: Verify password for step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StepUpPasswordRequest"
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/passkey/options:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPasskeyOptions
      summary: Begin passkey step-up assertion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: WebAuthn request options
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/passkey/verify:
    post:
      tags: [Auth]
      operationId: postAuthStepUpPasskeyVerify
      summary: Finish passkey step-up assertion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/step-up/totp:
    post:
      tags: [Auth]
      operationId: postAuthStepUpTOTP
      summary: Verify authenticator code for step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Grant issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpGrant"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp:
    get:
      tags: [Auth]
      operationId: getAuthTOTP
      summary: Authenticator 2FA status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TOTP status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/setup:
    post:
      tags: [Auth]
      operationId: postAuthTOTPSetup
      summary: Begin authenticator 2FA setup
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Setup secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPSetup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: postAuthTOTPConfirm
      summary: Confirm authenticator 2FA setup
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Confirmed with recovery codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTOTPConfirm"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/totp/disable:
    post:
      tags: [Auth]
      operationId: postAuthTOTPDisable
      summary: Disable authenticator 2FA
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCodeRequest"
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/access/settings:
    get:
      tags: [Platform]
      operationId: getPlatformAccessSettings
      summary: Read step-up policy
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformAccessSettings
      summary: Update step-up policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStepUpPolicyRequest"
      responses:
        "200":
          description: Updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStepUpPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/integrations/github:
    get:
      tags: [Platform]
      operationId: getPlatformGitHubIntegrationSettings
      summary: Read GitHub App integration settings
      description: Super admin only. Secrets are never returned; only configured flags.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: GitHub integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGitHubIntegrationSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
