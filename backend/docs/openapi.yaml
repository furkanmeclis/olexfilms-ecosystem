      summary: Upload a service image
      description: >-
        Needs services.write reaching the service and an editable form. The
        type is detected from the content: JPEG, PNG or WebP only (400),
        at most 5 MiB (413) and 30 images per service (422
        SERVICE_TOO_MANY_IMAGES).
      security:
