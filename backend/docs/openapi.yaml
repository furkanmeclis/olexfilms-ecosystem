    EnvelopeDistributorPrice:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/DistributorPrice" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeDistributorPricePage:
      type: object
