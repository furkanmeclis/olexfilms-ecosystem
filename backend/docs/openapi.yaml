  /v1/warehouse/stock-counts/{uuid}/approve:
    post:
      tags: [Warehouse]
      operationId: approveStockCount
      summary: Approve a completed count and apply the resolutions
      description: >-
        Needs `warehouse.write` and `stock.adjust` (403 COUNT_ADJUST_FORBIDDEN).
        Every line that is not matched needs a resolution from its
        `allowed_resolutions` (400 VALIDATION_ERROR otherwise). In one
        transaction, through the stock ledger with the idempotency keys
        `stock_count:stock_count_line:<line>:<type>:<barcode>`: void_missing
        -> void; relocate -> placement to the counted location (and a
        count_adjustment of measured roll meters); increase_unlocated ->
        count_adjustment to the counted fixed quantity or roll meters; ignore
        -> nothing. 409 COUNT_STALE (nothing applied) when the stock changed
        since completion; 409 COUNT_INVALID_STATUS unless pending_review (a
        second approval writes nothing).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
