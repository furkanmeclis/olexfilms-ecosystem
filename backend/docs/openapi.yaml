    # TEC-273: Glorian admin API.
    GlorianConnection:
      type: object
      description: The API key is never returned; `api_key_set` and `api_key_masked` stand in for it.
      required: [configured, uuid, key, base_url, active, api_version, default_warehouse_uuid, api_key_set, api_key_masked, created_at, updated_at]
      properties:
        configured: { type: boolean }
        uuid: { type: [string, "null"], format: uuid }
        key: { type: string, example: glorian }
        base_url: { type: string }
        active: { type: boolean }
        api_version: { type: string, example: "1" }
        default_warehouse_uuid: { type: [string, "null"], format: uuid }
        api_key_set: { type: boolean }
        api_key_masked: { type: [string, "null"], example: "********" }
        created_at: { type: [string, "null"], format: date-time }
        updated_at: { type: [string, "null"], format: date-time }

    PutGlorianConnectionRequest:
      type: object
      additionalProperties: false
      required: [base_url]
      properties:
        base_url: { type: string, maxLength: 500, description: "http(s) root of the hub" }
        active: { type: boolean, default: false }
        api_version: { type: string, enum: ["1"], default: "1" }
        default_warehouse_uuid:
          type: [string, "null"]
          format: uuid
          description: A warehouse of the connection's center organization; null clears it.
        api_key:
          type: [string, "null"]
          maxLength: 500
          writeOnly: true
          description: Write only. Omitted or blank keeps the stored key.

    GlorianTestResult:
      type: object
      required: [ok, duration_ms, http_status, code, message]
      properties:
        ok: { type: boolean }
        duration_ms: { type: integer, format: int64 }
        http_status: { type: [integer, "null"] }
        code:
          type: [string, "null"]
          description: Hub error code (e.g. UNAUTHORIZED), MISCONFIGURED or TRANSPORT_ERROR.
        message: { type: [string, "null"] }

    GlorianSyncRun:
      type: object
      required: [uuid, kind, status, started_at, finished_at, watermark, counts, error]
      properties:
        uuid: { type: string, format: uuid }
        kind:
          type: string
          enum: [pull_categories, pull_products, pull_dealers, pull_stock, push_barcodes, outbound, reconcile]
        status: { type: string, enum: [running, succeeded, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        watermark: { type: [string, "null"], format: date-time }
        counts:
          type: object
          additionalProperties: true
          description: Run totals by kind; a reconcile run carries `details` with the first rows of every drift category.
        error: { type: [string, "null"], description: 'A hold reads "held: <reason>".' }

    TriggerGlorianSyncRequest:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [pull, push_barcodes, outbound_replay], default: pull }

    GlorianSyncQueued:
      type: object
      required: [kind, task]
      properties:
        kind: { type: string, enum: [pull, push_barcodes, outbound_replay] }
        task: { type: string, example: "glorian:pull_catalog" }

    GlorianOutbound:
      type: object
      required: [uuid, order_uuid, order_no, order_status, external_reference, state, held_reason, attempts, last_error, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        order_uuid: { type: string, format: uuid }
        order_no: { type: string }
        order_status: { type: string }
        external_reference: { type: string }
        state: { type: string, enum: [pending, held, sent, failed, cancelled] }
        held_reason: { type: [string, "null"], enum: [missing_customer_link, inactive_connection, null] }
        attempts: { type: integer }
        last_error: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EnvelopeGlorianConnection:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/GlorianConnection" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeGlorianTestResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/GlorianTestResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeGlorianSyncRun:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/GlorianSyncRun" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeGlorianSyncRunList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/GlorianSyncRun" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeGlorianSyncQueued:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/GlorianSyncQueued" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

