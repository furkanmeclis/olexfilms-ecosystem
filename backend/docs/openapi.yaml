      tags: [Library]
      operationId: getLibraryVersionDownload
      summary: Create a short-lived download URL
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLibraryDownload"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountingOrganizationUUID:
      name: organization_uuid
      in: query
      description: >-
        Book to read: the active organization (default) or an organization
        below it inside the accounting.read scope.
      schema: { type: string, format: uuid }
    VehicleCatalogUUID:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    StockProductUUIDFilter:
      name: product_uuid
      in: query
      schema: { type: string, format: uuid }
    StockCategoryUUIDFilter:
      name: category_uuid
      in: query
      schema: { type: string, format: uuid }
    StockUnitStatusFilter:
      name: status
      in: query
      description: One unit status; without it the list holds available and placed units.
      schema: { $ref: "#/components/schemas/StockUnitStatus" }
    StockBarcodeFilter:
      name: barcode
      in: query
      description: Exact barcode (scanner lookup).
      schema: { type: string, maxLength: 64 }
    StockStatusFilter:
      name: status
      in: query
      description: "`in_stock`: quantity or meters above zero; `out_of_stock`: both zero."
      schema: { type: string, enum: [in_stock, out_of_stock] }
    ProductUUID:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    PriceCurrency:
      name: currency
      in: path
      required: true
      description: ISO-4217 code (case-insensitive)
      schema: { type: string, minLength: 3, maxLength: 3, examples: [TRY] }
    MobileApiVersion:
      name: X-Mobile-Api-Version
      in: header
      required: true
      description: Mobile API contract major version (e.g. `1`); the response names the newest supported one.
      schema: { type: string, examples: ["1"] }
    QRCode:
      name: code
      in: path
      required: true
      description: QR sign-in challenge code
      schema: { type: string, maxLength: 64 }
    CountryISO2:
      name: iso2
      in: path
      required: true
      description: ISO 3166-1 alpha-2 country code (case-insensitive)
      schema: { type: string, example: NL }
    GeoID:
      name: id
      in: path
      required: true
      description: Province or district id
      schema: { type: integer, format: int64 }
    ModuleKey:
      name: key
      in: path
      required: true
      description: Module key from the backend catalog (GET /v1/features)
      schema: { type: string, example: ai_assistant }
    SystemSettingKey:
      name: key
      in: path
      required: true
      description: System setting key from the catalog (e.g. contract_grace_days, smtp.host)
      schema: { type: string, example: contract_grace_days }
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }

  responses:
    MobileApiVersionUnsupported:
      description: >-
        426 MOBILE_API_VERSION_UNSUPPORTED (missing or unsupported
        X-Mobile-Api-Version) or 426 UPDATE_REQUIRED (X-App-Version below the
        minimum, TEC-236; `data` carries the minimum and the store links).
        Either way the app asks the user to update.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateRequiredError"
    QRLoginExpired:
      description: 410 QR_LOGIN_EXPIRED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeDeleted"
    TerritoryConflict:
      description: >-
        409 TERRITORY_CONFLICT: the area, an ancestor or a descendant already
        belongs to a distributor of the brand (details[].code territory_conflict).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidPlate:
      description: 422 INVALID_PLATE (or VALIDATION_ERROR for a malformed country code)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModuleError:
      description: >-
        409 FEATURE_DISABLED (closed one level up) or MODULE_ADMIN_OVERRIDE;
        422 MODULE_CORE (core modules cannot be switched off)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        A well-formed value that is not accepted, such as an unsupported locale
        or an unknown timezone (code VALIDATION_ERROR, details[].field names it).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body or uploaded file too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    LocaleCode:
      type: string
      enum: [tr, en, bg, de, el, uk, ru, fr, es, it, zh-CN, az, ar]

    AnnouncementStatus:
      type: string
      enum: [draft, published, archived]

    AnnouncementAudienceTarget:
      type: string
      enum: [all_network, distributors, dealers, role, subtree]

    AnnouncementAudience:
      type: object
      additionalProperties: false
      required: [target_type]
      properties:
        target_type: { $ref: "#/components/schemas/AnnouncementAudienceTarget" }
        role_slug: { type: [string, "null"], maxLength: 100 }
        target_organization_uuid: { type: [string, "null"], format: uuid }

    AnnouncementInput:
      type: object
      additionalProperties: false
      required: [title, body, audiences]
      properties:
        default_locale: { $ref: "#/components/schemas/LocaleCode" }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        body_format: { type: string, enum: [markdown, html], default: markdown }
        pinned: { type: boolean, default: false }
        notify: { type: boolean, default: false }
        publish_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        audiences:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/AnnouncementAudience" }

    AnnouncementLocaleInput:
      type: object
      additionalProperties: false
      required: [title, body]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 20000 }

    Announcement:
      type: object
      required: [uuid, default_locale, title, body, body_format, status, pinned, notify]
      properties:
        uuid: { type: string, format: uuid }
        default_locale: { $ref: "#/components/schemas/LocaleCode" }
        locale: { type: string }
        title: { type: string }
        body: { type: string }
        body_format: { type: string, enum: [markdown, html] }
        status: { $ref: "#/components/schemas/AnnouncementStatus" }
        pinned: { type: boolean }
        notify: { type: boolean }
        read_at: { type: [string, "null"], format: date-time }
        publish_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        audiences:
          type: array
          items: { $ref: "#/components/schemas/AnnouncementAudience" }

    AnnouncementUnreadCount:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, format: int64, minimum: 0 }

    AnnouncementReadItem:
      type: object
      required: [user_uuid, email, name, surname, read_at]
      properties:
        user_uuid: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        surname: { type: string }
        read_at: { type: string, format: date-time }

    AnnouncementReadReport:
      type: object
      required: [target_total, read_total, read_rate, items]
      properties:
        target_total: { type: integer, format: int64, minimum: 0 }
        read_total: { type: integer, format: int64, minimum: 0 }
        read_rate: { type: number, format: double, minimum: 0, maximum: 1 }
        items:
          type: array
          items: { $ref: "#/components/schemas/AnnouncementReadItem" }

    EnvelopeAnnouncement:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/Announcement" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAnnouncementPage:
      type: object
      required: [success, data, meta]
      properties:
