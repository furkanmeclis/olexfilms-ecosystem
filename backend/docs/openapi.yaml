        uuid: { type: string, format: uuid }
        counterparty: { $ref: "#/components/schemas/CariCounterparty" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        active: { type: boolean }
        balance: { $ref: "#/components/schemas/AccountingAmount" }
        entry_count: { type: integer, format: int64 }

    AccountingAccountBalance:
