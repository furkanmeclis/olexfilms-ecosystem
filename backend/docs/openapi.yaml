            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AccountingDirection:
      type: string
      enum: [income, expense, charge, collection, payment, opening]
      description: >-
        opening (TEC-198) is a cash/bank opening balance: account only, never
        income or expense (not P&L).

    AccountingAmount:
      type: string
      pattern: '^-?[0-9]{1,16}\.[0-9]{2}$'
      description: Signed decimal (NUMERIC(18,2)) as a string; reversal rows are negative.
      example: "1500.00"

    AccountingAmountInput:
      type: string
      pattern: '^[0-9]{1,16}(\.[0-9]{1,2})?$'
      description: Positive decimal with at most two fraction digits.
      example: "1500.00"

    AccountingCategory:
      type: object
      required: [key, direction, label_key, label, manual]
      properties:
        key: { type: string, example: rent }
        direction: { $ref: "#/components/schemas/AccountingDirection" }
        label_key: { type: string, example: accounting.category.rent }
        label: { type: string, description: label_key in the request language, example: Rent }
        manual:
          type: boolean
          description: false for system categories written by the source API only (sale, purchase)

    FinanceAccount:
      type: object
      required: [uuid, type, name, currency, iban, active, balance, entry_count, last_entry_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        type: { type: string, enum: [cash, bank] }
        name: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        iban: { type: [string, "null"], example: TR330006100519786457841326 }
        active: { type: boolean }
        balance: { $ref: "#/components/schemas/AccountingAmount" }
        entry_count: { type: integer, format: int64 }
        last_entry_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FinanceAccountCreateInput:
      type: object
      required: [type, name]
      additionalProperties: false
      properties:
        type: { type: string, enum: [cash, bank] }
        name: { type: string, maxLength: 200 }
        iban: { type: [string, "null"], description: Bank accounts only; spaces allowed }

    FinanceAccountUpdateInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        iban: { type: [string, "null"], description: null clears it }
        active: { type: boolean }

    CariCounterparty:
      type: object
      required: [type, uuid, name]
      properties:
        type: { type: string, enum: [organization, user] }
        uuid: { type: [string, "null"], format: uuid }
        name: { type: string }
        org_type: { type: string, enum: [center, distributor, dealer] }

    CariAccount:
      type: object
      required: [uuid, counterparty, currency, active, balance, entry_count, last_entry_at, created_at]
      properties:
        uuid: { type: string, format: uuid }
        counterparty: { $ref: "#/components/schemas/CariCounterparty" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        active: { type: boolean }
        balance:
          $ref: "#/components/schemas/AccountingAmount"
        entry_count: { type: integer, format: int64 }
        last_entry_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    AccountingRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    FinanceEntry:
      type: object
      required:
        - uuid
        - direction
        - category
        - category_label_key
        - account
        - cari_uuid
        - counterparty_organization
        - orig_currency
        - orig_amount
        - currency
        - amount
        - rate
        - rate_date
        - source_type
        - source_uuid
        - revision
        - reversal_of_uuid
        - reversed_by_uuid
        - voided
        - description
        - created_at
      properties:
        uuid: { type: string, format: uuid }
        direction: { $ref: "#/components/schemas/AccountingDirection" }
        category: { type: string }
        category_label_key: { type: string, example: accounting.category.rent }
        account:
          oneOf:
            - $ref: "#/components/schemas/AccountingRef"
            - type: "null"
        cari_uuid: { type: [string, "null"], format: uuid }
        counterparty_organization:
          oneOf:
            - $ref: "#/components/schemas/AccountingRef"
            - type: "null"
        orig_currency: { type: string, minLength: 3, maxLength: 3 }
        orig_amount: { $ref: "#/components/schemas/AccountingAmount" }
        currency: { type: string, minLength: 3, maxLength: 3, description: The organization's ledger currency (K7) }
        amount: { $ref: "#/components/schemas/AccountingAmount" }
        rate: { type: string, description: "Frozen rate orig_currency→currency (NUMERIC(18,8))", example: "1.00000000" }
        rate_date: { type: string, format: date }
        source_type: { type: [string, "null"], example: manual }
        source_uuid: { type: [string, "null"], format: uuid }
        revision: { type: integer }
        reversal_of_uuid: { type: [string, "null"], format: uuid }
        reversed_by_uuid: { type: [string, "null"], format: uuid }
        voided: { type: boolean, description: The row has been reversed }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    FinanceEntryInput:
      type: object
      required: [direction, category, amount]
      additionalProperties: false
      properties:
        direction: { type: string, enum: [income, expense, charge] }
        category: { type: string, description: A manual category of the direction (GET /v1/accounting/categories) }
        amount: { $ref: "#/components/schemas/AccountingAmountInput" }
        currency: { type: string, minLength: 3, maxLength: 3, description: Defaults to the organization's currency; others convert at today's rate }
        account_uuid: { type: [string, "null"], format: uuid }
        cari_uuid: { type: [string, "null"], format: uuid }
        counterparty_organization_uuid: { type: [string, "null"], format: uuid }
        description: { type: string, maxLength: 1000 }
        idempotency_key: { type: [string, "null"], format: uuid }

    FinanceSettlementInput:
      type: object
      required: [account_uuid, amount]
      additionalProperties: false
      properties:
        account_uuid: { type: string, format: uuid }
        cari_uuid: { type: [string, "null"], format: uuid }
        counterparty_organization_uuid: { type: [string, "null"], format: uuid }
        amount: { $ref: "#/components/schemas/AccountingAmountInput" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        description: { type: string, maxLength: 1000 }
        idempotency_key: { type: [string, "null"], format: uuid }

    FinanceOpeningBalanceInput:
      type: object
      required: [side, amount, opening_date]
      additionalProperties: false
      properties:
        cari_uuid: { type: [string, "null"], format: uuid }
        counterparty_organization_uuid: { type: [string, "null"], format: uuid }
        side:
          type: string
          enum: [debit, credit]
          description: debit = the counterparty owes us; credit = we owe the counterparty.
        amount: { $ref: "#/components/schemas/AccountingAmountInput" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        opening_date:
          type: string
          format: date
          description: Opening date (2000-01-01 .. today); the row is dated here.
        description: { type: string, maxLength: 1000 }

    FinanceAccountOpeningInput:
      type: object
      required: [amount, opening_date]
      additionalProperties: false
      properties:
        amount: { $ref: "#/components/schemas/AccountingAmountInput" }
        opening_date:
          type: string
          format: date
          description: Opening date (2000-01-01 .. today); the row is dated here.
        description: { type: string, maxLength: 1000 }

    FinanceEntryVoidInput:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 1000 }

    EnvelopeAccountingCategoryList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AccountingCategory" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeFinanceAccount:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/FinanceAccount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeFinanceAccountList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/FinanceAccount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCariAccount:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CariAccount" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCariAccountPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CariAccount" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeFinanceEntry:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/FinanceEntry" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeFinanceEntryPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/FinanceEntry" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    AccountingDisputeStatus:
      type: string
      enum: [open, resolved_reversal, resolved_revision, rejected]

    AccountingDispute:
      type: object
      required:
        - uuid
        - status
        - organization
        - counterparty_organization
        - entry
        - source_type
        - source_uuid
        - reason
        - corrected_amount
        - resolution_note
        - reversal_entry_uuid
        - revision_entry_uuid
        - created_at
        - resolved_at
      properties:
        uuid: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/AccountingDisputeStatus" }
        organization: { $ref: "#/components/schemas/AccountingRef" }
        counterparty_organization: { $ref: "#/components/schemas/AccountingRef" }
        entry:
          type: object
          required: [uuid, direction, category, category_label_key, orig_currency, orig_amount, currency, amount, revision, created_at]
          properties:
            uuid: { type: string, format: uuid }
            direction: { $ref: "#/components/schemas/AccountingDirection" }
            category: { type: string }
            category_label_key: { type: string }
            orig_currency: { type: string, minLength: 3, maxLength: 3 }
            orig_amount: { $ref: "#/components/schemas/AccountingAmount" }
            currency: { type: string, minLength: 3, maxLength: 3 }
            amount: { $ref: "#/components/schemas/AccountingAmount" }
            revision: { type: integer }
            created_at: { type: string, format: date-time }
        source_type: { type: string, example: order }
        source_uuid: { type: string, format: uuid }
        reason: { type: string }
        corrected_amount: { type: [string, "null"], description: Revision amount in the entry's orig_currency }
        resolution_note: { type: [string, "null"] }
        reversal_entry_uuid: { type: [string, "null"], format: uuid }
        revision_entry_uuid: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }

    AccountingDisputeInput:
      type: object
      required: [entry_uuid, reason]
      additionalProperties: false
      properties:
        entry_uuid: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }

    AccountingDisputeResolveInput:
      type: object
      required: [resolution]
      additionalProperties: false
      properties:
        resolution: { type: string, enum: [reversal, revision, reject] }
        note: { type: string, maxLength: 2000, description: Required for reject }
        corrected_amount: { $ref: "#/components/schemas/AccountingAmountInput" }

    EnvelopeAccountingDispute:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AccountingDispute" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountingDisputePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AccountingDispute" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    CariStatementLine:
