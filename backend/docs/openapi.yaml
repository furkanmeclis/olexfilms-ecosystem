  /v1/orders/{uuid}/transitions:
    post:
      tags: [Orders]
      operationId: transitionOrder
      summary: Move an order to another status
      description: >-
        Transitions (TEC-166, TEC-167): draft -> submitted (buyer,
        orders.write); submitted -> approved (seller, orders.approve: line
        prices are fetched again and locked, the rate to TRY is frozen into
        rate_snapshot/try_rate, 422 RATE_NOT_FOUND without a rate);
        approved -> preparing | processing (seller, orders.ship or
        orders.approve); processing -> preparing (seller, orders.ship;
        TEC-261, a migrated order continues on the barcode path);
        preparing -> ready (seller, orders.ship; every line
        fully assigned, else 409 ORDER_NOT_FULLY_ASSIGNED); ready -> shipped
        (seller, orders.ship; one ledger order_out per assigned unit with
        idempotency key order:order_item_unit:<id>:order_out:<barcode>,
        serial units go in_transit owned by the buyer, reservations are
        consumed; 409 ORDER_STOCK_UNAVAILABLE when the ledger refuses);
        draft | submitted | approved | processing | preparing | ready ->
        cancelled (either side, orders.cancel; active reservations are
        released).
        After shipping (TEC-168): shipped -> received (buyer,
        orders.receive; the whole shipment, no partial receipt: one ledger
        received per shipped unit with idempotency key
        order:order_item_unit:<id>:received:<barcode>, the units become
        available at the buyer organization; orders.received);
        shipped -> cancelling (either side, orders.cancel; nothing moves,
        the reason is kept; orders.cancel_requested); cancelling ->
        cancelled (seller, orders.cancel or orders.ship, once the goods are
        back: one ledger order_cancel_restore per shipped unit returns it to
        the seller's source owner and status). A received order cannot be
        cancelled (409 ORDER_INVALID_TRANSITION; returns are a separate
        flow). A request for the current status is a no-op (a repeated
        ship, receipt or cancel writes no movement). Other moves answer 409
        ORDER_INVALID_TRANSITION; delivered is not used (received follows
        shipped) and answers 409 ORDER_TRANSITION_UNAVAILABLE. Every move
        writes the status history and an orders.* outbox event.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderTransitionInput"
      responses:
        "200":
          description: Order after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/orders/{uuid}/items/{item_uuid}/units:
    post:
      tags: [Orders]
      operationId: assignOrderUnit
      summary: Assign a unit to an order line and reserve it (seller, orders.ship)
      description: >-
        Only while the order is preparing (409 ORDER_NOT_ASSIGNABLE). The
        unit is named by barcode (scan) or unit_uuid and must be of the
        line's product and in the seller's stock (409
        ORDER_UNIT_NOT_AVAILABLE). Serial pieces count as 1; a serial unit
        reserved by another order answers 409 ORDER_UNIT_RESERVED. Rolls
        take meters: without meters (or with the remaining meters) the
        whole roll is assigned; fewer meters first split the roll (TEC-184):
        the meters leave as a new unit with its own barcode
        (<roll barcode>-S<n>), which is assigned and returned in `split`
        (label printing: TEC-95), while the roll keeps the rest. More meters
        than the roll has answer 422 ROLL_METERS_EXCEED_REMAINING. An
        `idempotency_key` makes a split assignment retry-safe (a retry
        returns the same split, `split.replayed` = true). Fixed barcodes take a quantity;
        the seller's active reservations may not exceed what it holds (409
        ORDER_INSUFFICIENT_STOCK). The line amount may not be exceeded (409
        ORDER_ITEM_OVER_ASSIGNED); a unit already on the line answers 409
        ORDER_UNIT_ALREADY_ASSIGNED.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: item_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUnitAssignInput"
      responses:
        "200":
          description: Order with the assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/orders/{uuid}/items/{item_uuid}/units/{unit_uuid}:
    delete:
      tags: [Orders]
      operationId: unassignOrderUnit
      summary: Remove a unit from an order line (seller, orders.ship)
      description: >-
        Only while the order is preparing. The reservation is released (it
        stays as history) and the unit can be assigned again.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: item_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: unit_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order without the assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/stock-transfers:
    get:
      tags: [StockTransfers]
      operationId: listStockTransfers
      summary: Stock transfer requests of the active organization
      description: >-
        Requests where the active organization is the giver (outgoing), the
        receiver (incoming) or the common parent (approval); direction
        narrows the list. Needs transfers.request or transfers.approve and
        the dealer_transfers module. List rows carry no items. kind narrows
        to sibling transfers or returns to the parent (TEC-223).
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/StockTransferKind" }
        - name: direction
          in: query
          schema: { type: string, enum: [outgoing, incoming, approval] }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/StockTransferStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Transfer requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockTransferPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [StockTransfers]
      operationId: createStockTransfer
      summary: Request a stock transfer to a sibling organization (K13)
      description: >-
        The active organization (dealer or distributor) gives units it holds
        to a sibling: same brand, same type, same parent. Any other target
        (another parent, brand or type, the parent itself) is 422
        TRANSFER_NOT_SIBLING. Units are named by barcode; a fixed barcode
        needs a quantity, pieces and rolls move whole. A unit not in the
        giver's stock, reserved by an order or on another open request is
        400 with detail code TRANSFER_UNIT_NOT_AVAILABLE,
        TRANSFER_UNIT_RESERVED or TRANSFER_INSUFFICIENT_STOCK. Needs
        transfers.request. Writes transfers.requested; no stock moves yet.
        With kind=return (TEC-223) the units go back to the active
        organization's direct parent: to_org_uuid may be omitted, and when
        set it must name that parent, else 422 TRANSFER_NOT_PARENT (also for
        an organization without a parent, such as the center).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockTransferCreateInput"
      responses:
        "201":
          description: Requested transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/stock-transfers/targets:
    get:
      tags: [StockTransfers]
      operationId: listStockTransferTargets
      summary: Siblings the active organization may transfer to
      description: >-
        Live organizations of the same brand, type and parent as the active
        organization (empty for the center). With kind=return, the direct
        parent only (TEC-223). Needs transfers.request.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/StockTransferKind" }
      responses:
        "200":
          description: Sibling organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockTransferTargets"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/stock-transfers/{uuid}:
    get:
      tags: [StockTransfers]
      operationId: getStockTransfer
      summary: One stock transfer request with its units
      description: >-
        Visible to its parties only (giver, receiver, common parent); others
        get 404. available_transitions lists the statuses the caller may
        move the request to.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transfer request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stock-transfers/{uuid}/transitions:
    post:
      tags: [StockTransfers]
      operationId: transitionStockTransfer
      summary: Move a stock transfer request to another status
      description: >-
        requested -> approved | rejected (receiver with transfers.request or
        the common parent with transfers.approve; approval freezes the
        giver's purchase price per unit, K13; a rejection writes no stock
        movement); requested -> cancelled (giver or parent); approved ->
        shipped (giver: one ledger transfer_out per unit with idempotency key
        transfer:transfer_item:<id>:transfer_out:<barcode>, serial units go
        in_transit owned by the receiver; 409 TRANSFER_STOCK_UNAVAILABLE when
        the ledger refuses); approved -> cancelled (any party, no movement);
        shipped -> received (receiver: one transfer_in per unit, available at
        the receiver); shipped -> cancelled (giver, once the goods are back:
        one transfer_cancel_restore per unit). rejected, received and
        cancelled are final. A request for the current status is a no-op;
        other moves answer 409 TRANSFER_INVALID_TRANSITION. Every move writes
        a transfers.* outbox event. On receipt the giver books income on the
        receiver's cari and the receiver a purchase expense on the giver's
        cari for the line totals frozen at approval, in the same transaction
        (K13, source stock_transfer); 400 RATE_NOT_FOUND rolls the receipt
        back when an organization's currency has no rate for the day. A
        return (kind=return, TEC-223) has the parent as receiver: the parent
        (transfers.approve) approves or rejects, the giver ships or cancels,
        the parent receives; approval freezes the unit's order price to the
        giver (else the giver's purchase price), and the receipt books the
        reversal of the parent's sale (the giver income on the parent's cari,
        the parent a purchase expense on the giver's cari, source
        stock_return).
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockTransferTransitionInput"
      responses:
        "200":
          description: Transfer request after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

