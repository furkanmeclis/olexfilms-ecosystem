              schema:
                $ref: "#/components/schemas/EnvelopeStockEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/moves:
    post:
      tags: [Warehouse]
      operationId: moveWarehouseUnits
      summary: Move scanned units onto a location (bin <-> bin, TEC-205)
      description: >-
        Needs `warehouse.write`. One step: every scanned serial unit
        (`barcodes`, also `OFW:UNIT:<barcode>`) gets one ledger `placement`
        onto the location (`location_uuid`, or `location_code`: a scanned
        `OFW:LOC:<full_code>` QR or a bare full_code), all in one
        transaction. A placed unit stays in its warehouse (moving to another
        warehouse is a warehouse transfer, 400 VALIDATION_ERROR); an
        unplaced unit of the organization may go to any of its warehouses.
        Fixed barcodes are 400. 409 WAREHOUSE_UNIT_UNAVAILABLE when the unit
        is not on hand in the organization, WAREHOUSE_UNIT_BUSY when it is in
        transit or on an open warehouse transfer. The idempotency key is
        `warehouse_move:stock_movement:<last movement id>:placement:<barcode>`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseMoveInput" }
      responses:
        "200":
          description: Moved units
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarehouseMoveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/orders/{uuid}/place:
    post:
      tags: [Warehouse]
      operationId: placeReceivedOrderUnits
      summary: Shelve the received units of an order (center -> distributor, TEC-205)
      description: >-
        Needs `warehouse.write`. The order must be bought by the active
        organization (404 otherwise) and received (409
        WAREHOUSE_ORDER_NOT_RECEIVED); the order module has already moved
        the stock (order_out / received). Every received serial unit still
        unplaced in the organization gets one `placement` onto the location
        (`location_uuid` / `location_code`, default the order's buyer
        location; 400 when neither exists). `barcodes` limits the units.
        Fixed barcodes (`skipped: fixed`) and units already shelved or moved
        on (`skipped: not_on_hand`) are skipped. Key
        `warehouse_order:order_item_unit:<assignment id>:placement:<barcode>`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseOrderPlaceInput" }
      responses:
        "200":
          description: Placed and skipped units
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWarehouseMoveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

