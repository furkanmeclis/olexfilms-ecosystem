    Country:
      type: object
      required: [id, iso2, iso3, name_en, name_tr, is_active, has_provinces]
      properties:
        id: { type: integer, format: int64 }
        iso2: { type: string, example: NL }
        iso3: { type: string, example: NLD }
        name_en: { type: string }
        name_tr: { type: string }
        phone_code: { type: string, example: "+31" }
        default_currency: { type: string, example: EUR }
        default_locale: { type: string }
        timezone: { type: string }
        is_active: { type: boolean }
        has_provinces: { type: boolean }

    Province:
      type: object
      required: [id, country_id, code, name, has_districts]
      properties:
        id: { type: integer, format: int64 }
        country_id: { type: integer, format: int64 }
        code:
          type: string
          description: TR plate code (01..81) or the ISO 3166-2 code (NL-NH)
        name: { type: string }
        has_districts: { type: boolean }

    District:
      type: object
      required: [id, province_id, name]
      properties:
        id: { type: integer, format: int64 }
        province_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }

    GeoNodeRequest:
      type: object
      required: [name]
      properties:
        code:
          type: string
          maxLength: 16
          description: Required for provinces
        name: { type: string, maxLength: 120 }

    TerritoryLevel:
      type: string
      enum: [country, province, district]

    Territory:
      type: object
      required: [uuid, level, organization_uuid, organization_name, country_id, country_iso2, country_name_en, country_name_tr, created_at]
      properties:
        uuid: { type: string, format: uuid }
        level: { $ref: "#/components/schemas/TerritoryLevel" }
        organization_uuid:
          type: string
          format: uuid
          description: The distributor
        organization_name: { type: string }
        country_id: { type: integer, format: int64 }
        country_iso2: { type: string }
        country_name_en: { type: string }
        country_name_tr: { type: string }
        province_id: { type: integer, format: int64 }
        province_name: { type: string }
        district_id: { type: integer, format: int64 }
        district_name: { type: string }
        created_at: { type: string, format: date-time }

    AssignTerritoryRequest:
      type: object
      required: [distributor_uuid, country_id]
      properties:
        distributor_uuid: { type: string, format: uuid }
        country_id: { type: integer, format: int64 }
        province_id: { type: [integer, "null"], format: int64 }
        district_id:
          type: [integer, "null"]
          format: int64
          description: Needs province_id; must be inside it.

    TerritoryMatch:
      type: object
      required: [territory_uuid, level, organization_uuid, organization_name]
      properties:
        territory_uuid: { type: string, format: uuid }
        level: { $ref: "#/components/schemas/TerritoryLevel" }
        organization_uuid: { type: string, format: uuid }
        organization_name: { type: string }

    PlateFormat:
      type: object
      required: [country_iso2, country_name_en, country_name_tr, regex, input_mask, example, country_label, strip_color, background_color, text_color, is_active, sort_order]
      properties:
        country_iso2: { type: string, example: DE }
        country_name_en: { type: string }
        country_name_tr: { type: string }
        regex:
          type: string
          description: RE2 regex on the compact plate (upper case, no separators)
        input_mask: { type: string, example: "AAA AA 9999" }
        example: { type: string, example: "B AB 1234" }
        country_label: { type: string, example: D }
        strip_color: { type: string, example: "#003399" }
        background_color: { type: string, example: "#FFFFFF" }
        text_color: { type: string, example: "#000000" }
        is_active: { type: boolean }
        sort_order: { type: integer }

    PlateFormatRequest:
      type: object
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 (create only)
        regex: { type: string }
        input_mask: { type: string }
        example: { type: string }
        country_label: { type: string, maxLength: 4 }
        strip_color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        background_color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        text_color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        is_active: { type: boolean }
        sort_order: { type: integer }

    PlateCheck:
      type: object
      required: [country, normalized, valid]
      properties:
        country: { type: string }
        normalized: { type: string, example: BAB1234 }
        valid: { type: boolean }

    Currency:
      type: object
      required: [code, name, symbol, decimals]
      properties:
        code: { type: string, example: EUR }
        name: { type: string }
        symbol: { type: string }
        decimals: { type: integer }

    RateSource:
      type: string
      description: manual > tcmb > ecb; cross rates join two sources with "+"; identity for base = quote
      example: tcmb

    StoredExchangeRate:
      type: object
      required: [rate_date, base, quote, rate, source, effective, fetched_at]
      properties:
        rate_date: { type: string, format: date }
        base: { type: string }
        quote: { type: string }
        rate:
          type: string
          description: Decimal string, 1 base = rate quote (10 fraction digits max)
        source: { $ref: "#/components/schemas/RateSource" }
        note: { type: string }
        effective:
          type: boolean
          description: The row the resolver picks for this pair on this day
        fetched_at: { type: string, format: date-time }

    RateSnapshot:
      type: object
      description: The frozen rate of an order / journal entry (rate_snapshot, K7).
      required: [base, quote, rate, rate_date, source]
      properties:
        base: { type: string }
        quote: { type: string }
        rate: { type: string, example: "48.7988" }
        rate_date: { type: string, format: date }
        source: { $ref: "#/components/schemas/RateSource" }
        via:
          type: string
          description: Pivot currency of a cross rate (TRY or EUR)

    ExchangeRateOverrideRequest:
      type: object
      required: [date, base, quote, rate]
      properties:
        date: { type: string, format: date }
        base: { type: string, example: EUR }
        quote: { type: string, example: TRY }
        rate: { type: string, example: "48.75" }
        note: { type: string }

    FetchSourceReport:
      type: object
      required: [source, count]
      properties:
        source: { type: string, enum: [tcmb, ecb] }
        date: { type: string, format: date }
        count: { type: integer }
        error: { type: string }

    CatalogUnitType:
      type: string
      enum: [piece, roll_meter]
      description: piece (adet) or roll_meter (metraj/rulo)

    CatalogCategory:
      type: object
      required: [uuid, name, available_parts, sort, active, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        available_parts:
          type: array
          description: Vehicle parts a service may pick for products of the category
          items: { type: string, maxLength: 100 }
        sort: { type: integer, format: int32 }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CatalogCategoryInput:
      type: object
      additionalProperties: false
      description: POST needs name; PATCH changes only the fields it names.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        available_parts:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 100 }
        sort: { type: integer, format: int32 }
        active: { type: boolean }

    CatalogProductImage:
      type: object
      required: [key, sort]
      properties:
        key:
          type: string
          maxLength: 512
          description: >-
            Image key. Uploaded images (32 hex + .jpg/.png/.webp) are served
            at `/product-images/{key}`.
        sort: { type: integer }

    CatalogProduct:
      type: object
      required:
        - uuid
        - category
        - sku
        - name
        - description_md
        - warranty_duration_months
        - micron_thickness
        - images
        - unit_type
        - uses_fixed_barcode
        - active
        - external_id
        - locked_fields
        - created_at
        - updated_at
      properties:
        uuid: { type: string, format: uuid }
        category:
          type: object
          required: [uuid, name]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        description_md: { type: string, description: Markdown }
        warranty_duration_months: { type: [integer, "null"], format: int32 }
        micron_thickness: { type: [number, "null"] }
        images:
          type: array
          items: { $ref: "#/components/schemas/CatalogProductImage" }
        unit_type: { $ref: "#/components/schemas/CatalogUnitType" }
        uses_fixed_barcode: { type: boolean }
        active: { type: boolean }
        external_id:
          type: [string, "null"]
          description: Reserved for the F2 Glorian catalog sync (read-only)
        locked_fields:
          type: array
          description: Fields locked by the F2 Glorian sync (read-only)
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CatalogProductImageOrder:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          maxItems: 10
          description: Every current image key, in the new order
          items: { type: string }

    CatalogProductInput:
      type: object
      additionalProperties: false
      description: >-
        POST needs category_uuid, sku and name (unit_type defaults to piece,
        active to true). PATCH changes only the fields it names.
      properties:
        category_uuid: { type: string, format: uuid }
        sku: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description_md: { type: string, maxLength: 20000 }
        warranty_duration_months: { type: [integer, "null"], minimum: 0, maximum: 600 }
        micron_thickness: { type: [number, "null"], exclusiveMinimum: 0, maximum: 999999.99 }
        images:
          type: array
          maxItems: 10
          description: >-
            Keys issued by the image upload route can only be kept or dropped
            here, not added; prefer the `/images` routes for uploads, removal
            and order.
          items: { $ref: "#/components/schemas/CatalogProductImage" }
        unit_type: { $ref: "#/components/schemas/CatalogUnitType" }
        uses_fixed_barcode: { type: boolean }
        active: { type: boolean }

    EnvelopeCatalogCategory:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CatalogCategory" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCatalogCategoryPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CatalogCategory" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCatalogProduct:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CatalogProduct" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCatalogProductPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CatalogProduct" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    StockOwnerType:
      type: string
      enum: [warehouse_location, organization, service, trash]

    StockUnitStatus:
      type: string
      enum: [reserved, printed, available, placed, in_transit, used, void]

    StockOrgRef:
      type: object
      required: [uuid, name, type]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [center, distributor, dealer] }

    StockLocationRef:
      type: object
      required: [uuid, code, name]
      properties:
        uuid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    StockOwner:
      type: object
      description: Masked owners belong to an organization the viewer may not name.
      required: [type, organization, location, masked]
      properties:
        type: { $ref: "#/components/schemas/StockOwnerType" }
        organization:
          oneOf:
            - $ref: "#/components/schemas/StockOrgRef"
            - type: "null"
        location:
          oneOf:
            - $ref: "#/components/schemas/StockLocationRef"
            - type: "null"
        masked: { type: boolean }

    StockUnit:
      type: object
      required: [uuid, barcode, unit_kind, source, status, initial_meters, remaining_meters, product, created_at]
      properties:
        uuid: { type: string, format: uuid }
        barcode: { type: string }
        unit_kind: { type: string, enum: [serial, fixed] }
        source: { type: string, enum: [generated, imported, external] }
        status: { $ref: "#/components/schemas/StockUnitStatus" }
        initial_meters: { type: [string, "null"], description: "Roll length (decimal string, 2 places)" }
        remaining_meters: { type: [string, "null"] }
        product:
          type: object
          required: [uuid, sku, name, unit_type, uses_fixed_barcode]
          properties:
            uuid: { type: string, format: uuid }
            sku: { type: string }
            name: { type: string }
            unit_type: { $ref: "#/components/schemas/CatalogUnitType" }
            uses_fixed_barcode: { type: boolean }
        created_at: { type: string, format: date-time }

    StockCurrentState:
      type: object
      required: [owner, holder, status, updated_at]
      properties:
        owner: { $ref: "#/components/schemas/StockOwner" }
        holder: { $ref: "#/components/schemas/StockOrgRef" }
        status: { $ref: "#/components/schemas/StockUnitStatus" }
        updated_at: { type: string, format: date-time }

    StockHolding:
      type: object
      required: [owner, holder, quantity]
      properties:
        owner: { $ref: "#/components/schemas/StockOwner" }
        holder: { $ref: "#/components/schemas/StockOrgRef" }
        quantity: { type: integer }

    StockMovement:
      type: object
      required: [uuid, type, quantity_delta, meters_delta, from_status, to_status, from_owner, to_owner,
        organization, organization_masked, reference_type, reason, created_at]
      properties:
        uuid: { type: string, format: uuid }
        type:
          type: string
          enum: [entry, placement, transfer_out, transfer_in, transfer_cancel_restore, order_out,
            order_cancel_restore, received, consumption, partial_consumption, return,
            reclassification, count_adjustment, void, external_outbound, split]
        quantity_delta: { type: integer }
        meters_delta: { type: string, description: "Decimal string, 2 places" }
        from_status:
          oneOf:
            - $ref: "#/components/schemas/StockUnitStatus"
            - type: "null"
        to_status:
          oneOf:
            - $ref: "#/components/schemas/StockUnitStatus"
            - type: "null"
        from_owner:
          oneOf:
            - $ref: "#/components/schemas/StockOwner"
            - type: "null"
        to_owner:
          oneOf:
            - $ref: "#/components/schemas/StockOwner"
            - type: "null"
        organization:
          description: Holding organization of the row; null when masked.
          oneOf:
            - $ref: "#/components/schemas/StockOrgRef"
            - type: "null"
        organization_masked: { type: boolean }
        reference_type: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    StockUnitHistory:
      type: object
      required: [unit, current, holdings, movements]
      properties:
        unit: { $ref: "#/components/schemas/StockUnit" }
        current:
          description: Single active owner of a serial unit; null for fixed barcodes and labels not in stock yet.
          oneOf:
            - $ref: "#/components/schemas/StockCurrentState"
            - type: "null"
        holdings:
          type: array
          items: { $ref: "#/components/schemas/StockHolding" }
        movements:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/StockMovement" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }

    StockProduct:
      type: object
      required: [product, quantity, meters, fixed_barcodes, updated_at]
      properties:
        product:
          type: object
          required: [uuid, sku, name, unit_type, uses_fixed_barcode, active, category]
          properties:
            uuid: { type: string, format: uuid }
            sku: { type: string }
            name: { type: string }
            unit_type: { $ref: "#/components/schemas/CatalogUnitType" }
            uses_fixed_barcode: { type: boolean }
            active: { type: boolean }
            category:
              type: object
              required: [uuid, name]
              properties:
                uuid: { type: string, format: uuid }
                name: { type: string }
        quantity: { type: integer }
        meters: { type: string, description: "Decimal string, 2 places" }
        fixed_barcodes:
          type: array
          items:
            type: object
            required: [unit_uuid, barcode, quantity]
            properties:
              unit_uuid: { type: string, format: uuid }
              barcode: { type: string }
              quantity: { type: integer }
        updated_at: { type: string, format: date-time }

    EnvelopeStockUnitHistory:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/StockUnitHistory" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    StockRebuildCheckInput:
      type: object
      additionalProperties: false
      properties:
        organization_uuid:
          type: [string, "null"]
          format: uuid
          description: Scan only the units that touched this organization and its product stock rows.

    StockRebuildDiff:
      type: object
      required: [table, key, field, expected, actual]
      properties:
        table:
          type: string
          enum: [units, unit_current_state, fixed_barcode_holdings, bin_product_stocks, organization_product_stocks]
        key: { type: string, description: "unit:<id>, location:<id>/product:<id> or organization:<id>/product:<id>" }
        unit_id: { type: integer, format: int64 }
        barcode: { type: string }
        field: { type: string, description: "Column name; `row` when the whole row is missing or extra" }
        expected: { type: string, description: Value replayed from the ledger }
        actual: { type: string, description: Stored projection value }

    StockRebuildReport:
      type: object
      required: [applied, units_scanned, movements_replayed, diff_count, diffs, anomalies, started_at, finished_at, diffs_truncated]
      properties:
        organization_id: { type: integer, format: int64 }
        applied: { type: boolean, description: Always false for the HTTP check }
        units_scanned: { type: integer }
        movements_replayed: { type: integer }
        diff_count: { type: integer }
        diffs:
          type: array
          items: { $ref: "#/components/schemas/StockRebuildDiff" }
        anomalies:
          type: array
          description: Breaks in a unit's movement chain (from_status / from_owner not equal to the replayed state; a product break around a reclassification)
          items: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        diffs_truncated: { type: boolean }

    EnvelopeStockRebuildReport:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/StockRebuildReport" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    StockUnitRow:
      type: object
      description: One unit (or one fixed barcode with its quantity on hand) held by an organization.
      required: [uuid, barcode, unit_kind, status, quantity, initial_meters, remaining_meters, product, location,
        purchase_price, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        barcode: { type: string }
        unit_kind: { type: string, enum: [serial, fixed] }
        status: { $ref: "#/components/schemas/StockUnitStatus" }
        quantity: { type: integer, description: "1 for a serial unit, the quantity on hand for a fixed barcode" }
        initial_meters: { type: [string, "null"], description: "Roll length (decimal string, 2 places)" }
        remaining_meters: { type: [string, "null"] }
        product:
          type: object
          required: [uuid, sku, name, unit_type, uses_fixed_barcode]
          properties:
            uuid: { type: string, format: uuid }
            sku: { type: string }
            name: { type: string }
            unit_type: { $ref: "#/components/schemas/CatalogUnitType" }
            uses_fixed_barcode: { type: boolean }
        location:
          description: Bin of a serial unit; null for organization-level stock and fixed barcodes.
          oneOf:
            - $ref: "#/components/schemas/StockLocationRef"
            - type: "null"
        purchase_price:
          description: Null when the viewer may not read it or no price is set.
          oneOf:
            - type: object
              required: [amount, currency, source]
              properties:
                amount: { type: string, description: "Decimal string, 2 places" }
                currency: { type: string, minLength: 3, maxLength: 3 }
                source: { type: string, enum: [list, override, distributor] }
            - type: "null"
        updated_at: { type: string, format: date-time }

    EnvelopeStockUnitPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/StockUnitRow" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeStockProductPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/StockProduct" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    WarehouseCode:
      type: string
      pattern: "^[A-Za-z0-9_]{1,32}$"
      description: Upper-cased on save; the hyphen is the full_code separator.

    Warehouse:
      type: object
      required: [uuid, code, name, address, active, sort_order, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        address: { type: [string, "null"] }
        active: { type: boolean }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WarehouseInput:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { $ref: "#/components/schemas/WarehouseCode" }
        name: { type: string, maxLength: 200, description: Defaults to the code. }
        address: { type: [string, "null"] }

    WarehousePatch:
      type: object
      additionalProperties: false
      properties:
        code: { $ref: "#/components/schemas/WarehouseCode" }
        name: { type: string, maxLength: 200 }
        address: { type: [string, "null"] }
        active: { type: boolean }

    WarehouseReorderInput:
      type: object
      required: [uuids]
      additionalProperties: false
      properties:
        uuids:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, format: uuid }

    WarehouseRoom:
      type: object
      required: [uuid, warehouse_uuid, code, name, active, sort_order, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        warehouse_uuid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WarehouseRoomInput:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { $ref: "#/components/schemas/WarehouseCode" }
        name: { type: string, maxLength: 200, description: Defaults to the code. }

    WarehouseRoomPatch:
      type: object
      additionalProperties: false
      properties:
        code: { $ref: "#/components/schemas/WarehouseCode" }
        name: { type: string, maxLength: 200 }
        active: { type: boolean }

    WarehouseLocationType:
      type: string
      enum: [aisle, shelf, bin]

    WarehouseLocation:
      type: object
      required: [uuid, warehouse_uuid, room_uuid, parent_uuid, type, code, full_code, name, active, sort_order, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        warehouse_uuid: { type: string, format: uuid }
        room_uuid: { type: string, format: uuid }
        parent_uuid: { type: [string, "null"], format: uuid }
        type: { $ref: "#/components/schemas/WarehouseLocationType" }
        code: { type: string }
        full_code: { type: string, example: "IST-R1-A-01-03" }
        name: { type: string }
        active: { type: boolean }
        sort_order: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WarehouseLocationInput:
      type: object
      required: [room_uuid, type, code]
      additionalProperties: false
      properties:
        room_uuid: { type: string, format: uuid }
        parent_uuid: { type: [string, "null"], format: uuid }
        type: { $ref: "#/components/schemas/WarehouseLocationType" }
        code: { $ref: "#/components/schemas/WarehouseCode" }
        name: { type: string, maxLength: 200, description: Defaults to the code. }

    WarehouseLocationPatch:
      type: object
      additionalProperties: false
      properties:
        code: { $ref: "#/components/schemas/WarehouseCode" }
        name: { type: string, maxLength: 200 }
        active: { type: boolean }

    WarehouseGenerateLevel:
      type: object
      required: [type]
      additionalProperties: false
      description: Either `codes`, or the range `from`..`to` rendered as prefix + zero-padded number.
      properties:
        type: { $ref: "#/components/schemas/WarehouseLocationType" }
        codes:
          type: array
          items: { $ref: "#/components/schemas/WarehouseCode" }
        from: { type: integer, minimum: 0, maximum: 9999 }
        to: { type: integer, minimum: 0, maximum: 9999 }
        pad: { type: integer, minimum: 0, maximum: 4 }
        prefix: { type: string }

    WarehouseGenerateInput:
      type: object
      required: [room_uuid, levels]
      additionalProperties: false
      properties:
        room_uuid: { type: string, format: uuid }
        parent_uuid: { type: [string, "null"], format: uuid }
        levels:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WarehouseGenerateLevel" }

    WarehouseGenerateResult:
      type: object
      required: [created, existing]
      properties:
        created: { type: integer }
        existing: { type: integer }

    EnvelopeWarehouse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/Warehouse" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeWarehouseList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Warehouse" } } } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeWarehouseRoom:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WarehouseRoom" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeWarehouseRoomList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/WarehouseRoom" } } } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeWarehouseLocation:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WarehouseLocation" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeWarehouseLocationList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/WarehouseLocation" } } } }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeWarehouseGenerateResult:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/WarehouseGenerateResult" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    StockCountStatus:
      type: string
      enum: [draft, in_progress, pending_review, approved, cancelled]

    StockCountInput:
      type: object
      required: [warehouse_uuid, method, visibility]
      additionalProperties: false
      properties:
        warehouse_uuid: { type: string, format: uuid }
        method: { type: string, enum: [location_first, unit_first, product_qty, initial_placement] }
        visibility: { type: string, enum: [blind, guided] }
        scope_type: { type: string, enum: [warehouse, room, location, product], default: warehouse }
        room_uuid: { type: [string, "null"], format: uuid, description: "scope_type=room" }
        location_uuid: { type: [string, "null"], format: uuid, description: "scope_type=location (the location and its subtree)" }
        product_uuid: { type: [string, "null"], format: uuid, description: "scope_type=product (a product of the active brand)" }
        note: { type: [string, "null"], maxLength: 500 }

    StockCountRef:
      type: object
      required: [uuid, code, name]
      properties:
        uuid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    StockCountLocation:
      type: object
      required: [uuid, full_code, name]
      properties:
        uuid: { type: string, format: uuid }
        full_code: { type: string }
        name: { type: string }

    StockCountProduct:
      type: object
      required: [uuid, sku, name]
      properties:
        uuid: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }

    StockCountUnit:
      type: object
      required: [uuid, barcode, unit_kind]
      properties:
        uuid: { type: string, format: uuid }
        barcode: { type: string }
        unit_kind: { type: string, enum: [serial, fixed] }

    StockCount:
      type: object
      required: [uuid, status, method, visibility, scope_type, warehouse, scope_room, scope_location, scope_product, note,
        start_approval_required, start_approved_at, started_at, completed_at, approved_at, cancelled_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/StockCountStatus" }
        method: { type: string, enum: [location_first, unit_first, product_qty, initial_placement] }
        visibility: { type: string, enum: [blind, guided] }
        scope_type: { type: string, enum: [warehouse, room, location, product] }
        warehouse: { $ref: "#/components/schemas/StockCountRef" }
        scope_room:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StockCountRef"
        scope_location:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StockCountLocation"
        scope_product:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StockCountProduct"
        note: { type: [string, "null"] }
        start_approval_required: { type: boolean, description: "initial_placement starts after approve-start." }
        start_approved_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        approved_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        progress:
          description: Detail responses only.
          type: object
          required: [scans, serial_units, fixed_quantity, product_quantity]
          properties:
            scans: { type: integer }
            serial_units: { type: integer }
            fixed_quantity: { type: integer, format: int64 }
            product_quantity: { type: integer, format: int64 }
        expected:
          description: Guided counts while draft or in progress only; never present for a blind count.
          type: object
          required: [serial_units, fixed_quantity, locations]
          properties:
            serial_units: { type: integer }
            fixed_quantity: { type: integer, format: int64 }
            locations:
              type: array
              items:
                type: object
                required: [location, serial_units, fixed_quantity]
                properties:
                  location:
                    description: Null for stock held by the organization without a location.
                    oneOf:
                      - type: "null"
                      - $ref: "#/components/schemas/StockCountLocation"
                  serial_units: { type: integer }
                  fixed_quantity: { type: integer, format: int64 }
        summary:
          description: Completed counts only.
          type: object
          required: [lines, by_result, unresolved]
          properties:
            lines: { type: integer }
            by_result:
              type: object
              additionalProperties: { type: integer }
            unresolved: { type: integer }

    StockCountScanInput:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 200, description: "Location QR, unit barcode / QR, SKU or short code (TEC-203)." }
        location_uuid: { type: [string, "null"], format: uuid, description: "Counted location; default: the user's last location scan." }
        quantity: { type: [integer, "null"], minimum: 1, maximum: 100000, description: "Fixed barcodes and SKUs (default 1); serial units are 1." }
        meters: { type: [string, "null"], example: "8.50", description: "Measured roll length (roll units only)." }

    StockCountScan:
      type: object
      required: [uuid, kind, raw_code, unit, product, location, quantity, meters, created_at]
      properties:
        uuid: { type: string, format: uuid }
        kind: { type: string, enum: [location, serial, fixed, product] }
        raw_code: { type: string }
        unit:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StockCountUnit"
        product:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StockCountProduct"
        location:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StockCountLocation"
        quantity: { type: integer }
        meters: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    StockCountScanResult:
      type: object
      required: [scan, location_context]
      properties:
        scan: { $ref: "#/components/schemas/StockCountScan" }
        location_context:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/StockCountLocation"
        expected:
          description: Guided counts only; omitted for blind counts.
          type: object
