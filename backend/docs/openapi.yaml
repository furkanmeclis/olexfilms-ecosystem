  # ---------------------------------------------------------------------------
  # TEC-202: barcode batches (center only), label templates and label PDFs.
  /v1/stock/barcodes:
    get:
      tags: [Stock]
      operationId: listBarcodeBatches
      summary: List barcode batches of the center
      description: >-
        Needs `stock.read` in the active organization; only the center
        issues barcodes (K14), any other organization type answers 403
        STOCK_BARCODES_CENTER_ONLY. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBarcodeBatchPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Stock]
      operationId: createBarcodeBatch
      summary: Reserve N barcodes for a product (center only)
      description: >-
        Needs `stock.write` at the center (K14; other organization types
        answer 403 STOCK_BARCODES_CENTER_ONLY). Allocates `quantity`
        barcodes `<PREFIX>-<8 digits>` (e.g. `OLEX-00000123`) from the
        brand's counter under its lock and creates the units in status
        `printed` (like the stock import); they enter stock later through
        the stock entry flow. Roll products need `meters` (the length of
        each roll); fixed-barcode products get fixed units. The prefix
        defaults to the brand slug (A-Z0-9, 2-8 characters). The roll split
        barcode `<barcode>-S<n>` never collides with this format. The
        response carries every unit and `labels_url`, the batch's label PDF.
        An inactive product answers 422 STOCK_PRODUCT_INACTIVE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BarcodeBatchInput"
      responses:
        "201":
          description: Batch reserved; units created in status printed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBarcodeBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/stock/barcodes/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Stock]
      operationId: getBarcodeBatch
      summary: Get a barcode batch with its units
      description: Needs `stock.read` at the center (403 STOCK_BARCODES_CENTER_ONLY elsewhere).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBarcodeBatch"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stock/barcodes/{uuid}/labels.pdf:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Stock]
      operationId: printBarcodeBatchLabels
      summary: Label sheet PDF of a batch
      description: >-
        Needs `stock.read` at the center. Renders one label per unit of the
        batch through the PDF engine (Gotenberg) with the template given by
        `template`, else the batch's template, else the organization's
        default unit template, else the built-in code128 70x37 mm sheet.
        Counts the print (`print_count`, `last_printed_at`). 503
        STOCK_LABEL_RENDERER_UNAVAILABLE when the PDF engine is down.
      security:
        - bearerAuth: []
      parameters:
        - name: template
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Unit label template uuid
      responses:
        "200":
          description: Label sheet
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: PDF engine unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/stock/label-templates:
    get:
      tags: [Stock]
      operationId: listLabelTemplates
      summary: List label templates of the active organization
      description: >-
        Needs `stock.read`. Templates belong to the center or a distributor
        (the dealer has no label printing, K12). `kind` narrows to unit or
        location templates.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema: { $ref: "#/components/schemas/LabelTemplateKind" }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLabelTemplateList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Stock]
      operationId: createLabelTemplate
      summary: Create a label template
      description: >-
        Needs `stock.write`. Unit templates print code128 or QR
        (`OFW:UNIT:<barcode>`), location templates always QR
        (`OFW:LOC:<full_code>`). Logo modes: none, text (`logo_text`) or
        image (`logo_image`, a `data:image/png` or `data:image/jpeg` base64
        URI up to 200 KB). Missing fields take the kind's defaults
        (unit: code128 70x37 mm, 3 columns; location: QR 50x50 mm, 4
        columns). `is_default` makes it the default of its kind for the
        organization. 409 STOCK_LABEL_TEMPLATE_NAME_TAKEN on a duplicate
        name.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelTemplateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLabelTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/stock/label-templates/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Stock]
      operationId: getLabelTemplate
      summary: Get a label template
      description: Needs `stock.read`; the template must belong to the active organization.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLabelTemplate"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Stock]
      operationId: updateLabelTemplate
      summary: Replace a label template
      description: >-
        Needs `stock.write`. Replaces every editable field (the kind is
        fixed); omitted fields take the current values. `is_default: true`
        moves the default of the kind to this template.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelTemplateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLabelTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Stock]
      operationId: deleteLabelTemplate
      summary: Delete a label template
      description: Needs `stock.write`. Batches that referenced it keep no template link.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stock/labels/units.pdf:
    get:
      tags: [Stock]
      operationId: printUnitLabels
      summary: Label sheet PDF of the given unit barcodes
      description: >-
        Needs `stock.read`. One label per `barcode` (repeat the parameter;
        at most 1000). A unit is printable when its holder is inside the
        caller's stock.read reach, or, while it is only printed (not in
        stock yet), when the caller is its issuing center. The new unit of a
        roll split links here (`new_unit.label_url`). Unknown or unreachable
        barcodes answer 404. Template as for the batch sheet.
      security:
        - bearerAuth: []
      parameters:
        - name: barcode
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: template
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Label sheet
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: PDF engine unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/warehouse/labels/locations.pdf:
    get:
      tags: [Warehouse]
      operationId: printLocationLabels
      summary: QR label sheet PDF of warehouse locations
      description: >-
        Needs `warehouse.read` with the warehouse module on (center or
        distributor, K12). Prints every typed location of `room` and/or the
        listed `location` uuids of the active organization (at most 1000).
        Each label carries the QR payload `OFW:LOC:<full_code>` and the
        full_code text. Template: `template`, else the organization's default
        location template, else the built-in QR 50x50 mm sheet.
      security:
        - bearerAuth: []
      parameters:
        - name: room
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: location
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: template
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Label sheet
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: PDF engine unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # TEC-206: stock counts (4 methods, blind/guided, difference resolution).
  /v1/warehouse/stock-counts:
    get:
      tags: [Warehouse]
      operationId: listStockCounts
      summary: Stock counts of the active organization
      description: >-
        Needs `warehouse.read` with the warehouse module on (center or
        distributor, 403 for dealers, K12). Newest first; no expected values.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/StockCountStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page of counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeStockCountPage" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Warehouse]
      operationId: createStockCount
      summary: Open a draft stock count
      description: >-
        Needs `warehouse.write`. The count covers one warehouse of the active
        organization and a scope inside it: `warehouse` (default), `room`
        (`room_uuid`), `location` (`location_uuid`, the location and its
        subtree) or `product` (`product_uuid`, a product of the active brand
        inside the warehouse). Methods: `location_first` (a location is
        required for every unit scan), `unit_first` (the location is optional
        for serial units), `product_qty` (SKUs of serial products and fixed
        barcodes with a quantity per location), `initial_placement` (the
        organization's unlocated units are placed into the scope's locations;
        needs `approve-start`; no product scope). `blind` never returns
        expected values while counting, `guided` does.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockCountInput" }
      responses:
        "201":
          description: Draft count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeStockCount" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/warehouse/stock-counts/{uuid}:
    get:
      tags: [Warehouse]
      operationId: getStockCount
      summary: Stock count detail
      description: >-
        Needs `warehouse.read`. Carries `progress`; `expected` (per location)
        only for a guided count while it is draft or in progress (a blind count
        never has it); `summary` once completed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeStockCount" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/warehouse/stock-counts/{uuid}/approve-start:
    post:
      tags: [Warehouse]
      operationId: approveStockCountStart
      summary: Approve the start of a draft count
      description: >-
        Needs `warehouse.write`. Required before `start` for
        `initial_placement`; idempotent. 409 COUNT_INVALID_STATUS unless draft.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeStockCount" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/stock-counts/{uuid}/start:
    post:
      tags: [Warehouse]
      operationId: startStockCount
      summary: Start scanning
      description: >-
        Needs `warehouse.write`. draft -> in_progress. 409
        COUNT_START_APPROVAL_REQUIRED for an unapproved initial_placement, 409
        COUNT_INVALID_STATUS unless draft.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeStockCount" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/warehouse/stock-counts/{uuid}/scans:
    get:
      tags: [Warehouse]
      operationId: listStockCountScans
      summary: Recorded scans of a count
      description: Needs `warehouse.read`. No expected values.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Scans, oldest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeStockCountScanList" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Warehouse]
      operationId: scanStockCount
      summary: Record one scan
      description: >-
        Needs `warehouse.write`; the count must be in progress (409
        COUNT_INVALID_STATUS). The code is resolved by the TEC-203 resolver
        (units follow the caller's `stock.read` reach; 404 SCAN_NO_MATCH). A
        location scan sets the scanning user's location context; a unit or
        SKU scan is counted at `location_uuid`, else at that context. 422
        COUNT_LOCATION_OUT_OF_SCOPE for a location outside the scope (nothing
        is recorded), 422 COUNT_LOCATION_REQUIRED when the method needs a
        location, 422 COUNT_PRODUCT_OUT_OF_SCOPE for another product of a
        product-scoped count, 422 COUNT_SCAN_KIND_NOT_ALLOWED (serial units in
        product_qty, SKUs outside product_qty, SKUs of fixed-barcode products),
        409 COUNT_UNIT_ALREADY_SCANNED for a serial unit counted twice.
        `quantity` counts fixed barcodes and SKUs; `meters` is the measured
        length of a roll. `expected` is present for guided counts only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockCountScanInput" }
      responses:
