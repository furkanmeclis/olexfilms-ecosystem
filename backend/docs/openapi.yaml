  /v1/services/{uuid}/stock-units:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Services]
      operationId: listServiceStockUnits
      summary: Stock picker of the service organization
      description: >-
        Units the service organization can add as items (TEC-180): serial
        units it holds (available or placed) that no open service has taken
        (a roll that is only cut stays listed) and fixed barcodes with
        pieces on hand. barcode is an exact barcode (scanner lookup),
        product_uuid narrows to one product, min_meters lists only rolls
        with at least that many meters left, q matches a part of the
        product name, SKU or barcode (TEC-182 product search). Each
        product carries its category's available_parts, the parts a new
        item may apply. Needs services.write on the service; a service
        outside the read scope is 404.
      security:
        - bearerAuth: []
      parameters:
        - name: barcode
          in: query
          schema: { type: string, maxLength: 64 }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: product_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: min_meters
          in: query
          schema: { type: string, pattern: "^[0-9]{1,8}(\\.[0-9]{1,2})?$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Units of the service organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeServiceStockUnitList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services/{uuid}/transitions:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Services]
      operationId: transitionService
      summary: Move a service to another status
      description: >-
        Legacy state machine (TEC-179): draft -> pending -> processing ->
        ready (services.write); center shortcuts draft -> processing and
        pending -> ready; draft | pending | processing | ready -> cancelled
        (services.cancel, center only; a dealer gets 403). draft |
        processing | ready -> completed (services.complete, TEC-180)
        consumes the stock of every item in the same transaction
        (consumption for a whole unit, partial_consumption for a cut;
        idempotency key service:service_item:<id>), links each item to its
        stock movement and writes one service.completed outbox event. A
        service without items answers 400; a unit that is no longer held or
        a cut longer than the rest of the roll answers 409
        SERVICE_UNIT_NOT_AVAILABLE and nothing is written. Completed and
        cancelled are final (409 SERVICE_INVALID_TRANSITION). A request for
        the current status is a no-op (completing a completed service
        consumes nothing and emits nothing). Every move writes a status log
        and a service.* outbox event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTransitionInput"
      responses:
        "200":
          description: Service after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/services/{uuid}/cancel-completed:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Services]
      operationId: cancelCompletedService
      summary: Cancel a completed service
      description: >-
        TEC-356 / TEC-230 decision. Needs services.cancel_completed reaching
        the service; dealer_staff has no grant and receives 403. The service
        must be completed; already cancelled services answer 409
        SERVICE_INVALID_TRANSITION and non-completed services answer 409
        SERVICE_NOT_EDITABLE. reason is mandatory. In one transaction the
        warranties of the service are voided with reason service_cancelled,
        whole consumed units are returned to the service organization's
        stock with ledger return movements, open accounting rows sourced by
        the service are reversed with append-only entries, the service moves
        to cancelled, service.cancelled and warranty.voided outbox events
        are written and an activity row is recorded. Services containing a
        partial_consumption item answer 422
        SERVICE_CONSUMPTION_NOT_REVERSIBLE because the return helper can
        safely reverse only whole consumptions.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCancelCompletedInput"
      responses:
        "200":
          description: Cancelled service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/services/{uuid}/images:
