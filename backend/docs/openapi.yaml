  /v1/library:
    get:
      tags: [Library]
      operationId: listLibraryItems
      summary: List visible document library items
      parameters:
        - name: folder
          in: query
          schema: { type: string, format: uuid }
        - name: tag
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string, example: de }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: Items visible to the active organization and roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLibraryItemList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/library/items:
    post:
      tags: [Library]
      operationId: createLibraryItem
      summary: Create a document library item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLibraryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/library/items/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    patch:
      tags: [Library]
      operationId: patchLibraryItem
      summary: Update a document library item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryItemInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLibraryItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Library]
      operationId: archiveLibraryItem
      summary: Archive a document library item
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeArchiveResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/library/items/{uuid}/versions:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Library]
      operationId: listLibraryItemVersions
      summary: List item version history
      responses:
        "200":
          description: Version history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLibraryVersionList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Library]
      operationId: createLibraryItemVersion
      summary: Upload a localized file version
      requestBody:
        required: true
