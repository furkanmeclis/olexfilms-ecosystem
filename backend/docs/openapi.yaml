  /v1/leads/{uuid}/task:
    post:
      tags: [Leads]
      operationId: createLeadTask
      summary: Create a center task linked to a lead
      description: The active organization must be the brand center.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadTaskInput" }
      responses:
        "201":
          description: Task opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvelopeTask" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: Center tasks of the active brand, newest first
      description: >-
        Needs tasks.read (center roles only; distributor and dealer members
        get 403). The active organization must be the brand center.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: A status, or `active` for open and in_progress
          schema:
            type: string
            enum: [open, in_progress, done, cancelled, active]
        - name: priority
          in: query
          schema: { $ref: "#/components/schemas/TaskPriority" }
        - name: subject_organization_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: assignee_user_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: mine
          in: query
          description: Only tasks assigned to the caller
          schema: { type: boolean }
        - name: due_after
          in: query
          description: Only tasks due at or after this instant (TEC-221); tasks without a due date are left out
          schema: { type: string, format: date-time }
        - name: due_before
          in: query
          description: Only tasks due before this instant (TEC-221); tasks without a due date are left out
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaskPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Open a manual task about a distributor or dealer of the brand
      description: >-
        Needs tasks.write. The subject must be a distributor or dealer of the
        active brand and the assignee a member of the center (400
        VALIDATION_ERROR otherwise). Writes tasks.created (and tasks.assigned
        with an assignee).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateInput"
      responses:
        "201":
          description: Task opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/tasks/{uuid}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: One task of the active brand
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTask"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update, assign, close or reopen a task
      description: >-
        Needs tasks.write. Absent fields stay; `assignee_user_uuid: null` and
        `due_at: null` clear them. Status done or cancelled closes the task
        (closed_at); open or in_progress reopens it. Writes tasks.updated,
        tasks.assigned and tasks.status_changed as they apply.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdateInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tasks/{uuid}/comments:
    get:
      tags: [Tasks]
      operationId: listTaskComments
      summary: Comments of a task, oldest first
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaskCommentPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Tasks]
      operationId: addTaskComment
      summary: Comment on a task
      description: Needs tasks.write. Comments are append-only. Writes tasks.comment_added.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaskComment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tasks/bulk:
    post:
      tags: [Tasks]
      operationId: bulkTasks
      summary: Run a logged, undoable bulk action on center tasks (TEC-212)
      description: >-
        Action `assign` with `target.params.assignee_uuid` (a member of the
        center, tasks.write) on target scope `ids`; closed tasks fail per
        item. Undo through `/v1/tenant/bulk-operations/{uuid}/undo`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkExecuteRequest"
      responses:
        "200":
          description: Sync bulk result with its undoable operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkSyncResult"
        "202":
          description: Async bulk job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/tasks/assignees:
    get:
      tags: [Tasks]
      operationId: listTaskAssignees
      summary: Members of the active center for the task assignee picker (TEC-221)
      description: Needs tasks.read; the active organization must be the brand center.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Center members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTaskAssigneeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/portal/vehicles:
    get:
      tags: [Portal]
      operationId: listPortalVehicles
      summary: The portal user's vehicles (TEC-238)
      description: >-
        Portal session (aud=portal) with vehicles.read: only the vehicles the
        signed-in user owns in the domain brand (K20). Glorian vehicles never
        come back (K1/K2). Counts cover the user's non-draft services and
        active warranties of each vehicle. No measurement data.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePortalVehiclePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/portal/vehicles/{uuid}:
    get:
      tags: [Portal]
      operationId: getPortalVehicle
      summary: One vehicle of the portal user with services and active warranties (TEC-238)
      description: >-
        The vehicle, a summary of the user's services on it across every
        organization of the domain brand, the latest services (at most 50;
        the full history is GET /v1/portal/services) and the active
        warranties with days and percent left. Another user's vehicle, a
        Glorian vehicle or an invalid uuid answers 404. No measurement data.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Vehicle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePortalVehicleDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/portal/services:
    get:
      tags: [Portal]
      operationId: listPortalServices
      summary: The portal user's services across every organization (TEC-238)
      description: >-
        Portal session (aud=portal) with services.read: the signed-in user's
        services at every dealer / distributor of the domain brand in one
        list, newest first. A service is the user's when the user is its
        customer or holds one of its warranties (TEC-239 rule: a new owner
        with a transferred warranty sees it). Draft services and Glorian
        rows are not listed. No measurement data.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePortalServicePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/portal/vehicles/{uuid}/transfers:
    get:
      tags: [Portal]
      operationId: listPortalVehicleTransfers
      summary: Ownership transfers of the portal user's vehicle (TEC-243)
      description: >-
        Portal session (aud=portal) with vehicles.read. Same list as GET
        /v1/vehicles/{uuid}/transfers, limited to a vehicle the signed-in
        user owns in the domain brand; any other vehicle answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Transfers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleTransferList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Portal]
      operationId: startPortalVehicleTransfer
      summary: The owner starts the transfer of their vehicle with two codes (TEC-243)
      description: >-
        Portal session with vehicles.read; the vehicle must be the signed-in
        user's (else 404). Runs the TEC-190 flow unchanged: one 6 digit code
        to the owner, one to the new owner (WhatsApp, SMS fallback), 15
        minute expiry, the same 409 / 429 / 502 / 503 codes. The transfer's
        organization (phone country, message sender, the organization the
        new owner is linked to) is the organization that registered the
        vehicle, else the owner's first organization link in the brand,
        else the brand center. A fleet session (read only, TEC-245) answers 403 PORTAL_READ_ONLY.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleTransferStartInput"
      responses:
        "201":
          description: Started; both codes sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "502":
          description: VEHICLE_TRANSFER_DELIVERY_FAILED (a code could not be delivered; nothing saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: VEHICLE_TRANSFER_UNAVAILABLE (no message sender configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/portal/vehicle-transfers/{uuid}/verify:
    post:
      tags: [Portal]
      operationId: verifyPortalVehicleTransfer
      summary: The owner enters the two codes; completes the transfer (TEC-243)
      description: >-
        Portal session with vehicles.read; only a transfer the signed-in user
        started as the owner (else 404). Same rules as POST
        /v1/vehicle-transfers/{uuid}/verify: codes together or one by one,
        422 VEHICLE_TRANSFER_INVALID_CODE with the attempts left, 409
        VEHICLE_TRANSFER_LOCKED / EXPIRED / NOT_PENDING (a cancelled
        transfer), new_owner_name required when the new owner has no
        account yet. A fleet session (read only, TEC-245) answers 403 PORTAL_READ_ONLY.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleTransferVerifyInput"
      responses:
        "200":
          description: Codes accepted (status completed when both sides are verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleTransfer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: VEHICLE_TRANSFER_INVALID_CODE (details[].field names the wrong code, details[].code the attempts left)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/portal/vehicle-transfers/{uuid}/cancel:
    post:
      tags: [Portal]
      operationId: cancelPortalVehicleTransfer
      summary: The owner cancels a pending transfer (TEC-243)
      description: >-
        Portal session with vehicles.read; only a transfer the signed-in user
        started as the owner (else 404). 409 VEHICLE_TRANSFER_NOT_PENDING /
        VEHICLE_TRANSFER_EXPIRED as in the panel. A fleet session (read only, TEC-245) answers 403 PORTAL_READ_ONLY.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeVehicleTransfer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/portal/contracts:
    get:
      tags: [Portal]
      operationId: listPortalContracts
      summary: The portal user's executed vehicle intake contracts
      description: >-
        TEC-288. Portal session (aud=portal) with services.read; customer and
        fleet sessions alike. Lists executed contract_instances for services
        the user owns as customer or warranty holder, within the domain brand,
        excluding Glorian, newest execution first. With no executed contract
        the answer is 200 with an empty list.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Contracts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePortalContractPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/portal/contracts/{uuid}/pdf:
    get:
      tags: [Portal]
      operationId: getPortalContractPdf
      summary: Executed contract PDF of the signed-in customer
      description: >-
        TEC-288. Portal session (services.read); same ownership rule as
        GET /v1/portal/contracts. Another customer's contract or a PDF that is
        not ready answers 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/portal/notification-preferences:
    get:
      tags: [Portal]
      operationId: getPortalNotificationPreferences
      summary: Own notification preferences from the portal (TEC-245)
      description: >-
        Same handler and model as GET /v1/notification-preferences (F0-10),
        mounted for the portal realm (the panel path answers 403
        REALM_FORBIDDEN to a portal token).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [Portal]
      operationId: putPortalNotificationPreferences
      summary: Update own notification preferences from the portal (TEC-245)
      description: >-
        Same handler and rules as PUT /v1/notification-preferences. The
        preferences are the user's own account settings, so a read-only
        fleet session may change them too.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/platform/integrations/glorian:
    get:
      tags: [Platform]
      operationId: getGlorianIntegration
      summary: Read the Glorian hub connection (TEC-273)
      description: >-
        Needs integrations.glorian.view (an `all` grant, or a `brand` grant on
        the glorian brand's domain). The API key is write only: the response
        never carries it, only `api_key_set` and a fixed mask. A brand without
        a connection answers `configured: false` with the defaults.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianConnection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Platform]
      operationId: putGlorianIntegration
      summary: Create or replace the Glorian hub connection (TEC-273)
      description: >-
        Needs integrations.glorian.manage. `api_key` is write only: omitted or
        blank keeps the stored key; it is stored encrypted. Activating needs a
        key. A new connection belongs to the glorian brand's center
        organization (422 GLORIAN_CENTER_MISSING when there is none).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutGlorianConnectionRequest"
      responses:
        "200":
          description: Saved connection settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianConnection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: GLORIAN_CENTER_MISSING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/platform/integrations/glorian/test:
    post:
      tags: [Platform]
      operationId: testGlorianIntegration
      summary: Ping the Glorian hub with the stored settings (TEC-273)
      description: >-
        Needs integrations.glorian.manage. Sends GET product-categories (one
        row) with the stored URL and key, also for an inactive connection. A
        failed ping is a 200 with `ok: false`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Ping result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianTestResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/platform/integrations/glorian/sync-runs:
    get:
      tags: [Platform]
      operationId: listGlorianSyncRuns
      summary: List the sync runs of the Glorian connection (TEC-273)
      description: Needs integrations.glorian.view. Newest first.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [pull_categories, pull_products, pull_dealers, pull_stock, push_barcodes, outbound, reconcile]
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [running, succeeded, failed] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Sync runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianSyncRunList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Platform]
      operationId: triggerGlorianSync
      summary: Queue a manual Glorian sync (TEC-273)
      description: >-
        Needs integrations.glorian.manage. `pull` (default) queues the
        catalog, dealer and stock pull, `push_barcodes` the barcode push,
        `outbound_replay` the replay of held order outbounds. The runs appear
        in the list when the worker takes the task. 422
        GLORIAN_CONNECTION_INACTIVE for an inactive connection, 503
        QUEUE_UNAVAILABLE when the task queue is off.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriggerGlorianSyncRequest"
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianSyncQueued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: GLORIAN_CONNECTION_INACTIVE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: QUEUE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/platform/integrations/glorian/sync-runs/{uuid}:
    get:
      tags: [Platform]
      operationId: getGlorianSyncRun
      summary: Read one Glorian sync run (TEC-273)
      description: >-
        Needs integrations.glorian.view. `counts` holds the run totals; a
        reconcile run also has the first rows of every drift category under
        `counts.details`.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sync run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianSyncRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/platform/integrations/glorian/outbounds:
    get:
      tags: [Platform]
      operationId: listGlorianOutbounds
      summary: List Glorian order outbounds in one state (TEC-273)
      description: Needs integrations.glorian.view. Oldest first; `state` defaults to held.
      security:
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, held, sent, failed, cancelled], default: held }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Order outbounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianOutboundList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/platform/integrations/glorian/outbounds/{uuid}/replay:
    post:
      tags: [Platform]
      operationId: replayGlorianOutbound
      summary: Queue the replay of one held or failed order outbound (TEC-273)
      description: >-
        Needs integrations.glorian.manage. The worker re-reads the order and
        the hub order, so a replay never repeats a step; a pending replay of
        the same outbound is reused. 422 GLORIAN_OUTBOUND_NOT_REPLAYABLE for
        another state, 503 QUEUE_UNAVAILABLE when the task queue is off.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Replay queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianOutbound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: GLORIAN_OUTBOUND_NOT_REPLAYABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: QUEUE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/platform/integrations/glorian/reconcile:
    post:
      tags: [Platform]
      operationId: startGlorianReconcile
      summary: Start a Glorian reconcile drift report (TEC-273)
      description: >-
        Needs integrations.glorian.manage. Opens a running reconcile sync run
        and queues the report; GET /sync-runs/{uuid} shows the result. Read
        only: the report never writes units or the ledger. 503
        QUEUE_UNAVAILABLE when the task queue is off.
      security:
        - bearerAuth: []
      responses:
        "202":
          description: Running reconcile sync run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeGlorianSyncRun"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: QUEUE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/library/folders:
    get:
      tags: [Library]
      operationId: listLibraryFolders
      summary: List document library folders
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLibraryFolderList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Library]
      operationId: createLibraryFolder
      summary: Create a document library folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryFolderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLibraryFolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/library/folders/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    patch:
      tags: [Library]
      operationId: patchLibraryFolder
      summary: Update a document library folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryFolderInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLibraryFolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Library]
      operationId: deleteLibraryFolder
