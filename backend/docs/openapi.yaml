    OrganizationRegisterRequest:
      type: object
      required: [name, surname, email, password, organization_name, city, district, phone, address]
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        organization_name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        country_id:
          type: [integer, "null"]
          format: int64
          description: >-
            Structured address. A dealer without parent_uuid is placed under
            the distributor whose territory covers it (district > province >
            country), otherwise under the brand center. Empty city/district
            are filled from the province/district names.
        province_id:
          type: [integer, "null"]
          format: int64
        district_id:
          type: [integer, "null"]
          format: int64

    CreatePlatformOrganizationRequest:
      type: object
      required: [name, owner_user_uuid]
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        owner_user_uuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [distributor, dealer]
          default: dealer
        parent_uuid:
          type: [string, "null"]
          format: uuid
          description: Defaults to the brand center.
        register_as_warehouse:
          type: boolean
          description: >-
            Distributor only; stored in settings. Opens the distributor's
            warehouse (code MAIN, the organization's name and address) in the
            same transaction (TEC-207, K4).
        currency:
          type: string
        locale:
          type: string
          description: Normalized to a Locale code (tr-TR -> tr, zh_CN -> zh-CN); unknown codes -> 422.
        timezone:
          type: string
        country_id:
          type: [integer, "null"]
          format: int64
          description: >-
            Structured address. A dealer without parent_uuid is placed under
            the distributor whose territory covers it (district > province >
            country), otherwise under the brand center. Empty city/district
            are filled from the province/district names.
        province_id:
          type: [integer, "null"]
          format: int64
        district_id:
          type: [integer, "null"]
          format: int64

    PatchPlatformOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        plan_code:
          type: string
        access_starts_at:
          type: string
          format: date-time
        access_ends_at:
          type: string
          format: date-time
        clear_access_ends_at:
          type: boolean
        currency:
          type: string
        locale:
          type: string
          description: Normalized to a Locale code (tr-TR -> tr, zh_CN -> zh-CN); unknown codes -> 422.
        timezone:
          type: string
        parent_uuid:
          type: string
          format: uuid
          description: >-
            Moves the organization in the tree (platform only, K25, step-up).
            In the same transaction the move is recorded
            (organization_parent_changes, audit organization.parent_changed)
            and the open cari with the old parent is carried over (TEC-198):
            closed on the old parent's book (category cari_transfer) and
            opened with the same amount on the new parent's book (category
            opening_balance), on both the parents' and the organization's
            own book; no income/expense, no cash. A zero balance writes
            nothing; moving to the current parent is a no-op. A missing
            exchange rate (parents in different currencies) answers 400 and
            nothing moves.
        country_id:
          type: [integer, "null"]
          format: int64
          description: >-
            Present (null clears) replaces the structured address together
            with province_id/district_id. The parent does not follow the
            address (only the platform admin changes a distributor, K25).
        province_id:
          type: [integer, "null"]
          format: int64
        district_id:
          type: [integer, "null"]
          format: int64

