        `generate_new`: `product_uuid`, `quantity` barcodes (1-1000),
        `meters` for rolls, optional `prefix` and `template_uuid`; the batch
        is reserved through the TEC-202 rules in the same transaction.
        `fixed_quantity` is the stock quantity of each fixed barcode. A
        confirmed or cancelled entry is 409 STOCK_ENTRY_NOT_DRAFT.
      security:
        - bearerAuth: []
