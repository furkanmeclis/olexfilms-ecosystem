        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Export job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/exports/{uuid}/download:
    get:
      tags: [Tenant]
      operationId: downloadTenantExport
      summary: Download organization export file
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/document-templates:
    get:
      tags: [Documents]
      operationId: listDocumentTemplates
      summary: List PDF document template versions
      description: Without `current=false` only active and draft versions are listed. Requires platform.documents.templates.read.
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          schema: { $ref: "#/components/schemas/DocumentKind" }
        - name: language
          in: query
          schema: { type: string }
        - name: current
          in: query
          schema: { type: boolean, default: true }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Template versions page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentTemplatePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Documents]
      operationId: saveDocumentTemplateDraft
      summary: Save the open draft of a kind / brand / language
      description: Updates the open draft or opens the next version. HTML is sanitized server-side; unknown variables are rejected with 422. Requires platform.documents.templates.write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateSaveRequest"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/document-templates/kinds:
    get:
      tags: [Documents]
      operationId: listDocumentKinds
      summary: Document kinds with their variable schema
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Kinds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentKindList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/document-templates/preview:
    post:
      tags: [Documents]
      operationId: previewDocumentTemplate
      summary: Render editor HTML or a stored version with sample data
      description: Synchronous Gotenberg call (rate limited per user). Nothing is stored.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentPreviewRequest"
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/InternalError"

  /v1/platform/document-templates/{uuid}:
    get:
      tags: [Documents]
      operationId: getDocumentTemplate
      summary: Get a template version with HTML and editor state
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Template version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentTemplate"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Documents]
      operationId: updateDocumentTemplateDraft
      summary: Edit a draft version (published versions are immutable, 409)
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentTemplateSaveRequest"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/BadRequest"

  /v1/platform/document-templates/{uuid}/publish:
    post:
      tags: [Documents]
      operationId: publishDocumentTemplate
      summary: Publish a draft (retires the previous active version)
      description: Rendered PDFs of older versions are no longer served; the cache key contains the template hash and version.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentTemplate"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/platform/document-templates/{uuid}/versions:
    get:
      tags: [Documents]
      operationId: listDocumentTemplateVersions
      summary: Every version of the template's kind / brand / language
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Versions, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentTemplateList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tenant/documents/render:
    post:
      tags: [Documents]
      operationId: requestDocumentRender
      summary: Request the PDF of a business record in the active organization
      description: 200 with the cached document when ready, 202 while worker-docs renders it. Repeated requests for the same cache key queue a single task. Visibility comes from the source module (SourceLoader).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRenderRequest"
      responses:
        "200":
          description: Ready document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentRender"
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentRender"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tenant/documents/{uuid}:
    get:
      tags: [Documents]
      operationId: getDocumentRender
      summary: Document render status
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Render
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDocumentRender"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tenant/documents/{uuid}/download:
    get:
      tags: [Documents]
      operationId: downloadDocument
      summary: Stream a ready PDF (other organizations get 404)
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }

  responses:
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        A well-formed value that is not accepted, such as an unsupported locale
        or an unknown timezone (code VALIDATION_ERROR, details[].field names it).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    SearchSpec:
      type: object
      required: [id, label_key]
      properties:
        id: { type: string, example: users }
        label_key: { type: string, example: search.specs.users }
        permission: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        searchable_fields:
          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }
        tenant_scoped: { type: boolean }

    SearchHit:
      type: object
      required: [spec, id, title, href]
      properties:
        spec: { type: string }
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        href: { type: string }
        icon: { type: [string, "null"] }
        score: { type: [number, "null"], format: double }

    SearchSpecsData:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchSpec" }
        enabled: { type: boolean }

    SearchHitsData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    EnvelopeSearchSpecs:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchSpecsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSearchHits:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchHitsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    Error:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        refresh_expires_at:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [uuid, email, name, surname, status, is_super_admin, email_verified]
      properties:
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        status:
          type: string
          examples: [active, disabled]
        is_super_admin:
          type: boolean
        email_verified:
          type: boolean
        locale:
          description: The user's own language; null inherits from the organization (see Me.effective_locale).
          oneOf:
            - $ref: "#/components/schemas/Locale"
            - type: "null"
        timezone:
          type: [string, "null"]
          description: The user's own IANA timezone; null inherits from the organization.
          examples: ["Asia/Dubai"]

    Locale:
      type: string
      description: >-
        Canonical locale code (K10). Inputs are normalized: "zh_CN", "zh-cn"
        and "zh" become zh-CN; a regional code falls back to its language
        ("tr-TR" -> tr). Unknown codes are rejected with 422.
      enum: [tr, en, bg, de, el, uk, ru, fr, es, it, zh-CN, az, ar]

    MeLinks:
      type: object
      required: [profile, change_password, notification_preferences]
      properties:
        profile: { type: string, examples: ["/v1/auth/profile"] }
        change_password: { type: string, examples: ["/v1/auth/password/change"] }
        notification_preferences: { type: string, examples: ["/v1/notification-preferences"] }

    MeChannels:
      type: object
      properties:
        user:
          type: string
          description: Centrifugo channel hint
          examples: ["user:uuid"]

    MeRealtime:
      type: object
      required: [enabled, user_channel]
      properties:
        enabled: { type: boolean }
        ws_url: { type: string }
        user_channel:
          type: string
          examples: ["user:uuid"]

    Me:
      type: object
      required: [user, roles, permissions, links, channels, realtime, effective_locale, effective_timezone]
      properties:
        effective_locale:
          description: >-
            Resolved language: user -> active organization -> brand center ->
            Accept-Language -> tr.
          $ref: "#/components/schemas/Locale"
        effective_timezone:
          type: string
          description: >-
            Resolved IANA timezone: user -> active organization -> brand
            center -> Europe/Istanbul.
          examples: ["Europe/Istanbul"]
        user:
          $ref: "#/components/schemas/PublicUser"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        grants:
          type: object
          description: >-
            Permission slug -> scope in the active organization context (global
            roles + roles of the active membership).
          additionalProperties:
            $ref: "#/components/schemas/PermissionScope"
        active_organization_uuid:
          type: string
          format: uuid
        organization_roles:
          type: array
          description: Roles of the user in the active organization.
          items:
            type: string
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
        links:
          $ref: "#/components/schemas/MeLinks"
        channels:
          $ref: "#/components/schemas/MeChannels"
        realtime:
          $ref: "#/components/schemas/MeRealtime"
        impersonation:
          $ref: "#/components/schemas/MeImpersonation"

    MeImpersonation:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"

    OrganizationMembership:
      type: object
      required: [uuid, slug, name, role, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, staff]
        logo_url:
          type: [string, "null"]
        status:
          type: string
        access_ends_at:
          type: [string, "null"]
          format: date-time
        type:
          $ref: "#/components/schemas/OrganizationType"
        brand:
          $ref: "#/components/schemas/BrandRef"
        parent:
          oneOf:
            - $ref: "#/components/schemas/OrganizationParentRef"
            - type: "null"

    OrganizationType:
      type: string
      enum: [center, distributor, dealer]

    OrganizationStatus:
      type: string
      description: pending and expired are legacy values kept for compatibility.
      enum: [pending, active, read_only, suspended, expired]

    BrandRef:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        name:
          type: string

    OrganizationParentRef:
      type: object
      required: [uuid, name]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    PublicBrand:
      type: object
      required: [uuid, slug, name, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]

    PublicOrganization:
      type: object
      required: [uuid, slug, name, status, access_ok]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
        logo_url:
          type: [string, "null"]
        access_ok:
          type: boolean

    Organization:
      type: object
      required: [uuid, slug, name, city, district, phone, address, status, access_starts_at, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
        plan_code:
          type: [string, "null"]
        access_starts_at:
          type: string
          format: date-time
        access_ends_at:
          type: [string, "null"]
          format: date-time
        logo_url:
          type: [string, "null"]
        type:
          $ref: "#/components/schemas/OrganizationType"
        brand:
          $ref: "#/components/schemas/BrandRef"
        parent:
          oneOf:
            - $ref: "#/components/schemas/OrganizationParentRef"
            - type: "null"
        currency:
          type: string
          description: ISO 4217 code
        locale:
          $ref: "#/components/schemas/Locale"
        timezone:
          type: string
        contract_valid_until:
          type: [string, "null"]
          format: date
        settings:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationRegisterRequest:
      type: object
      required: [name, surname, email, password, organization_name, city, district, phone, address]
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        organization_name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string

    CreatePlatformOrganizationRequest:
      type: object
      required: [name, owner_user_uuid]
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        owner_user_uuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [distributor, dealer]
          default: dealer
        parent_uuid:
          type: [string, "null"]
          format: uuid
          description: Defaults to the brand center.
        register_as_warehouse:
          type: boolean
          description: Distributor only; stored in settings, the warehouse is created in F1.
        currency:
          type: string
        locale:
          type: string
          description: Normalized to a Locale code (tr-TR -> tr, zh_CN -> zh-CN); unknown codes -> 422.
        timezone:
          type: string

    PatchPlatformOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        plan_code:
          type: string
        access_starts_at:
          type: string
          format: date-time
        access_ends_at:
          type: string
          format: date-time
        clear_access_ends_at:
          type: boolean
        currency:
          type: string
        locale:
          type: string
          description: Normalized to a Locale code (tr-TR -> tr, zh_CN -> zh-CN); unknown codes -> 422.
        timezone:
          type: string
        parent_uuid:
          type: string
          format: uuid
          description: Moves the organization in the tree (platform only).

    OrganizationRegisterResult:
      type: object
      required: [user, organization, tokens]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        organization:
