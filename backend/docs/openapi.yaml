  /v1/platform/bulk-operations/{uuid}/undo:
    post:
      tags: [Platform]
      operationId: undoPlatformBulkOperation
      summary: Undo a platform bulk operation (TEC-212)
      description: >-
        Restores the values a platform bulk run (users, roles) changed. Only
        operations without an organization are visible here. Rules: the
        caller holds the action's permission, the operation is undone once
        (second call 409 BULK_UNDO_UNAVAILABLE) and within
        `bulk_undo_window_hours` (409 BULK_UNDO_EXPIRED). A record changed
        after the run is skipped and listed in `undo_result.skipped`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Undone operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBulkOperation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/tenant/bulk-operations:
    get:
      tags: [Tenant]
      operationId: listTenantBulkOperations
      summary: Bulk operation log of the active organization (TEC-212)
      security:
        - bearerAuth: []
      parameters:
