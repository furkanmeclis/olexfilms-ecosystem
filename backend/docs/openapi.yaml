        "204":
          description: Image deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/services/{uuid}/items/{item}/consumption-correction:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
      - name: item
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Services]
      operationId: correctServiceConsumption
      summary: Correct the consumption of an item of a completed service
      description: >-
        TEC-230. The unit consumed by mistake goes back from the service
        into the service organization's stock with a ledger return movement
        (a roll with the meters the consumption took, fixed pieces credited
        back); with replacement_barcode the correct unit of the same
        product is consumed instead (same kind and amount, held by the
        service organization, not in an open service). Idempotency keys
        service:service_item_correction:{item id}:{return or consumption}:{barcode}.
        Center only (services.cancel on the service, else 403), within 24
        hours of the completion (422 SERVICE_CORRECTION_WINDOW_CLOSED), once
        per item (409 SERVICE_ITEM_ALREADY_CORRECTED), whole consumptions
        only (a partial cut answers 422 SERVICE_CONSUMPTION_NOT_REVERSIBLE).
        An item with an active or expired warranty answers 422
        SERVICE_ITEM_WARRANTY_ACTIVE (void the warranty first); the
        replacement gets no warranty. A service that is not completed
        answers 409 SERVICE_NOT_EDITABLE; a replacement that is not held
        answers 409 SERVICE_UNIT_NOT_AVAILABLE, one in an open service 409
        SERVICE_UNIT_IN_USE. Accounting is not touched. Writes a
        service.updated outbox event (change consumption_corrected) and the
        stock.* events of the movements.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceConsumptionCorrectionInput"
      responses:
        "200":
          description: Service with the corrected item (items[].correction)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/stats/top-vehicle-models:
    get:
      tags: [Services]
      operationId: getTopVehicleModels
      summary: Top-10 car brands or models by completed services (center dashboard)
      description: >-
        TEC-151 (F1-09c). Counts completed services only (completed_at in
        the period) of the domain brand (K20): a center organization with a
        brand-wide services.read grant sees its own brand, super_admin the
        brand of the selected organization. Dealers and distributors get
        403. At most 10 rows, highest count first; ties sort by name.
        car_brand.uuid is also the logo id (/brand-logos/{uuid}).
      security:
