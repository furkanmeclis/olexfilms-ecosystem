name: ${COMPOSE_PROJECT_NAME:-${NAME_PREFIX:-app}}

# Local infrastructure only: the prod infrastructure services (postgres, redis,
# seaweedfs, meilisearch, centrifugo, gotenberg, wuzapi) + mailhog + adminer.
# Backend (air) and frontend (pnpm) run on the host via `make local-dev`.
# No dokploy-network. Host ports: adminer 8081, wuzapi 8082 (backend: 8080).

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${NAME_PREFIX:-app}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: ${DB_NAME:-app}
      WUZAPI_DB_NAME: ${WUZAPI_DB_NAME:-wuzapi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:8-alpine
    container_name: ${NAME_PREFIX:-app}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: ${NAME_PREFIX:-app}-seaweedfs
    restart: unless-stopped
    # Single-node SeaweedFS (master + volume + filer + S3 gateway). The bucket
    # is created on start. The admin identity from AWS_ACCESS_KEY_ID denies
    # anonymous S3 access; the JWT keys lock the filer / volume HTTP ports so
    # only the S3 gateway (same process) can read or write objects.
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -bucket=${S3_BUCKET:-app}
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-s3admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-s3admin-secret}
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:-local-seaweedfs-write-key}
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:-local-seaweedfs-write-key}
      WEED_JWT_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:-local-seaweedfs-read-key}
      WEED_JWT_FILER_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:-local-seaweedfs-read-key}
    ports:
      - "${S3_PORT:-9000}:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  mailhog:
    image: mailhog/mailhog:v1.0.1
    platform: linux/amd64
    container_name: ${NAME_PREFIX:-app}-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - app

  adminer:
    image: adminer:4
    container_name: ${NAME_PREFIX:-app}-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - app

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ${NAME_PREFIX:-app}-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-app-dev-meili-master-key-change-me}
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # Use 127.0.0.1 — BusyBox wget resolves localhost to ::1; Meili listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: ${NAME_PREFIX:-app}-centrifugo
    restart: unless-stopped
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:-app-centrifugo-api-key-change-me}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:-app-centrifugo-token-hmac-change-me}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost:3000 http://127.0.0.1:3000}
    ports:
      - "${CENTRIFUGO_PORT:-8000}:8000"
    volumes:
      - ./deploy/centrifugo/config.json:/centrifugo/config.json:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--address=http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: ${NAME_PREFIX:-app}-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*$
    ports:
      - "${GOTENBERG_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  wuzapi:
    image: asternic/wuzapi:1.0.9
    container_name: ${NAME_PREFIX:-app}-wuzapi
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export PGPASSWORD="$$DB_PASSWORD";
        psql -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = '$$DB_NAME'" | grep -q 1
        || createdb -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" "$$DB_NAME";
        unset PGPASSWORD;
        exec /app/wuzapi --logtype=console --color=true
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:-app-dev-wuzapi-admin-token-change-me}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY:-app-dev-wuzapi-encryption-key-32}
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_WEBHOOK_SECRET:-app-dev-wuzapi-webhook-secret-change-me}
      # Host backend from inside Docker (Linux: host-gateway mapping below).
      WUZAPI_GLOBAL_WEBHOOK: ${WUZAPI_WEBHOOK_URL:-}
      WEBHOOK_FORMAT: json
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: ${WUZAPI_DB_NAME:-wuzapi}
      DB_SSLMODE: "false"
      TZ: ${WUZAPI_TZ:-Europe/Istanbul}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WUZAPI_PORT:-8082}:8080"
    volumes:
      - wuzapi_data:/app/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-${NAME_PREFIX:-app}-postgres}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-${NAME_PREFIX:-app}-redis}
  seaweedfs_data:
    name: ${SEAWEEDFS_VOLUME_NAME:-${NAME_PREFIX:-app}-seaweedfs}
  meili_data:
    name: ${MEILI_VOLUME_NAME:-${NAME_PREFIX:-app}-meilisearch}
  wuzapi_data:
    name: ${WUZAPI_VOLUME_NAME:-${NAME_PREFIX:-app}-wuzapi}

networks:
  app:
    name: ${LOCAL_NETWORK_NAME:-${NAME_PREFIX:-app}}
    driver: bridge
