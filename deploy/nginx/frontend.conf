# Nginx config for the Next.js frontend sidecar.
# Serves /_next/static/* directly from disk with gzip; proxies everything
# else to the Next.js standalone server on port 3001.

pid        /tmp/nginx.pid;
error_log  /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log off;
    sendfile   on;

    # For regular HTTP requests, keep the upstream connection alive.
    # For WebSocket upgrade requests, forward the Upgrade header.
    map $http_upgrade $connection_upgrade {
        default   upgrade;
        ''        keep-alive;
    }

    # Write temp files to /tmp so the app user can write them
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path        /tmp/nginx-proxy;
    fastcgi_temp_path      /tmp/nginx-fastcgi;
    uwsgi_temp_path        /tmp/nginx-uwsgi;
    scgi_temp_path         /tmp/nginx-scgi;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    upstream nextjs {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    server {
        listen 3000;

        # Immutable Next.js build assets — serve directly with gzip and a
        # year-long cache. No proxy round-trip needed.
        location /_next/static/ {
            alias /app/.next/static/;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 365d;
        }

        # Public folder assets
        location /public/ {
            alias /app/public/;
            add_header Cache-Control "public, max-age=86400";
        }

        # Proxy everything else (pages, API routes, _next/image, etc.)
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_cache_bypass                 $http_upgrade;
            proxy_read_timeout                 60s;
            proxy_connect_timeout              10s;

            # Auth.js session cookies carry the full Go access+refresh JWT
            # pair and can exceed nginx's default 4k/8k header buffer,
            # producing "upstream sent too big header" (502) on routes that
            # rewrite the session (organization-context, refresh, impersonate).
            proxy_buffer_size                  16k;
            proxy_buffers                      4 16k;
            proxy_busy_buffers_size            32k;
        }
    }
}
