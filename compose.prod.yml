name: ${COMPOSE_PROJECT_NAME:-${NAME_PREFIX:-app}-prod}

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      # Error-tracking release (-X ldflags); SENTRY_RELEASE at runtime wins.
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}

x-frontend-image: &frontend-image
  image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
  build:
    context: .
    dockerfile: frontend/Dockerfile
    # Build one image at a time: the frontend waits for the backend image
    # (see the build-gate stage in frontend/Dockerfile). Running the Go and
    # Next.js builds together exhausts memory on the host.
    additional_contexts:
      build-gate: service:backend
    args:
      # Landing SEO/OG URLs are baked at build time; defaults to AUTH_URL.
      SITE_URL: ${SITE_URL:-${AUTH_URL:-}}
      # Browser error tracking is baked in at build (empty DSN = off).
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}
      NEXT_PUBLIC_SENTRY_RELEASE: ${NEXT_PUBLIC_SENTRY_RELEASE:-${SENTRY_RELEASE:-}}

x-backend-environment: &backend-environment
  APP_NAME: ${APP_NAME:-api}
  APP_ENV: production
  APP_HTTP_ADDR: :8080
  # Error tracking (technowide errortracking); empty DSN = off.
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  # Internal hosts are qualified as <service>.<app network>: a bare service
  # name can resolve to another stack's container on a shared Docker host.
  DB_HOST: postgres.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?DB_USER is required}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DB_NAME: ${DB_NAME:?DB_NAME is required}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  REDIS_ADDR: redis.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
  # SeaweedFS is private (app network only, no anonymous access): every object
  # reaches browsers through API stream endpoints, never a bucket URL.
  S3_ENDPOINT: http://seaweedfs.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_USE_PATH_STYLE: "true"
  CENTRIFUGO_API_URL: http://centrifugo.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:8000
  CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
  CENTRIFUGO_TOKEN_HMAC_SECRET: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET is required}
  CENTRIFUGO_WS_URL: ${CENTRIFUGO_WS_URL:?CENTRIFUGO_WS_URL is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  AUTH_ADAPTER_SECRET: ${AUTH_ADAPTER_SECRET:?AUTH_ADAPTER_SECRET is required}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  # Public origin for links the API generates (quote share /q/{token},
  # notification e-mail/WhatsApp links, step-up origin). Defaults to AUTH_URL.
  PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-${AUTH_URL:?AUTH_URL is required}}
  # Passkey relying-party ID; empty → hostname of PUBLIC_FRONTEND_URL.
  AUTH_WEBAUTHN_RP_ID: ${AUTH_WEBAUTHN_RP_ID:-}
  MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-App}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
  QUEUE_ENABLED: ${QUEUE_ENABLED:-true}
  QUEUE_WORKER_INPROCESS: "false"
  QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-10}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:noreply@example.com}
  EXPO_PUSH_URL: ${EXPO_PUSH_URL:-https://exp.host/--/api/v2/push/send}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  NOTIFY_EMAIL_LOGO_URL: ${NOTIFY_EMAIL_LOGO_URL:-}
  NOTIFY_EMAIL_COLOR: ${NOTIFY_EMAIL_COLOR:-#111827}
  SEARCH_ENABLED: ${SEARCH_ENABLED:-true}
  SEARCH_DRIVER: ${SEARCH_DRIVER:-meilisearch}
  MEILI_HOST: http://meilisearch.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
  MEILI_INDEX_PREFIX: ${MEILI_INDEX_PREFIX:-app}
  GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:3000}
  # PDF fonts: embedded (Noto subsets inlined) or system (Gotenberg image).
  PDF_FONTS: ${PDF_FONTS:-embedded}
  # WhatsApp gateway (design K16/K21): single wuzapi instance, private.
  WUZAPI_URL: http://wuzapi.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:8080
  WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:?WUZAPI_ADMIN_TOKEN is required}
  WUZAPI_WEBHOOK_SECRET: ${WUZAPI_WEBHOOK_SECRET:?WUZAPI_WEBHOOK_SECRET is required}
  # Registered on the wuzapi instance user; must match WUZAPI_GLOBAL_WEBHOOK.
  WUZAPI_WEBHOOK_URL: ${WUZAPI_WEBHOOK_URL:-http://backend.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:8080/hooks/wuzapi}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${NAME_PREFIX:-app}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      WUZAPI_DB_NAME: ${WUZAPI_DB_NAME:-wuzapi}
    volumes:
      - postgres_data:/var/lib/postgresql
      # First start only (empty volume): creates the wuzapi database.
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  redis:
    image: redis:8-alpine
    container_name: ${NAME_PREFIX:-app}-redis
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: ${NAME_PREFIX:-app}-seaweedfs
    restart: unless-stopped
    # Single-node SeaweedFS (master + volume + filer + S3 gateway). The bucket
    # is created on start. The admin identity from AWS_ACCESS_KEY_ID denies
    # anonymous S3 access; the JWT keys lock the filer / volume HTTP ports so
    # only the S3 gateway (same process) can read or write objects.
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -bucket=${S3_BUCKET:?S3_BUCKET is required}
      - -s3.port=8333
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      WEED_JWT_SIGNING_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?SEAWEEDFS_JWT_WRITE_KEY is required}
      WEED_JWT_FILER_SIGNING_KEY: ${SEAWEEDFS_JWT_WRITE_KEY:?SEAWEEDFS_JWT_WRITE_KEY is required}
      WEED_JWT_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?SEAWEEDFS_JWT_READ_KEY is required}
      WEED_JWT_FILER_SIGNING_READ_KEY: ${SEAWEEDFS_JWT_READ_KEY:?SEAWEEDFS_JWT_READ_KEY is required}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Private: never attach SeaweedFS to dokploy-network or publish its ports.
    networks:
      - app

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: ${NAME_PREFIX:-app}-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    volumes:
      - meili_data:/meili_data
    healthcheck:
      # Use 127.0.0.1 — BusyBox wget resolves localhost to ::1; Meili listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  centrifugo:
    image: centrifugo/centrifugo:v5
    container_name: ${NAME_PREFIX:-app}-centrifugo
    restart: unless-stopped
    command: centrifugo -c config.json
    environment:
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY:?CENTRIFUGO_API_KEY is required}
      CENTRIFUGO_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_HMAC_SECRET:?CENTRIFUGO_TOKEN_HMAC_SECRET is required}
      CENTRIFUGO_ALLOWED_ORIGINS: ${CENTRIFUGO_ALLOWED_ORIGINS:?CENTRIFUGO_ALLOWED_ORIGINS is required}
    volumes:
      - ./deploy/centrifugo/config.prod.json:/centrifugo/config.json:ro
    expose:
      - "8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "centrifugo", "healthcheck", "--address=http://localhost:8000"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app
      # Public: Traefik (Dokploy) routes wss.olexfilms.app → centrifugo:8000.
      - dokploy-network

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: ${NAME_PREFIX:-app}-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*$
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app

  # WhatsApp gateway (design K16): one instance, one number. Private: the
  # backend calls it on the app network and receives its webhooks there.
  # Image tag verified on Docker Hub / GitHub (asternic/wuzapi v1.0.9).
  wuzapi:
    image: asternic/wuzapi:1.0.9
    container_name: ${NAME_PREFIX:-app}-wuzapi
    restart: unless-stopped
    # The wuzapi database lives in the shared Postgres. A fresh volume gets it
    # from deploy/postgres/initdb; on an existing volume this creates it once.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export PGPASSWORD="$$DB_PASSWORD";
        psql -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname = '$$DB_NAME'" | grep -q 1
        || createdb -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" "$$DB_NAME";
        unset PGPASSWORD;
        exec /app/wuzapi --logtype=json --color=false
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:?WUZAPI_ADMIN_TOKEN is required}
      # Encrypts stored session secrets; never rotate (sessions are lost).
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_GLOBAL_ENCRYPTION_KEY:?WUZAPI_GLOBAL_ENCRYPTION_KEY is required}
      # Signs webhook bodies (HMAC); the backend verifies with the same secret.
      WUZAPI_GLOBAL_HMAC_KEY: ${WUZAPI_WEBHOOK_SECRET:?WUZAPI_WEBHOOK_SECRET is required}
      # Global webhook target: backend /hooks/wuzapi on the private network.
      WUZAPI_GLOBAL_WEBHOOK: ${WUZAPI_WEBHOOK_URL:-http://backend.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:8080/hooks/wuzapi}
      WEBHOOK_FORMAT: json
      DB_HOST: postgres.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${WUZAPI_DB_NAME:-wuzapi}
      DB_SSLMODE: "false"
      TZ: ${WUZAPI_TZ:-Europe/Istanbul}
      SESSION_DEVICE_NAME: ${WUZAPI_DEVICE_NAME:-Olexfilms}
    volumes:
      # Media files wuzapi downloads per session (/app/files/user_<id>).
      - wuzapi_data:/app/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

  migrate:
    <<: *backend-image
    container_name: ${NAME_PREFIX:-app}-migrate
    environment:
      DATABASE_URL: postgres://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:5432/${DB_NAME:?DB_NAME is required}?sslmode=${DB_SSLMODE:-disable}
      APP_ROLE: migrate
      AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - app

  # One-shot seed: make prod-create-super-admin (profile seed — not started by prod-up)
  create-super-admin:
    <<: *backend-image
    profiles: ["seed"]
    container_name: ${NAME_PREFIX:-app}-create-super-admin
    environment:
      <<: *backend-environment
      APP_ROLE: create-super-admin
      AUTO_MIGRATE: "false"
      SA_EMAIL: ${SA_EMAIL:-admin@example.com}
      SA_PASSWORD: ${SA_PASSWORD:-Password1}
      SA_NAME: ${SA_NAME:-Platform}
      SA_SURNAME: ${SA_SURNAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - app

  # Legacy import (design §7, K26/K27): profile "migrator", never started by
  # prod-up. Run: docker compose --env-file .env.server -f compose.prod.yml
  #   --profile migrator run --rm migrator
  # Legacy DSNs are read-only sources (AGENTS §4); empty until F2.
  migrator:
    <<: *backend-image
    profiles: ["migrator"]
    container_name: ${NAME_PREFIX:-app}-migrator
    environment:
      <<: *backend-environment
      APP_ROLE: migrator
      AUTO_MIGRATE: "false"
      MIGRATOR_PROFILE: ${MIGRATOR_PROFILE:-olex}
      MIGRATOR_HUB_DSN: ${MIGRATOR_HUB_DSN:-}
      MIGRATOR_WAREHOUSE_DSN: ${MIGRATOR_WAREHOUSE_DSN:-}
      MIGRATOR_GLORIAN_DSN: ${MIGRATOR_GLORIAN_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - app

  backend:
    <<: *backend-image
    container_name: ${NAME_PREFIX:-app}-backend
    environment:
      <<: *backend-environment
      APP_ROLE: server
      AUTO_MIGRATE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      gotenberg:
        condition: service_healthy
      wuzapi:
        condition: service_healthy
    expose:
      - "8080"
    # Liveness only: /readyz fails while Postgres or Redis blips, and an
    # unhealthy container is dropped by Traefik (whole site 404) even though
    # the API recovers on its own. Watch /readyz from monitoring instead.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Let in-flight requests (uploads, exports) finish on deploys.
    stop_grace_period: 30s
    restart: unless-stopped
    # App network only: the backend has no public domain (the frontend
    # proxies /api), and on the shared dokploy-network its "backend" alias
    # would answer other stacks' bare "backend" lookups.
    networks:
      - app

  # critical/default/low queues + the periodic-task scheduler. With more than
  # one SCHEDULER_ENABLED worker a Redis lease keeps a single scheduler leader.
  worker-core:
    <<: *backend-image
    container_name: ${NAME_PREFIX:-app}-worker-core
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      AUTO_MIGRATE: "false"
      WORKER_QUEUES: ${WORKER_QUEUES:-critical,default,low}
      SCHEDULER_ENABLED: "true"
    depends_on: &worker-depends
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      wuzapi:
        condition: service_healthy
    # The worker touches this file after each successful Redis ping (every
    # 15 s); stale for a minute means it lost the queue.
    healthcheck: &worker-healthcheck
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/worker.health -mmin -1 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Asynq waits up to 25 s for running jobs before re-queueing them.
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - app

  # docs queue: every PDF (Gotenberg) and export. Imports stay on worker-core.
  worker-docs:
    <<: *backend-image
    container_name: ${NAME_PREFIX:-app}-worker-docs
    environment:
      <<: *backend-environment
      APP_ROLE: worker
      AUTO_MIGRATE: "false"
      WORKER_QUEUES: ${WORKER_DOCS_QUEUES:-docs}
      # PDF rendering is I/O-bound on Gotenberg: more parallel tasks than core.
      QUEUE_CONCURRENCY: ${WORKER_DOCS_CONCURRENCY:-20}
      SCHEDULER_ENABLED: "false"
    depends_on:
      <<: *worker-depends
      gotenberg:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    stop_grace_period: 35s
    restart: unless-stopped
    networks:
      - app

  frontend:
    <<: *frontend-image
    container_name: ${NAME_PREFIX:-app}-frontend
    environment:
      # Qualify with APP_NETWORK: the bare name "backend" also resolves to other
      # stacks' backends on dokploy-network.
      API_URL: http://backend.${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}:8080/v1
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_ADAPTER_SECRET: ${AUTH_ADAPTER_SECRET:-}
      NEXT_PUBLIC_BFF_BASE_URL: ${NEXT_PUBLIC_BFF_BASE_URL:-/api}
      NEXT_PUBLIC_REALTIME_ENABLED: ${NEXT_PUBLIC_REALTIME_ENABLED:-true}
      NEXT_PUBLIC_CENTRIFUGO_URL: ${NEXT_PUBLIC_CENTRIFUGO_URL:-}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
      # Server/edge error tracking (browser DSN is a build arg above).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    # Starts last. Workers only need to have started: an unhealthy worker
    # must not take the whole site down.
    depends_on:
      backend:
        condition: service_healthy
      worker-core:
        condition: service_started
      worker-docs:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      # Real route is /health (not /api/v1/health). Unhealthy containers are
      # dropped by Traefik → domain returns "404 page not found".
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    # Public: Traefik (Dokploy) routes olexfilms.app → frontend:3000.
    networks:
      - app
      - dokploy-network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-${NAME_PREFIX:-app}-prod-postgres}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-${NAME_PREFIX:-app}-prod-redis}
  seaweedfs_data:
    name: ${SEAWEEDFS_VOLUME_NAME:-${NAME_PREFIX:-app}-prod-seaweedfs}
  meili_data:
    name: ${MEILI_VOLUME_NAME:-${NAME_PREFIX:-app}-prod-meilisearch}
  wuzapi_data:
    name: ${WUZAPI_VOLUME_NAME:-${NAME_PREFIX:-app}-prod-wuzapi}

networks:
  app:
    name: ${APP_NETWORK_NAME:-${NAME_PREFIX:-app}-app}
    driver: bridge
  dokploy-network:
    name: dokploy-network
    external: true
