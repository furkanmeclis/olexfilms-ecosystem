    AccountingDirection:
      type: string
      enum: [income, expense, charge, collection, payment]

    AccountingAmount:
      type: string
      pattern: '^-?[0-9]{1,16}\.[0-9]{2}$'
      description: Signed decimal (NUMERIC(18,2)) as a string; reversal rows are negative.
      example: "1500.00"

    AccountingAmountInput:
      type: string
      pattern: '^[0-9]{1,16}(\.[0-9]{1,2})?$'
      description: Positive decimal with at most two fraction digits.
      example: "1500.00"

    AccountingCategory:
      type: object
      required: [key, direction, label_key, label, manual]
      properties:
        key: { type: string, example: rent }
        direction: { $ref: "#/components/schemas/AccountingDirection" }
        label_key: { type: string, example: accounting.category.rent }
        label: { type: string, description: label_key in the request language, example: Rent }
        manual:
          type: boolean
          description: false for system categories written by the source API only (sale, purchase)

    FinanceAccount:
      type: object
      required: [uuid, type, name, currency, iban, active, balance, entry_count, last_entry_at, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        type: { type: string, enum: [cash, bank] }
        name: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        iban: { type: [string, "null"], example: TR330006100519786457841326 }
        active: { type: boolean }
        balance: { $ref: "#/components/schemas/AccountingAmount" }
        entry_count: { type: integer, format: int64 }
        last_entry_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    FinanceAccountCreateInput:
      type: object
      required: [type, name]
      additionalProperties: false
      properties:
        type: { type: string, enum: [cash, bank] }
        name: { type: string, maxLength: 200 }
        iban: { type: [string, "null"], description: Bank accounts only; spaces allowed }

    FinanceAccountUpdateInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
        iban: { type: [string, "null"], description: null clears it }
        active: { type: boolean }

    CariCounterparty:
      type: object
      required: [type, uuid, name]
      properties:
        type: { type: string, enum: [organization, user] }
        uuid: { type: [string, "null"], format: uuid }
        name: { type: string }
        org_type: { type: string, enum: [center, distributor, dealer] }

    CariAccount:
      type: object
      required: [uuid, counterparty, currency, active, balance, entry_count, last_entry_at, created_at]
      properties:
        uuid: { type: string, format: uuid }
        counterparty: { $ref: "#/components/schemas/CariCounterparty" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        active: { type: boolean }
        balance:
          $ref: "#/components/schemas/AccountingAmount"
        entry_count: { type: integer, format: int64 }
        last_entry_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    AccountingRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    FinanceEntry:
      type: object
      required:
        - uuid
        - direction
        - category
        - category_label_key
        - account
        - cari_uuid
        - counterparty_organization
        - orig_currency
        - orig_amount
        - currency
        - amount
        - rate
        - rate_date
        - source_type
        - source_uuid
        - revision
        - reversal_of_uuid
        - reversed_by_uuid
        - voided
        - description
        - created_at
      properties:
        uuid: { type: string, format: uuid }
        direction: { $ref: "#/components/schemas/AccountingDirection" }
        category: { type: string }
        category_label_key: { type: string, example: accounting.category.rent }
        account:
          oneOf:
            - $ref: "#/components/schemas/AccountingRef"
