    PriceAmount:
      type: string
      pattern: '^[0-9]{1,10}(\.[0-9]{1,4})?$'
      description: Non-negative decimal (NUMERIC(14,4)) as a string.
      example: "1250.50"

    EffectivePrice:
      type: object
      description: >-
        One currency of a product as the caller may see it. A field the caller
        may not see is absent. center: purchase_price (its own, source own,
        pricing.purchase.read), sale_price (to distributors,
        pricing.sale.read), recommended_sale_price (pricing.recommended.read).
        distributor: purchase_price (its distributor-specific price, else the
        center's sale price to distributors; source override or list) and
        sale_price (its own price to dealers). dealer: purchase_price only (its
        parent distributor's dealer price, source distributor).
      required: [currency]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3, example: TRY }
        purchase_price: { $ref: "#/components/schemas/PriceAmount" }
        purchase_price_source:
          type: string
          enum: [own, list, override, distributor]
        sale_price: { $ref: "#/components/schemas/PriceAmount" }
        recommended_sale_price: { $ref: "#/components/schemas/PriceAmount" }

