      tags: [Auth]
      operationId: patchAuthProfile
      summary: Update own profile
      description: >-
        Partial update of name/surname/locale/timezone. Email/password/status/roles
        are not changeable here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProfileRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: postAuthPasswordForgot
      summary: Request password reset
      description: Always returns accepted. If the email exists, enqueues a reset OTP email via Notification Center.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/password/reset:
    post:
      tags: [Auth]
      operationId: postAuthPasswordReset
      summary: Reset password with OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/password/change:
    post:
      tags: [Auth]
      operationId: postAuthPasswordChange
      summary: Change password
      description: Verifies current password, sets a new one, and revokes all refresh tokens (including the current session).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email/verify-request:
    post:
      tags: [Auth]
      operationId: postAuthEmailVerifyRequest
      summary: Request email verification OTP
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Optional; must equal the caller's own email (other values are ignored).
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/email/verify:
    post:
      tags: [Auth]
      operationId: postAuthEmailVerify
      summary: Verify email with OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/notifications:
    get:
      tags: [Notifications]
      operationId: getNotifications
      summary: List own inbox
      description: Requires `notifications.read`. Supports `limit`,`offset`,`q`,`sort`,`status`,`channel`,`unread`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
        - name: unread
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: Page of notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notifications/meta:
    get:
      tags: [Notifications]
      operationId: getNotificationsMeta
      summary: Notifications list metadata
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getNotificationsUnreadCount
      summary: Unread in-app count
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeUnreadCount"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: postNotificationsReadAll
      summary: Mark all in-app as read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notifications/test:
    post:
      tags: [Notifications]
      operationId: postNotificationsTest
      summary: Enqueue a test notification to self
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: boolean
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationItems"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/notifications/send:
    post:
      tags: [Notifications]
      operationId: postNotificationsSend
      summary: Send notification to a user (tenant admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNotificationRequest"
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationItems"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notifications/{uuid}:
    get:
      tags: [Notifications]
      operationId: getNotificationByUUID
      summary: Get own notification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notifications/{uuid}/action:
    get:
      tags: [Notifications]
      operationId: getNotificationAction
      summary: Redeem a signed notification action
      description: >
        Verifies `exp` + `sig`, marks the in-app notification read, and returns
        the stored destination. Requires `notifications.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - name: exp
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Action destination and updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notifications/{uuid}/read:
    post:
      tags: [Notifications]
      operationId: postNotificationRead
      summary: Mark notification read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Get own preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [Notifications]
      operationId: putNotificationPreferences
      summary: Update own preferences
      description: |
        Security emails (password reset / email verification) ignore `email_enabled`.
        Web push is its own channel (`webpush`): it needs `push_enabled` (or a rule)
        and an active browser subscription.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/platform/notifications:
    get:
      tags: [Platform]
      operationId: getPlatformNotifications
      summary: List platform notifications
      description: |
        Defaults to the caller's own notifications (`scope=me`).
        `platform.notifications.read_all` is required for `scope=all` or `user_uuid`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: "me (default) or all (requires read_all)"
          schema:
            type: string
            enum: [me, all]
        - name: user_uuid
          in: query
          description: "Filter to one user (requires read_all)"
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/notifications/meta:
    get:
      tags: [Platform]
      operationId: getPlatformNotificationsMeta
      summary: Platform notifications meta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notification-events:
    get:
      tags: [Notifications]
      operationId: getNotificationEvents
      summary: Notification event catalog
      description: |
        Every event the notification center sends: default channels, audience
        roles, allowed template placeholders and whether users can mute it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationEventList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/notifications/push-devices:
    post:
      tags: [Notifications]
      operationId: registerPushDevice
      summary: Register an Expo push token
      description: |
        Stores the caller's Expo push token (`device_push_tokens`). A token
        moves to the latest user that registers it and is un-revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePushDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    delete:
      tags: [Notifications]
      operationId: revokePushDevice
      summary: Revoke an Expo push token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expo_token]
              properties:
                expo_token: { type: string }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/platform/notification-templates:
    get:
      tags: [Platform]
      operationId: getNotificationTemplates
      summary: List notification templates
      description: Requires `notifications.templates.manage`.
      security:
        - bearerAuth: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/NotificationChannel" } }
        - { name: language, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: "#/components/schemas/NotificationTemplateRole" } }
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationTemplateList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Platform]
      operationId: putNotificationTemplate
      summary: Create or update a notification template
      description: |
        One template per event x role x channel x language. Placeholders the
        event does not allow are rejected (400 VALIDATION_ERROR). Requires
        `notifications.templates.manage`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTemplateInput"
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationTemplate"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/platform/notification-templates/preview:
    post:
      tags: [Platform]
      operationId: previewNotificationTemplate
      summary: Preview a notification template
      description: Renders a draft with the event's sample values; e-mail adds the HTML frame (dir from the language).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationTemplateInput"
      responses:
        "200":
          description: Rendered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationRendered"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/platform/notification-channels:
    get:
      tags: [Platform]
      operationId: getNotificationChannels
      summary: Notification channel switches
      description: SMS is off until an admin switches it on (K21). Requires `notifications.templates.manage`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationChannelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/notification-channels/{channel}:
    put:
      tags: [Platform]
      operationId: putNotificationChannel
      summary: Switch a notification channel on or off
      description: A disabled channel records deliveries as `skipped_disabled`.
      security:
        - bearerAuth: []
      parameters:
        - name: channel
          in: path
          required: true
          schema: { $ref: "#/components/schemas/NotificationChannel" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationChannelSetting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/notification-deliveries:
    get:
      tags: [Platform]
      operationId: getNotificationDeliveries
      summary: Notification delivery log
      description: |
        One row per event x user x channel (the idempotency key), newest
        first. Rows are swept after 90 days. Requires `notification_deliveries.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/NotificationDeliveryStatus" } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/NotificationChannel" } }
        - { name: event_code, in: query, schema: { type: string } }
        - { name: event_id, in: query, schema: { type: string, format: uuid } }
        - { name: user_uuid, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationDeliveryPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/app/config:
    get:
      tags: [Health]
      operationId: getAppConfig
      summary: Public app config
      description: Unauthenticated bootstrap payload (auth methods, branding).
      security: []
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listAuthSessions
      summary: List active sessions
      description: Refresh-token sessions for the current user. `current` is the session bound to this access token.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeSessionList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/auth/sessions/revoke-others:
    post:
      tags: [Auth]
      operationId: revokeOtherAuthSessions
      summary: Revoke other sessions
      description: Signs out every session except the current one.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Remaining current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions/{uuid}:
    delete:
      tags: [Auth]
      operationId: revokeAuthSession
      summary: Revoke a session
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/tenant/organizations:
    get:
      tags: [Tenant]
      operationId: listTenantOrganizations
      summary: Organizations inside the caller's organizations.read scope
      description: >-
        managed: the active organization; subtree: a distributor and its
        dealers; brand: every organization of the brand. Never leaves the
        request brand.
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationType"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Organizations in scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeScopedOrganizationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/tenant/organizations/{uuid}:
    get:
      tags: [Tenant]
      operationId: getTenantOrganization
      summary: One organization inside the caller's scope (404 outside it)
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrganization"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/tenant/settings:
    get:
      tags: [Tenant]
      operationId: getTenantSettings
      summary: Get organization export letterhead
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Letterhead settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTenantSettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Tenant]
      operationId: patchTenantSettings
      summary: Update organization export letterhead
      security:
        - bearerAuth: []
      requestBody:
        required: true
