      tags: [Notifications]
      operationId: registerPushDevice
      summary: Register an Expo push token
      description: |
        Stores the caller's Expo push token (`device_push_tokens`). A token
        moves to the latest user that registers it and is un-revoked.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceInput"
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePushDevice"
