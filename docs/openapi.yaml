  /v1/auth/otp/request:
    post:
      tags: [Auth, WhatsApp]
      operationId: postAuthOtpRequest
      summary: Request a phone login code (WhatsApp, SMS fallback)
      description: |
        Sends a 6-digit code to the phone over WhatsApp (SMS when the admin
        enabled the fallback and WhatsApp failed). The message carries the
        KVKK notice of the request locale (`locale` or Accept-Language; tr/en).
        The answer is the same whether or not an account exists for the number.
        Limits: code valid 5 minutes, a new code after 60 seconds, 5 codes per
        phone per hour (database counters) and Redis counters per phone and IP.
        Without Redis the endpoint fails closed (503 RATE_LIMITER_UNAVAILABLE).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPRequest"
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOTPRequestResult"
        "400":
          description: INVALID_PHONE or VALIDATION_ERROR (unsupported purpose)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            RATE_LIMITED. `error.details[0]` is `{field: resend_at, message: <RFC3339>, code: cooldown|hourly_limit|ip_limit}`;
            `Retry-After` is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: OTP_DELIVERY_FAILED or RATE_LIMITER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/otp/verify:
    post:
      tags: [Auth, WhatsApp]
      operationId: postAuthOtpVerify
      summary: Verify a phone login code and sign in (portal)
      description: |
        Verifies the latest code of the phone and returns the same token pair as
        `POST /v1/auth/login`. The access JWT has `aud: ["portal"]` and the
        refresh session keeps realm `portal` across refreshes. An unknown phone
        becomes a new customer account (role `customer`, no e-mail); an
        existing unverified account with the phone is claimed (K11, K26).
        Five wrong codes kill the code (429 OTP_LOCKED).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTPVerifyRequest"
      responses:
        "200":
          description: Authenticated (portal realm)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: INVALID_OTP_CODE (wrong, expired or used code)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Account disabled (generic message)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: OTP_LOCKED (too many wrong codes) or RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: RATE_LIMITER_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

