        - bearerAuth: []
      responses:
        "200":
          description: Channels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationChannelList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

