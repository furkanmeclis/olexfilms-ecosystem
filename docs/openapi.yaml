        resource: { type: string }
        format: { type: string, enum: [json, xlsx, csv, tsv] }
        status: { type: string }
        mapping:
          type: object
          additionalProperties: { type: string }
        defaults:
          type: object
          additionalProperties: { type: string }
        preview_summary: { $ref: "#/components/schemas/ImportPreviewSummary" }
        error: { type: [string, "null"] }
        rollback_until: { type: [string, "null"], format: date-time }
        applied_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ImportPreviewSummary:
      type: object
      description: >-
        Dry run (preview) or apply/undo report of an import job. Staged
        importers (stock import, TEC-158) also set batch_uuid, counts per row
        status, the row status/target and stable error codes.
      properties:
        total: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        batch_uuid: { type: string, format: uuid }
        counts:
          type: object
          description: >-
            Rows per status: new, duplicate, invalid, conflict, applied,
            undone, undo_rejected.
          additionalProperties: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [index]
            properties:
              index: { type: integer, description: 1-based data row number }
              data:
                type: object
                additionalProperties: true
              status:
                type: string
                enum: [new, duplicate, invalid, conflict, applied, undone, undo_rejected]
              status_label: { type: string, description: Localized status (job locale) }
              target:
                type: object
                description: >-
                  Where the row is written: organization_uuid,
                  organization_name, owner_type (organization or
                  warehouse_location), location_uuid, location_code,
                  product_uuid, product_sku, product_name, unit_kind (serial
                  or fixed), unit_type.
                additionalProperties: true
        errors:
          type: array
          items:
            type: object
            required: [index, error]
            properties:
              index: { type: integer }
              field: { type: string }
              code:
                type: string
                description: >-
                  Stable code, e.g. STOCK_IMPORT_PRODUCT_NOT_FOUND,
                  STOCK_IMPORT_DUPLICATE_IN_FILE, STOCK_IMPORT_HELD_BY_OTHER_ORG,
                  STOCK_IMPORT_UNDO_UNIT_TOUCHED.
              error: { type: string, description: Localized message (job locale) }

    EnvelopeImportJob:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ImportJob" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeImportJobPage:
      type: object
