        cari_uuid: { type: [string, "null"], format: uuid }
        counterparty_organization:
          oneOf:
            - $ref: "#/components/schemas/AccountingRef"
            - type: "null"
        orig_currency: { type: string, minLength: 3, maxLength: 3 }
        orig_amount: { $ref: "#/components/schemas/AccountingAmount" }
        currency: { type: string, minLength: 3, maxLength: 3, description: The organization's ledger currency (K7) }
        amount: { $ref: "#/components/schemas/AccountingAmount" }
        rate: { type: string, description: "Frozen rate orig_currency→currency (NUMERIC(18,8))", example: "1.00000000" }
        rate_date: { type: string, format: date }
        source_type: { type: [string, "null"], example: manual }
        source_uuid: { type: [string, "null"], format: uuid }
        revision: { type: integer }
        reversal_of_uuid: { type: [string, "null"], format: uuid }
        reversed_by_uuid: { type: [string, "null"], format: uuid }
        voided: { type: boolean, description: The row has been reversed }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

