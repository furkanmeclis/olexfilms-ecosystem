        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ModuleError"
        "422":
          $ref: "#/components/responses/ModuleError"
    delete:
      tags: [Features]
      operationId: clearDealerStandard
      summary: Drop a standard value (dealers follow the module default)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ModuleKey"
      responses:
