    Country:
      type: object
      required: [id, iso2, iso3, name_en, name_tr, is_active, has_provinces]
      properties:
        id: { type: integer, format: int64 }
        iso2: { type: string, example: NL }
        iso3: { type: string, example: NLD }
        name_en: { type: string }
        name_tr: { type: string }
        phone_code: { type: string, example: "+31" }
        default_currency: { type: string, example: EUR }
        default_locale: { type: string }
        timezone: { type: string }
        is_active: { type: boolean }
        has_provinces: { type: boolean }

    Province:
      type: object
      required: [id, country_id, code, name, has_districts]
      properties:
        id: { type: integer, format: int64 }
        country_id: { type: integer, format: int64 }
        code:
          type: string
          description: TR plate code (01..81) or the ISO 3166-2 code (NL-NH)
        name: { type: string }
        has_districts: { type: boolean }

    District:
      type: object
      required: [id, province_id, name]
      properties:
        id: { type: integer, format: int64 }
        province_id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }

    GeoNodeRequest:
      type: object
      required: [name]
      properties:
        code:
          type: string
          maxLength: 16
          description: Required for provinces
        name: { type: string, maxLength: 120 }

    TerritoryLevel:
      type: string
      enum: [country, province, district]

    Territory:
      type: object
      required: [uuid, level, organization_uuid, organization_name, country_id, country_iso2, country_name_en, country_name_tr, created_at]
      properties:
        uuid: { type: string, format: uuid }
        level: { $ref: "#/components/schemas/TerritoryLevel" }
        organization_uuid:
          type: string
          format: uuid
          description: The distributor
        organization_name: { type: string }
        country_id: { type: integer, format: int64 }
        country_iso2: { type: string }
        country_name_en: { type: string }
        country_name_tr: { type: string }
        province_id: { type: integer, format: int64 }
        province_name: { type: string }
        district_id: { type: integer, format: int64 }
        district_name: { type: string }
        created_at: { type: string, format: date-time }

    AssignTerritoryRequest:
      type: object
      required: [distributor_uuid, country_id]
      properties:
        distributor_uuid: { type: string, format: uuid }
        country_id: { type: integer, format: int64 }
        province_id: { type: [integer, "null"], format: int64 }
        district_id:
          type: [integer, "null"]
          format: int64
          description: Needs province_id; must be inside it.

    TerritoryMatch:
      type: object
      required: [territory_uuid, level, organization_uuid, organization_name]
      properties:
        territory_uuid: { type: string, format: uuid }
        level: { $ref: "#/components/schemas/TerritoryLevel" }
        organization_uuid: { type: string, format: uuid }
        organization_name: { type: string }

    PlateFormat:
      type: object
      required: [country_iso2, country_name_en, country_name_tr, regex, input_mask, example, country_label, strip_color, background_color, text_color, is_active, sort_order]
      properties:
        country_iso2: { type: string, example: DE }
        country_name_en: { type: string }
        country_name_tr: { type: string }
        regex:
          type: string
          description: RE2 regex on the compact plate (upper case, no separators)
        input_mask: { type: string, example: "AAA AA 9999" }
        example: { type: string, example: "B AB 1234" }
        country_label: { type: string, example: D }
        strip_color: { type: string, example: "#003399" }
        background_color: { type: string, example: "#FFFFFF" }
        text_color: { type: string, example: "#000000" }
        is_active: { type: boolean }
        sort_order: { type: integer }

    PlateFormatRequest:
      type: object
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2 (create only)
        regex: { type: string }
        input_mask: { type: string }
        example: { type: string }
        country_label: { type: string, maxLength: 4 }
        strip_color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        background_color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        text_color: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        is_active: { type: boolean }
        sort_order: { type: integer }

    PlateCheck:
      type: object
      required: [country, normalized, valid]
      properties:
        country: { type: string }
        normalized: { type: string, example: BAB1234 }
        valid: { type: boolean }

    Currency:
      type: object
      required: [code, name, symbol, decimals]
      properties:
        code: { type: string, example: EUR }
        name: { type: string }
        symbol: { type: string }
        decimals: { type: integer }

    RateSource:
      type: string
      description: manual > tcmb > ecb; cross rates join two sources with "+"; identity for base = quote
      example: tcmb

    StoredExchangeRate:
      type: object
      required: [rate_date, base, quote, rate, source, effective, fetched_at]
      properties:
        rate_date: { type: string, format: date }
        base: { type: string }
        quote: { type: string }
        rate:
          type: string
          description: Decimal string, 1 base = rate quote (10 fraction digits max)
        source: { $ref: "#/components/schemas/RateSource" }
        note: { type: string }
        effective:
          type: boolean
          description: The row the resolver picks for this pair on this day
        fetched_at: { type: string, format: date-time }

    RateSnapshot:
      type: object
      description: The frozen rate of an order / journal entry (rate_snapshot, K7).
      required: [base, quote, rate, rate_date, source]
      properties:
        base: { type: string }
        quote: { type: string }
        rate: { type: string, example: "48.7988" }
        rate_date: { type: string, format: date }
        source: { $ref: "#/components/schemas/RateSource" }
        via:
          type: string
          description: Pivot currency of a cross rate (TRY or EUR)

    ExchangeRateOverrideRequest:
      type: object
      required: [date, base, quote, rate]
      properties:
        date: { type: string, format: date }
        base: { type: string, example: EUR }
        quote: { type: string, example: TRY }
        rate: { type: string, example: "48.75" }
        note: { type: string }

    FetchSourceReport:
      type: object
      required: [source, count]
      properties:
        source: { type: string, enum: [tcmb, ecb] }
        date: { type: string, format: date }
        count: { type: integer }
        error: { type: string }

    CatalogUnitType:
      type: string
      enum: [piece, roll_meter]
      description: piece (adet) or roll_meter (metraj/rulo)

    CatalogCategory:
      type: object
      required: [uuid, name, available_parts, sort, active, created_at, updated_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        available_parts:
          type: array
          description: Vehicle parts a service may pick for products of the category
          items: { type: string, maxLength: 100 }
        sort: { type: integer, format: int32 }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CatalogCategoryInput:
      type: object
      additionalProperties: false
      description: POST needs name; PATCH changes only the fields it names.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        available_parts:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 100 }
        sort: { type: integer, format: int32 }
        active: { type: boolean }

    CatalogProductImage:
      type: object
      required: [key, sort]
      properties:
        key:
          type: string
          maxLength: 512
          description: >-
            Image key. Uploaded images (32 hex + .jpg/.png/.webp) are served
            at `/product-images/{key}`.
        sort: { type: integer }

    CatalogProduct:
      type: object
      required:
        - uuid
        - category
        - sku
        - name
        - description_md
        - warranty_duration_months
        - micron_thickness
        - images
        - unit_type
        - uses_fixed_barcode
        - active
        - external_id
        - locked_fields
        - created_at
        - updated_at
      properties:
        uuid: { type: string, format: uuid }
        category:
          type: object
          required: [uuid, name]
          properties:
            uuid: { type: string, format: uuid }
            name: { type: string }
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 200 }
        description_md: { type: string, description: Markdown }
        warranty_duration_months: { type: [integer, "null"], format: int32 }
        micron_thickness: { type: [number, "null"] }
        images:
          type: array
          items: { $ref: "#/components/schemas/CatalogProductImage" }
        unit_type: { $ref: "#/components/schemas/CatalogUnitType" }
        uses_fixed_barcode: { type: boolean }
        active: { type: boolean }
        external_id:
          type: [string, "null"]
          description: Reserved for the F2 Glorian catalog sync (read-only)
        locked_fields:
          type: array
          description: Fields locked by the F2 Glorian sync (read-only)
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CatalogProductImageOrder:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          maxItems: 10
          description: Every current image key, in the new order
          items: { type: string }

    CatalogProductInput:
      type: object
      additionalProperties: false
      description: >-
        POST needs category_uuid, sku and name (unit_type defaults to piece,
        active to true). PATCH changes only the fields it names.
      properties:
        category_uuid: { type: string, format: uuid }
        sku: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        description_md: { type: string, maxLength: 20000 }
        warranty_duration_months: { type: [integer, "null"], minimum: 0, maximum: 600 }
        micron_thickness: { type: [number, "null"], exclusiveMinimum: 0, maximum: 999999.99 }
        images:
          type: array
          maxItems: 10
          description: >-
            Keys issued by the image upload route can only be kept or dropped
            here, not added; prefer the `/images` routes for uploads, removal
            and order.
          items: { $ref: "#/components/schemas/CatalogProductImage" }
        unit_type: { $ref: "#/components/schemas/CatalogUnitType" }
        uses_fixed_barcode: { type: boolean }
        active: { type: boolean }

    EnvelopeCatalogCategory:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CatalogCategory" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCatalogCategoryPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CatalogCategory" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCatalogProduct:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CatalogProduct" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCatalogProductPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CatalogProduct" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    StockOwnerType:
      type: string
      enum: [warehouse_location, organization, service, trash]

    StockUnitStatus:
      type: string
      enum: [reserved, printed, available, placed, in_transit, used, void]

    StockOrgRef:
      type: object
      required: [uuid, name, type]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [center, distributor, dealer] }

    StockLocationRef:
      type: object
      required: [uuid, code, name]
      properties:
        uuid: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }

    StockOwner:
      type: object
      description: Masked owners belong to an organization the viewer may not name.
      required: [type, organization, location, masked]
      properties:
        type: { $ref: "#/components/schemas/StockOwnerType" }
        organization:
          oneOf:
            - $ref: "#/components/schemas/StockOrgRef"
            - type: "null"
        location:
          oneOf:
            - $ref: "#/components/schemas/StockLocationRef"
            - type: "null"
        masked: { type: boolean }

    StockUnit:
      type: object
      required: [uuid, barcode, unit_kind, source, status, initial_meters, remaining_meters, product, created_at]
      properties:
        uuid: { type: string, format: uuid }
        barcode: { type: string }
        unit_kind: { type: string, enum: [serial, fixed] }
        source: { type: string, enum: [generated, imported, external] }
        status: { $ref: "#/components/schemas/StockUnitStatus" }
        initial_meters: { type: [string, "null"], description: "Roll length (decimal string, 2 places)" }
        remaining_meters: { type: [string, "null"] }
        product:
          type: object
          required: [uuid, sku, name, unit_type, uses_fixed_barcode]
          properties:
            uuid: { type: string, format: uuid }
            sku: { type: string }
            name: { type: string }
            unit_type: { $ref: "#/components/schemas/CatalogUnitType" }
            uses_fixed_barcode: { type: boolean }
        created_at: { type: string, format: date-time }

    StockCurrentState:
      type: object
      required: [owner, holder, status, updated_at]
      properties:
        owner: { $ref: "#/components/schemas/StockOwner" }
        holder: { $ref: "#/components/schemas/StockOrgRef" }
        status: { $ref: "#/components/schemas/StockUnitStatus" }
        updated_at: { type: string, format: date-time }

    StockHolding:
      type: object
      required: [owner, holder, quantity]
      properties:
        owner: { $ref: "#/components/schemas/StockOwner" }
        holder: { $ref: "#/components/schemas/StockOrgRef" }
        quantity: { type: integer }

    StockMovement:
      type: object
      required: [uuid, type, quantity_delta, meters_delta, from_status, to_status, from_owner, to_owner,
        organization, organization_masked, reference_type, reason, created_at]
      properties:
        uuid: { type: string, format: uuid }
        type:
          type: string
          enum: [entry, placement, transfer_out, transfer_in, transfer_cancel_restore, order_out,
            order_cancel_restore, received, consumption, partial_consumption, return,
            reclassification, count_adjustment, void, external_outbound]
        quantity_delta: { type: integer }
        meters_delta: { type: string, description: "Decimal string, 2 places" }
        from_status:
          oneOf:
            - $ref: "#/components/schemas/StockUnitStatus"
            - type: "null"
        to_status:
          oneOf:
            - $ref: "#/components/schemas/StockUnitStatus"
            - type: "null"
        from_owner:
          oneOf:
            - $ref: "#/components/schemas/StockOwner"
            - type: "null"
        to_owner:
          oneOf:
            - $ref: "#/components/schemas/StockOwner"
            - type: "null"
        organization:
          description: Holding organization of the row; null when masked.
          oneOf:
            - $ref: "#/components/schemas/StockOrgRef"
            - type: "null"
        organization_masked: { type: boolean }
        reference_type: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    StockUnitHistory:
      type: object
      required: [unit, current, holdings, movements]
      properties:
        unit: { $ref: "#/components/schemas/StockUnit" }
        current:
          description: Single active owner of a serial unit; null for fixed barcodes and labels not in stock yet.
          oneOf:
            - $ref: "#/components/schemas/StockCurrentState"
            - type: "null"
        holdings:
          type: array
          items: { $ref: "#/components/schemas/StockHolding" }
        movements:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/StockMovement" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }

    StockProduct:
      type: object
      required: [product, quantity, meters, fixed_barcodes, updated_at]
      properties:
        product:
          type: object
          required: [uuid, sku, name, unit_type, uses_fixed_barcode, active, category]
          properties:
            uuid: { type: string, format: uuid }
            sku: { type: string }
            name: { type: string }
