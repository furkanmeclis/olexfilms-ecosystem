        Appends the mirror row (reversal_of_uuid, negated amounts); the
        ledger is append-only. Only open manual entries of the active
        organization (409 ENTRY_NOT_VOIDABLE otherwise). Needs a recent
        step-up (403 STEP_UP_REQUIRED).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceEntryVoidInput"
      responses:
        "201":
          description: Reversal row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/accounting/collections:
    post:
      tags: [Accounting]
      operationId: createAccountingCollection
      summary: Collection from a counterparty into a cash/bank account
      description: >-
        Lowers the cari receivable and raises the account; never writes
        income (TEC-99 decision 2). A repeated idempotency_key answers 200.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceSettlementInput"
      responses:
        "200":
          description: Replayed (same idempotency_key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/accounting/payments:
    post:
      tags: [Accounting]
      operationId: createAccountingPayment
      summary: Payment to a counterparty from a cash/bank account
      description: >-
        Lowers the cari debt and the account; never writes an expense. A
        repeated idempotency_key answers 200.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinanceSettlementInput"
      responses:
        "200":
          description: Replayed (same idempotency_key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "201":
          description: Created payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFinanceEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/accounting/disputes:
    get:
      tags: [Accounting]
      operationId: listAccountingDisputes
      summary: Cari disputes inside the accounting.read scope, newest first
      description: >-
        A dispute is visible to the disputing organization and to the parent
        it addresses (K24); brand and all scopes see every dispute of the
        domain brand. A distributor sees the disputes of its dealers, another
        distributor does not.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/AccountingDisputeStatus" }
        - name: organization_uuid
          in: query
          description: Only disputes opened by this organization
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Disputes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingDisputePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Accounting]
      operationId: openAccountingDispute
      summary: Dispute an entry the parent posted to the active organization (K24)
      description: >-
        Needs accounting.dispute. The entry must be an open (unreversed)
        sourced row on the active organization's cari with its parent
        (409 ENTRY_NOT_DISPUTABLE otherwise); one open dispute per entry
        (409 DISPUTE_ALREADY_OPEN). Writes accounting.dispute_opened.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingDisputeInput"
      responses:
        "201":
          description: Dispute opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingDispute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/accounting/disputes/{uuid}:
    get:
      tags: [Accounting]
      operationId: getAccountingDispute
      summary: One dispute inside the accounting.read scope
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingDispute"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/disputes/{uuid}/resolve:
    post:
      tags: [Accounting]
      operationId: resolveAccountingDispute
      summary: Resolve a dispute addressed to the active organization
      description: >-
        Needs accounting.resolve; only the parent the disputed entry came
        from resolves (other disputes read as 404). reversal reverses every
        open row of the source on both ledgers; revision reverses them and
        reposts corrected_amount (in the entry's orig_currency, at the
        frozen rate) as revision + 1 in the same transaction; reject needs a
        note and posts nothing. A final dispute answers 409 DISPUTE_NOT_OPEN.
        Writes accounting.dispute_resolved or accounting.dispute_rejected.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingDisputeResolveInput"
      responses:
        "200":
          description: Resolved dispute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingDispute"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/accounting/cari/{uuid}/statement:
    get:
      tags: [Accounting]
      operationId: getAccountingCariStatement
      summary: Cari statement (ekstre) of a period with opening, running and closing balance
      description: >-
        Rows before `from` make up the opening balance; each period row shows
        debit (raises what the counterparty owes the book owner) or credit and
        the running balance. A reversal row is shown in the opposite column.
        `from`/`to` are calendar days (UTC, inclusive). Read scope as in
        TEC-172: the active organization's book or one below it; a dealer
        reads its own cari only. Labels follow the user language (K10) or
        `locale`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - $ref: "#/components/parameters/AccountingOrganizationUUID"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: locale
          in: query
          description: Label language override (one of the 13 app languages)
          schema: { type: string, example: tr }
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCariStatement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/cari/{uuid}/statement/export:
    post:
      tags: [Accounting]
      operationId: exportAccountingCariStatement
      summary: Queue a statement export job (PDF, XLSX or CSV)
      description: >-
        The job runs on worker-docs (exports queue). PDF is rendered by
        Gotenberg on the organization letterhead, in the user language
        (RTL for ar); XLSX/CSV headers are in the same language. Poll and
        download through /v1/accounting/exports/{uuid}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingExportInput"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/reports/balances:
    get:
      tags: [Accounting]
      operationId: getAccountingBalanceReport
      summary: Every cari and cash/bank balance of a book as of a day
      description: >-
        `as_of` is a calendar day (UTC, end of day inclusive); without it the
        report covers every row. Receivable sums the positive cari balances,
        payable the negative ones.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountingOrganizationUUID"
        - name: as_of
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Balance report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAccountingBalanceReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/reports/balances/export:
    post:
      tags: [Accounting]
      operationId: exportAccountingBalanceReport
      summary: Queue a balance report export job (PDF, XLSX or CSV)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountingExportInput"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/exports/{uuid}:
    get:
      tags: [Accounting]
      operationId: getAccountingExport
      summary: An accounting export job of the active organization
      description: download_url points at /v1/accounting/exports/{uuid}/download once completed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Export job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounting/exports/{uuid}/download:
    get:
      tags: [Accounting]
      operationId: downloadAccountingExport
      summary: Download a completed accounting export file
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: File bytes (application/pdf, xlsx or text/csv)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services:
    get:
      tags: [Services]
      operationId: listServices
      summary: Services inside the services.read scope
      description: >-
        Dealer: its own organization (own scope: services it created),
        distributor: its subtree, center: the domain brand (K20). q matches
        the service number, plate, VIN and the customer's name or phone.
        List rows carry no items, images or status logs.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ServiceStatus" }
        - name: customer_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: vehicle_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: created_from
          in: query
          description: >-
            Inclusive lower bound of created_at (TEC-183): RFC3339, or a
            YYYY-MM-DD day in UTC.
          schema: { type: string }
        - name: created_to
          in: query
          description: >-
            Exclusive upper bound of created_at: RFC3339, or a YYYY-MM-DD day
            in UTC that covers the whole day. Must be after created_from.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeServicePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Services]
      operationId: createService
      summary: Open a draft service of the active organization
      description: >-
        Needs services.write. The customer must be linked to an organization
        of the services.write scope and the vehicle must belong to the
        customer (domain brand) and carry a car brand and model; plate, VIN,
        car brand/model and year are copied into the service (TEC-97
        decision 3). The brand is the organization's brand (decision 2) and
        the number is DS + 8 alphanumerics. has_measurement needs the
        vehicle VIN. A read-only organization (K23: no contract yet) gets
        403 ORGANIZATION_READ_ONLY on every write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceCreateInput"
      responses:
        "201":
          description: Draft service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/services/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Services]
      operationId: getService
      summary: One service with its items, images and status logs
      description: Services outside the services.read scope answer 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Services]
      operationId: updateService
      summary: Edit km, package, notes and the measurement answer
      description: >-
        Needs services.write reaching the service. Completed and cancelled
        services are locked except for the center (409 SERVICE_NOT_EDITABLE).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdateInput"
      responses:
        "200":
          description: Updated service
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/services/{uuid}/items:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Services]
      operationId: addServiceItem
      summary: Add a stock unit to a service (by barcode)
      description: >-
        Only while the service is draft, pending or processing (409
        SERVICE_NOT_EDITABLE). The unit must be held by the service
        organization (serial: available or placed; fixed barcode: enough
        pieces on hand), else 409 SERVICE_UNIT_NOT_AVAILABLE. A serial unit
        already in an open service (this one included) is 409
        SERVICE_UNIT_IN_USE; a roll may be cut (partial, meters) for several
        services but a whole roll excludes other uses. applied_parts must be
        in the product category's available_parts.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceItemInput"
      responses:
        "201":
          description: Service with the new item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/services/{uuid}/items/{item}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
      - name: item
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Services]
      operationId: removeServiceItem
      summary: Remove an item (draft, pending or processing only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service without the item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/services/{uuid}/stock-units:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Services]
      operationId: listServiceStockUnits
      summary: Stock picker of the service organization
      description: >-
        Units the service organization can add as items (TEC-180): serial
        units it holds (available or placed) that no open service has taken
        (a roll that is only cut stays listed) and fixed barcodes with
        pieces on hand. barcode is an exact barcode (scanner lookup),
        product_uuid narrows to one product, min_meters lists only rolls
        with at least that many meters left, q matches a part of the
        product name, SKU or barcode (TEC-182 product search). Each
        product carries its category's available_parts, the parts a new
        item may apply. Needs services.write on the service; a service
        outside the read scope is 404.
      security:
        - bearerAuth: []
      parameters:
        - name: barcode
          in: query
          schema: { type: string, maxLength: 64 }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: product_uuid
          in: query
          schema: { type: string, format: uuid }
        - name: min_meters
          in: query
          schema: { type: string, pattern: "^[0-9]{1,8}(\\.[0-9]{1,2})?$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Units of the service organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeServiceStockUnitList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/services/{uuid}/transitions:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Services]
      operationId: transitionService
      summary: Move a service to another status
      description: >-
        Legacy state machine (TEC-179): draft -> pending -> processing ->
        ready (services.write); center shortcuts draft -> processing and
        pending -> ready; draft | pending | processing | ready -> cancelled
        (services.cancel, center only; a dealer gets 403). draft |
        processing | ready -> completed (services.complete, TEC-180)
        consumes the stock of every item in the same transaction
        (consumption for a whole unit, partial_consumption for a cut;
        idempotency key service:service_item:<id>), links each item to its
        stock movement and writes one service.completed outbox event. A
        service without items answers 400; a unit that is no longer held or
        a cut longer than the rest of the roll answers 409
        SERVICE_UNIT_NOT_AVAILABLE and nothing is written. Completed and
        cancelled are final (409 SERVICE_INVALID_TRANSITION). A request for
        the current status is a no-op (completing a completed service
        consumes nothing and emits nothing). Every move writes a status log
        and a service.* outbox event.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceTransitionInput"
      responses:
        "200":
          description: Service after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeService"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/services/{uuid}/images:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Services]
      operationId: uploadServiceImage
      summary: Upload a service image
      description: >-
        Needs services.write reaching the service and an editable form. The
        type is detected from the content: JPEG, PNG or WebP only (400),
        at most 5 MiB (413) and 30 images per service (422
        SERVICE_TOO_MANY_IMAGES).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
                title: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Image added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeServiceImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/services/{uuid}/images/{image}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
      - name: image
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Services]
      operationId: downloadServiceImage
      summary: Download a service image (services.read scope)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Services]
      operationId: deleteServiceImage
      summary: Delete a service image
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Image deleted
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: Orders inside the orders.read scope (sales and purchases)
      description: >-
        Every order where an organization of the orders.read scope is the
        seller or the buyer (managed: the active organization's own sales and
        purchases; a dealer never sees its distributor's other dealers).
        side=seller|buyer limits the list to the active organization's sales
        or purchases. List rows carry no items or history.
      security:
        - bearerAuth: []
      parameters:
        - name: side
          in: query
          schema: { type: string, enum: [seller, buyer] }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Open a draft order of the active organization to its parent (K6)
      description: >-
        The active organization is the buyer and its parent the seller:
        distributor -> center or dealer -> distributor (anything else is 422
        ORDER_NO_SUPPLIER). The currency is the brand currency. Unit prices
        are the buyer's effective purchase price from the pricing module
        (K8); price fields sent by the client are ignored. A product without
        a price in the order currency is 400 with detail code
        PRICE_NOT_FOUND. Needs orders.write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateInput"
      responses:
        "201":
          description: Draft order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/orders/{uuid}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: One order with its lines and status history
      description: Orders outside the orders.read scope answer 404.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/orders/{uuid}/items:
    put:
      tags: [Orders]
      operationId: replaceOrderItems
      summary: Replace the lines of a draft order (buyer, orders.write)
      description: >-
        Prices are fetched again from the pricing module; client prices are
        ignored. Only drafts are editable (409 ORDER_NOT_EDITABLE).
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemsInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/orders/{uuid}/transitions:
    post:
      tags: [Orders]
      operationId: transitionOrder
      summary: Move an order to another status
      description: >-
        Transitions (TEC-166, TEC-167): draft -> submitted (buyer,
        orders.write); submitted -> approved (seller, orders.approve: line
        prices are fetched again and locked, the rate to TRY is frozen into
        rate_snapshot/try_rate, 422 RATE_NOT_FOUND without a rate);
        approved -> preparing | processing (seller, orders.ship or
        orders.approve); preparing -> ready (seller, orders.ship; every line
        fully assigned, else 409 ORDER_NOT_FULLY_ASSIGNED); ready -> shipped
        (seller, orders.ship; one ledger order_out per assigned unit with
        idempotency key order:order_item_unit:<id>:order_out:<barcode>,
        serial units go in_transit owned by the buyer, reservations are
        consumed; 409 ORDER_STOCK_UNAVAILABLE when the ledger refuses);
        draft | submitted | approved | preparing | ready -> cancelled
        (either side, orders.cancel; active reservations are released).
        After shipping (TEC-168): shipped -> received (buyer,
        orders.receive; the whole shipment, no partial receipt: one ledger
        received per shipped unit with idempotency key
        order:order_item_unit:<id>:received:<barcode>, the units become
        available at the buyer organization; orders.received);
        shipped -> cancelling (either side, orders.cancel; nothing moves,
        the reason is kept; orders.cancel_requested); cancelling ->
        cancelled (seller, orders.cancel or orders.ship, once the goods are
        back: one ledger order_cancel_restore per shipped unit returns it to
        the seller's source owner and status). A received order cannot be
        cancelled (409 ORDER_INVALID_TRANSITION; returns are a separate
        flow). A request for the current status is a no-op (a repeated
        ship, receipt or cancel writes no movement). Other moves answer 409
        ORDER_INVALID_TRANSITION; delivered is not used (received follows
        shipped) and answers 409 ORDER_TRANSITION_UNAVAILABLE. Every move
        writes the status history and an orders.* outbox event.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderTransitionInput"
      responses:
        "200":
          description: Order after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/orders/{uuid}/items/{item_uuid}/units:
    post:
      tags: [Orders]
      operationId: assignOrderUnit
      summary: Assign a unit to an order line and reserve it (seller, orders.ship)
      description: >-
        Only while the order is preparing (409 ORDER_NOT_ASSIGNABLE). The
        unit is named by barcode (scan) or unit_uuid and must be of the
        line's product and in the seller's stock (409
        ORDER_UNIT_NOT_AVAILABLE). Serial pieces count as 1; a serial unit
        reserved by another order answers 409 ORDER_UNIT_RESERVED. Rolls
        ship whole: meters, when given, must equal the roll's remaining
        meters (400 ROLL_CUT_UNSUPPORTED). Fixed barcodes take a quantity;
        the seller's active reservations may not exceed what it holds (409
        ORDER_INSUFFICIENT_STOCK). The line amount may not be exceeded (409
        ORDER_ITEM_OVER_ASSIGNED); a unit already on the line answers 409
        ORDER_UNIT_ALREADY_ASSIGNED.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: item_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUnitAssignInput"
      responses:
        "200":
          description: Order with the assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/orders/{uuid}/items/{item_uuid}/units/{unit_uuid}:
    delete:
      tags: [Orders]
      operationId: unassignOrderUnit
      summary: Remove a unit from an order line (seller, orders.ship)
      description: >-
        Only while the order is preparing. The reservation is released (it
        stays as history) and the unit can be assigned again.
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: item_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: unit_uuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Order without the assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOrder"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AccountingOrganizationUUID:
      name: organization_uuid
      in: query
      description: >-
        Book to read: the active organization (default) or an organization
        below it inside the accounting.read scope.
      schema: { type: string, format: uuid }
    VehicleCatalogUUID:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    StockProductUUIDFilter:
      name: product_uuid
      in: query
      schema: { type: string, format: uuid }
    StockCategoryUUIDFilter:
      name: category_uuid
      in: query
      schema: { type: string, format: uuid }
    StockStatusFilter:
      name: status
      in: query
      description: "`in_stock`: quantity or meters above zero; `out_of_stock`: both zero."
      schema: { type: string, enum: [in_stock, out_of_stock] }
    ProductUUID:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    PriceCurrency:
      name: currency
      in: path
      required: true
      description: ISO-4217 code (case-insensitive)
      schema: { type: string, minLength: 3, maxLength: 3, examples: [TRY] }
    MobileApiVersion:
      name: X-Mobile-Api-Version
      in: header
      required: true
      description: Mobile API contract major version (e.g. `1`); the response names the newest supported one.
      schema: { type: string, examples: ["1"] }
    QRCode:
      name: code
      in: path
      required: true
      description: QR sign-in challenge code
      schema: { type: string, maxLength: 64 }
    CountryISO2:
      name: iso2
      in: path
      required: true
      description: ISO 3166-1 alpha-2 country code (case-insensitive)
      schema: { type: string, example: NL }
    GeoID:
      name: id
      in: path
      required: true
      description: Province or district id
      schema: { type: integer, format: int64 }
    ModuleKey:
      name: key
      in: path
      required: true
      description: Module key from the backend catalog (GET /v1/features)
      schema: { type: string, example: ai_assistant }
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }

  responses:
    MobileApiVersionUnsupported:
      description: 426 MOBILE_API_VERSION_UNSUPPORTED (missing or unsupported X-Mobile-Api-Version; update the app)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QRLoginExpired:
      description: 410 QR_LOGIN_EXPIRED
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeDeleted"
    TerritoryConflict:
      description: >-
        409 TERRITORY_CONFLICT: the area, an ancestor or a descendant already
        belongs to a distributor of the brand (details[].code territory_conflict).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidPlate:
      description: 422 INVALID_PLATE (or VALIDATION_ERROR for a malformed country code)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModuleError:
      description: >-
        409 FEATURE_DISABLED (closed one level up) or MODULE_ADMIN_OVERRIDE;
        422 MODULE_CORE (core modules cannot be switched off)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        A well-formed value that is not accepted, such as an unsupported locale
        or an unknown timezone (code VALIDATION_ERROR, details[].field names it).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body or uploaded file too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    SearchSpec:
      type: object
      required: [id, label_key]
      properties:
        id: { type: string, example: users }
        label_key: { type: string, example: search.specs.users }
        permission: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        searchable_fields:
          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }
        tenant_scoped: { type: boolean }

    SearchHit:
      type: object
      required: [spec, id, title, href]
      properties:
        spec: { type: string }
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        href: { type: string }
        icon: { type: [string, "null"] }
        score: { type: [number, "null"], format: double }

    SearchSpecsData:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchSpec" }
        enabled: { type: boolean }

    SearchHitsData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    EnvelopeSearchSpecs:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchSpecsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSearchHits:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchHitsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    CustomerType:
      type: string
      enum: [individual, corporate]

    CustomerOrganizationLink:
      type: object
      required: [uuid, name, type, linked_at, first_service_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [center, distributor, dealer] }
        linked_at: { type: string, format: date-time }
        first_service_at: { type: [string, "null"], format: date-time }

    CustomerSummary:
      type: object
      description: >-
        An anonymized customer is masked: `anonymized: true`, name is the
        localized "Anonymous customer" label, surname empty, contact fields
        null.
      required: [uuid, name, surname, email, phone, status, anonymized, type, company_name, locale, created_at, linked_at, first_service_at]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        surname: { type: string }
        email: { type: [string, "null"] }
        phone: { type: [string, "null"], description: E.164 }
        status: { type: string, enum: [active, disabled, pending, anonymized] }
        anonymized: { type: boolean }
        type: { $ref: "#/components/schemas/CustomerType" }
        company_name: { type: [string, "null"] }
        locale: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        linked_at: { type: [string, "null"], format: date-time }
        first_service_at: { type: [string, "null"], format: date-time }

    CustomerDetail:
      allOf:
        - $ref: "#/components/schemas/CustomerSummary"
        - type: object
          required: [tax_office, national_id_last4, tax_no_last4, address, notification_prefs, editable, identity_editable, organizations]
          properties:
            tax_office: { type: [string, "null"] }
            national_id_last4:
              type: [string, "null"]
              description: Last four characters; the full value is never returned.
            tax_no_last4:
              type: [string, "null"]
              description: Last four characters; the full value is never returned.
            address: { type: object, additionalProperties: true }
            notification_prefs:
              type: object
              additionalProperties: { type: boolean }
            editable:
              type: boolean
              description: False for anonymized, disabled or merged accounts.
            identity_editable:
              type: boolean
              description: >-
                True when every link of the customer is in the caller's scope
                and the user has no panel membership; otherwise edits only
                fill empty fields.
            organizations:
              type: array
              description: Serving organizations inside the caller's scope.
              items: { $ref: "#/components/schemas/CustomerOrganizationLink" }

    CustomerWrite:
      allOf:
        - $ref: "#/components/schemas/CustomerDetail"
        - type: object
          required: [existing_user, ignored_fields]
          properties:
            existing_user:
              type: boolean
              description: The phone already belonged to a user, who was linked.
            ignored_fields:
              type: array
              description: Submitted values kept as stored (shared customer, fill-only).
              items: { type: string }

    CustomerCreateInput:
      type: object
      additionalProperties: false
      required: [phone, name]
      properties:
        phone: { type: string, description: Any format; normalized to E.164 }
        name: { type: string, maxLength: 100 }
        surname: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        locale: { type: string, example: tr }
        type: { $ref: "#/components/schemas/CustomerType" }
        company_name: { type: string, maxLength: 200 }
        tax_office: { type: string, maxLength: 150 }
        national_id: { type: string, description: "TC kimlik no; stored encrypted (5-20 letters/digits)" }
        tax_no: { type: string, description: Stored encrypted (5-20 letters/digits) }
        address: { type: object, additionalProperties: true }
        notification_prefs:
          type: object
          description: Keys whatsapp, email, sms, push.
          additionalProperties: { type: boolean }

    CustomerUpdateInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 100 }
        surname: { type: [string, "null"], maxLength: 100 }
        email: { type: [string, "null"] }
        type: { $ref: "#/components/schemas/CustomerType" }
        company_name: { type: [string, "null"], maxLength: 200 }
        tax_office: { type: [string, "null"], maxLength: 150 }
        national_id: { type: [string, "null"] }
        tax_no: { type: [string, "null"] }
        address: { type: [object, "null"], additionalProperties: true }
        notification_prefs:
          type: [object, "null"]
          additionalProperties: { type: boolean }

    CustomerUpgradeInput:
      type: object
      additionalProperties: false
      required: [organization_uuid, role]
      properties:
        organization_uuid: { type: string, format: uuid, description: An existing dealer }
        role: { type: string, enum: [dealer_owner, dealer_staff] }

    CustomerUpgrade:
      type: object
      required: [customer_uuid, organization, role, member_role]
      properties:
        customer_uuid: { type: string, format: uuid }
        organization:
          type: object
          required: [uuid, slug, name, type]
          properties:
            uuid: { type: string, format: uuid }
            slug: { type: string }
            name: { type: string }
            type: { type: string }
        role: { type: string, enum: [dealer_owner, dealer_staff] }
        member_role: { type: string, enum: [owner, staff] }

    VehicleCatalogRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    Vehicle:
      type: object
      required: [uuid, customer_uuid, organization_uuid, plate, plate_normalized, plate_country, vin, model_year, car_brand, car_model, created_at, updated_at, warnings]
      properties:
        uuid: { type: string, format: uuid }
        customer_uuid: { type: string, format: uuid }
        organization_uuid:
          type: [string, "null"]
          format: uuid
          description: Organization that registered the vehicle.
        plate: { type: [string, "null"] }
        plate_normalized: { type: [string, "null"] }
        plate_country: { type: [string, "null"], description: ISO 3166-1 alpha-2 }
        vin: { type: [string, "null"] }
        model_year: { type: [integer, "null"] }
        car_brand:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogRef"
            - type: "null"
        car_model:
          oneOf:
            - $ref: "#/components/schemas/VehicleCatalogRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        warnings:
          type: array
          description: After a write, vin_duplicate / plate_duplicate when another vehicle of the brand has the same value.
          items: { type: string, enum: [vin_duplicate, plate_duplicate] }

    VehicleCreateInput:
      type: object
      additionalProperties: false
      required: [customer_uuid, plate]
      properties:
        customer_uuid: { type: string, format: uuid }
        plate: { type: string, maxLength: 20 }
        plate_country: { type: string, description: "ISO alpha-2; default: organization country, then TR" }
        car_brand_uuid: { type: [string, "null"], format: uuid }
        car_model_uuid: { type: [string, "null"], format: uuid }
        model_year: { type: [integer, "null"], minimum: 1900 }
        vin: { type: string, description: "17 characters without I, O, Q" }

    VehicleUpdateInput:
      type: object
      additionalProperties: false
      properties:
        plate: { type: string, maxLength: 20 }
        plate_country: { type: [string, "null"] }
        car_brand_uuid: { type: [string, "null"], format: uuid }
        car_model_uuid: { type: [string, "null"], format: uuid }
        model_year: { type: [integer, "null"], minimum: 1900 }
        vin: { type: [string, "null"] }

    EnvelopeCustomer:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerDetail" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerWrite:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerWrite" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CustomerSummary" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeCustomerUpgrade:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CustomerUpgrade" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehicle:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/Vehicle" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeVehiclePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Vehicle" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    Error:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        refresh_expires_at:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [uuid, email, name, surname, status, is_super_admin, email_verified]
      properties:
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        status:
          type: string
          examples: [active, disabled]
        is_super_admin:
          type: boolean
        email_verified:
          type: boolean
        locale:
          description: The user's own language; null inherits from the organization (see Me.effective_locale).
          oneOf:
            - $ref: "#/components/schemas/Locale"
            - type: "null"
        timezone:
          type: [string, "null"]
          description: The user's own IANA timezone; null inherits from the organization.
          examples: ["Asia/Dubai"]

    Locale:
      type: string
      description: >-
        Canonical locale code (K10). Inputs are normalized: "zh_CN", "zh-cn"
        and "zh" become zh-CN; a regional code falls back to its language
        ("tr-TR" -> tr). Unknown codes are rejected with 422.
      enum: [tr, en, bg, de, el, uk, ru, fr, es, it, zh-CN, az, ar]

    MeLinks:
      type: object
      required: [profile, change_password, notification_preferences]
      properties:
        profile: { type: string, examples: ["/v1/auth/profile"] }
        change_password: { type: string, examples: ["/v1/auth/password/change"] }
        notification_preferences: { type: string, examples: ["/v1/notification-preferences"] }

    MeChannels:
      type: object
      properties:
        user:
          type: string
          description: Centrifugo channel hint
          examples: ["user:uuid"]

    MeRealtime:
      type: object
      required: [enabled, user_channel]
      properties:
        enabled: { type: boolean }
        ws_url: { type: string }
        user_channel:
          type: string
          examples: ["user:uuid"]

    Me:
      type: object
      required: [user, roles, permissions, links, channels, realtime, effective_locale, effective_timezone]
      properties:
        effective_locale:
          description: >-
            Resolved language: user -> active organization -> brand center ->
            Accept-Language -> tr.
          $ref: "#/components/schemas/Locale"
        effective_timezone:
          type: string
          description: >-
            Resolved IANA timezone: user -> active organization -> brand
            center -> Europe/Istanbul.
          examples: ["Europe/Istanbul"]
        user:
          $ref: "#/components/schemas/PublicUser"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        grants:
          type: object
          description: >-
            Permission slug -> scope in the active organization context (global
            roles + roles of the active membership).
          additionalProperties:
            $ref: "#/components/schemas/PermissionScope"
        active_organization_uuid:
          type: string
          format: uuid
        organization_roles:
          type: array
          description: Roles of the user in the active organization.
          items:
            type: string
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
        links:
          $ref: "#/components/schemas/MeLinks"
        channels:
          $ref: "#/components/schemas/MeChannels"
        realtime:
          $ref: "#/components/schemas/MeRealtime"
        impersonation:
          $ref: "#/components/schemas/MeImpersonation"

    MeImpersonation:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"

    OrganizationMembership:
      type: object
      required: [uuid, slug, name, role, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, staff]
        logo_url:
          type: [string, "null"]
        status:
          type: string
        access_ends_at:
          type: [string, "null"]
          format: date-time
        type:
          $ref: "#/components/schemas/OrganizationType"
        brand:
          $ref: "#/components/schemas/BrandRef"
        parent:
          oneOf:
            - $ref: "#/components/schemas/OrganizationParentRef"
            - type: "null"

    OrganizationType:
      type: string
      enum: [center, distributor, dealer]

    OrganizationStatus:
      type: string
      description: pending and expired are legacy values kept for compatibility.
      enum: [pending, active, read_only, suspended, expired]

    BrandRef:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        name:
          type: string

    OrganizationParentRef:
      type: object
      required: [uuid, name]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    PublicBrand:
      type: object
      required: [uuid, slug, name, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]

    PublicWarranty:
      type: object
      description: Public warranty projection (TEC-189); never carries personal data.
      required: [public_code, status, start_at, end_at, days_remaining, product, brand, dealer, vehicle]
      properties:
        public_code:
          type: string
        status:
          type: string
          enum: [active, expired, void]
          description: An active warranty past end_at reads expired before the nightly cron runs.
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        days_remaining:
          type: integer
          minimum: 0
          description: Whole days left (rounded up) while active, else 0.
        product:
          type: object
          required: [name]
          properties:
            name: { type: string }
        brand:
          type: object
          description: Brand of the request domain.
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
        dealer:
          type: object
          description: Organization that performed the service.
          required: [name, city]
          properties:
            name: { type: string }
            city: { type: string }
        vehicle:
          type: object
          required: [brand_name, brand_logo_uuid, model_name, model_year, plate_masked, vin_last4]
          properties:
            brand_name: { type: string }
            brand_logo_uuid:
              type: [string, "null"]
              format: uuid
              description: Car brand with a logo, served at /brand-logos/{uuid}.
            model_name: { type: string }
            model_year:
              type: [integer, "null"]
            plate_masked:
              type: [string, "null"]
              example: "34 *** 12"
            vin_last4:
              type: [string, "null"]
              example: "6752"

    PublicOrganization:
      type: object
      required: [uuid, slug, name, status, access_ok]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
        logo_url:
          type: [string, "null"]
        access_ok:
          type: boolean

    Organization:
      type: object
      required: [uuid, slug, name, city, district, phone, address, status, access_starts_at, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
        plan_code:
          type: [string, "null"]
        access_starts_at:
          type: string
          format: date-time
        access_ends_at:
          type: [string, "null"]
          format: date-time
        logo_url:
          type: [string, "null"]
        country_id:
          type: [integer, "null"]
          format: int64
          description: Structured address (GET /v1/geo/countries); city/district are the display copy.
        province_id:
          type: [integer, "null"]
          format: int64
        district_id:
          type: [integer, "null"]
          format: int64
        type:
          $ref: "#/components/schemas/OrganizationType"
        brand:
          $ref: "#/components/schemas/BrandRef"
        parent:
          oneOf:
            - $ref: "#/components/schemas/OrganizationParentRef"
            - type: "null"
        currency:
          type: string
          description: ISO 4217 code
        locale:
          $ref: "#/components/schemas/Locale"
        timezone:
          type: string
        contract_valid_until:
          type: [string, "null"]
          format: date
        settings:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrganizationRegisterRequest:
      type: object
      required: [name, surname, email, password, organization_name, city, district, phone, address]
      properties:
        name:
          type: string
        surname:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        organization_name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        country_id:
          type: [integer, "null"]
          format: int64
          description: >-
            Structured address. A dealer without parent_uuid is placed under
            the distributor whose territory covers it (district > province >
            country), otherwise under the brand center. Empty city/district
            are filled from the province/district names.
        province_id:
          type: [integer, "null"]
          format: int64
        district_id:
          type: [integer, "null"]
          format: int64

    CreatePlatformOrganizationRequest:
      type: object
      required: [name, owner_user_uuid]
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        owner_user_uuid:
          type: string
          format: uuid
        type:
          type: string
          enum: [distributor, dealer]
          default: dealer
        parent_uuid:
          type: [string, "null"]
          format: uuid
          description: Defaults to the brand center.
        register_as_warehouse:
          type: boolean
          description: Distributor only; stored in settings, the warehouse is created in F1.
        currency:
          type: string
        locale:
          type: string
          description: Normalized to a Locale code (tr-TR -> tr, zh_CN -> zh-CN); unknown codes -> 422.
        timezone:
          type: string
        country_id:
          type: [integer, "null"]
          format: int64
          description: >-
            Structured address. A dealer without parent_uuid is placed under
            the distributor whose territory covers it (district > province >
            country), otherwise under the brand center. Empty city/district
            are filled from the province/district names.
        province_id:
          type: [integer, "null"]
          format: int64
        district_id:
          type: [integer, "null"]
          format: int64

    PatchPlatformOrganizationRequest:
      type: object
      properties:
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          $ref: "#/components/schemas/OrganizationStatus"
        plan_code:
          type: string
        access_starts_at:
          type: string
          format: date-time
        access_ends_at:
          type: string
          format: date-time
        clear_access_ends_at:
          type: boolean
        currency:
          type: string
        locale:
          type: string
          description: Normalized to a Locale code (tr-TR -> tr, zh_CN -> zh-CN); unknown codes -> 422.
        timezone:
          type: string
        parent_uuid:
          type: string
          format: uuid
          description: Moves the organization in the tree (platform only).
        country_id:
          type: [integer, "null"]
          format: int64
          description: >-
            Present (null clears) replaces the structured address together
            with province_id/district_id. The parent does not follow the
            address (only the platform admin changes a distributor, K25).
        province_id:
          type: [integer, "null"]
          format: int64
        district_id:
          type: [integer, "null"]
          format: int64

    OrganizationRegisterResult:
      type: object
      required: [user, organization, tokens]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"
        organization:
          $ref: "#/components/schemas/Organization"
        tokens:
          $ref: "#/components/schemas/Tokens"

    SessionSwitch:
      type: object
      required: [user_uuid, email]
      properties:
        user_uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        impersonator_uuid:
          type: string
          format: uuid

    ImpersonationResult:
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [session]
          properties:
            session:
              $ref: "#/components/schemas/SessionSwitch"

    RegisterRequest:
      type: object
      required: [email, password, name, surname]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        surname:
          type: string

    RegisterResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        totp_code:
          type: string
          description: Authenticator or recovery code when 2FA is enabled
          maxLength: 32
        organization_slug:
          type: string
          description: When set, login is scoped to this organization membership (panel realm only)
        realm:
          type: string
          enum: [panel, portal]
          default: panel
          description: Session realm (JWT `aud`). Refresh keeps it.

    OrganizationContextRequest:
      type: object
      required: [organization_slug]
      properties:
        organization_slug:
          type: string
          description: Organization slug to scope the active session to

    TOTPCodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32

    TOTPStatus:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        confirmed_at: { type: [string, "null"], format: date-time }

    TOTPSetup:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: { type: string }
        otpauth_url: { type: string }

    TOTPConfirm:
      type: object
      required: [enabled, recovery_codes]
      properties:
        enabled: { type: boolean }
        recovery_codes:
          type: array
          items: { type: string }

    EnvelopeTOTPStatus:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TOTPStatus" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTOTPSetup:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TOTPSetup" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeTOTPConfirm:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/TOTPConfirm" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    CreatePlatformUserRequest:
      type: object
      required: [email, password, name, surname]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
        name: { type: string }
        surname: { type: string }
        status: { type: string, examples: [active, pending, disabled] }
        role_uuids:
          type: array
          items: { type: string, format: uuid }

    PatchPlatformUserRequest:
      type: object
      properties:
        name: { type: string }
        surname: { type: string }
        status: { type: string }
        role_uuids:
          type: array
          items: { type: string, format: uuid }

    SetPlatformUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }

    RoleSummary:
      type: object
      required: [uuid, name, slug]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, "null"] }
        is_system: { type: boolean }
        org_type:
          type: string
          description: Subject kind of the role; organization roles are granted per membership.
          enum: [platform, center, distributor, dealer, customer, fleet]

    PermissionScope:
      type: string
      description: >-
        Reach of a grant. all > brand > subtree > managed > assigned > own;
        customer only covers itself.
      enum: [all, brand, subtree, managed, assigned, own, customer]

    PermissionSummary:
      type: object
      required: [uuid, name, slug, module, scopes, is_sensitive, super_admin_only]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        module: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/PermissionScope" }
        is_sensitive: { type: boolean }
        super_admin_only: { type: boolean }
        description: { type: [string, "null"] }

    RoleGrant:
      type: object
      required: [permission, scope]
      properties:
        permission: { type: string }
        scope: { $ref: "#/components/schemas/PermissionScope" }

    RoleDetail:
      allOf:
        - $ref: "#/components/schemas/RoleSummary"
        - type: object
          required: [permission_slugs, grants]
          properties:
            permission_slugs:
              type: array
              items: { type: string }
            grants:
              type: array
              items: { $ref: "#/components/schemas/RoleGrant" }

    PlatformUserDetail:
      allOf:
        - $ref: "#/components/schemas/PublicUser"
        - type: object
          required: [roles, auth_methods]
          properties:
            roles:
              type: array
              items:
                $ref: "#/components/schemas/RoleSummary"
            auth_methods:
              type: array
              items:
                $ref: "#/components/schemas/UserAuthMethod"

    UserAuthMethod:
      type: object
      required: [kind, linked_at]
      properties:
        kind:
          type: string
          enum: [password, passkey, oauth]
        provider:
          type: string
          description: OAuth provider slug when kind is oauth
          examples: [github, google, facebook, apple]
        label:
          type: [string, "null"]
          description: Optional display label (e.g. passkey name)
        linked_at:
          type: string
          format: date-time

    PublicUserPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlatformUserDetail"
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer }

    RealtimeConnectionToken:
      type: object
      required: [token, expires_at, ws_url]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        ws_url: { type: string }

    RealtimeSubscriptionTokenRequest:
      type: object
      required: [channel]
      properties:
        channel: { type: string }

    RealtimeSubscriptionToken:
      type: object
