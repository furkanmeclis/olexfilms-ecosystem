  /v1/platform/users/{uuid}/password:
    post:
      tags: [Platform]
      operationId: postPlatformUserPassword
      summary: Admin set user password
      description: Sets password and revokes all refresh tokens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPlatformUserPasswordRequest"
      responses:
        "200":
          description: Password set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/users/{uuid}/impersonate:
    post:
      tags: [Platform]
      operationId: postPlatformUserImpersonate
      summary: Impersonate user
      description: |
        Issues tokens for the target user while preserving the actor in the `imp` JWT claim
        and refresh token metadata. Requires step-up verification.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Impersonation session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImpersonationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/impersonation/stop:
    post:
      tags: [Auth]
      operationId: postAuthImpersonationStop
      summary: Stop impersonation
      description: Restores the original actor session when the access token includes an impersonator claim.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Impersonation stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImpersonationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/realtime/connection-token:
    post:
      tags: [Realtime]
      operationId: postRealtimeConnectionToken
      summary: Issue Centrifugo connection JWT
      description: |
        Returns `{ token, expires_at, ws_url }`. JWT `sub` is the user UUID string.
        Any authenticated panel session; no active organization (`oid`) is needed
        since the token grants no channel. Disabled Centrifugo → `503 REALTIME_DISABLED`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Connection token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRealtimeConnectionToken"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Realtime disabled
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/realtime/subscription-token:
    post:
      tags: [Realtime]
      operationId: postRealtimeSubscriptionToken
      summary: Issue Centrifugo subscription JWT
      description: |
        Body `{ channel }`. Allowlist `user:{own_uuid}`, member `workspace:{uuid}`,
        and `conversation:{uuid}` (authenticated session; HTTP inbox ACL is the hard boundary).
        `user:{own_uuid}` needs no active organization; every other channel requires
        `auth.session` from the active organization, otherwise `403`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeSubscriptionTokenRequest"
      responses:
        "200":
          description: Subscription token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRealtimeSubscriptionToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Realtime disabled
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/profile:
    patch:
      tags: [Auth]
      operationId: patchAuthProfile
      summary: Update own profile
      description: >-
        Partial update of name/surname/locale/timezone. Email/password/status/roles
        are not changeable here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProfileRequest"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMe"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password/forgot:
    post:
      tags: [Auth]
      operationId: postAuthPasswordForgot
      summary: Request password reset
      description: Always returns accepted. If the email exists, enqueues a reset OTP email via Notification Center.
      security: []
      requestBody:
        required: true
