        the in-app channel) and is ignored on write. `rules` holds every row,
        event specific ones included; a rule overrides the bool of its channel.
      required: [email_enabled, inapp_enabled, realtime_enabled, push_enabled]
      properties:
        email_enabled: { type: boolean }
        inapp_enabled: { type: boolean }
        realtime_enabled: { type: boolean, deprecated: true }
