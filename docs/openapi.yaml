        product_uuid: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        viewer:
          type: string
          enum: [center, distributor, dealer]
        prices:
          type: array
          items: { $ref: "#/components/schemas/EffectivePrice" }

    ListPriceInput:
