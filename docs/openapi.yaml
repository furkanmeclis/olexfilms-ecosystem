  /v1/mobile/measurements:
    post:
      tags: [Mobile]
      operationId: postMobileMeasurement
      summary: Upload a paint thickness measurement (contract draft, K28)
      description: |
        **Draft contract — answers 501 until F3.** The schema is finalized in
        F3 (measurement module); fields may still change there, while `vin`,
        `raw` and the version header stay mandatory. Idempotent by the
        `Idempotency-Key` header or `client_measurement_id`. Accepted uploads
        will answer `202 {uuid, status: accepted}`. Permission:
        `measurements.write` (managed scope) once the module exists.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
        - name: Idempotency-Key
          in: header
          required: false
          description: Client generated key; a repeated key returns the first result.
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileMeasurementRequest"
      responses:
        "202":
          description: Accepted (F3)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMobileMeasurementAccepted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"
        "501":
          description: 501 NOT_IMPLEMENTED until F3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- TEC-91: QR web sign-in (web side) ---------------------------------
  /v1/auth/qr/start:
    post:
      tags: [Mobile]
      operationId: postAuthQRStart
      summary: Start a QR web sign-in
      description: |
        For a browser that is not signed in. Returns the code (shown as the
        QR `payload`), a secret only this browser knows, and a short-lived
        anonymous Centrifugo connection token subscribed to `qr:{code}`
        only (subscribe-only namespace). The channel carries `{status}`
        only: `scanned`, `approved`, `rejected`, `consumed`. Lifetime
        `QR_LOGIN_TTL` (120 s). Fallback: poll `GET /v1/auth/qr/{code}/status`.
      security: []
      responses:
        "201":
          description: Challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRStart"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/qr/{code}/status:
    get:
      tags: [Mobile]
      operationId: getAuthQRStatus
      summary: QR web sign-in status (polling)
      security: []
      parameters:
        - $ref: "#/components/parameters/QRCode"
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/QRLoginExpired"

  /v1/auth/qr/complete:
    post:
      tags: [Mobile]
      operationId: postAuthQRComplete
      summary: Exchange an approved QR sign-in for a panel session
      description: |
        Single use. Called server side by the BFF (Auth.js `qr-login`
        provider); the panel BFF never forwards it from the browser. 403
        `QR_LOGIN_REJECTED`, 409 `QR_LOGIN_PENDING` / `QR_LOGIN_CLOSED`, 410
        `QR_LOGIN_EXPIRED`, 422 `QR_LOGIN_INVALID_SECRET`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QRCompleteRequest"
      responses:
        "200":
          description: Panel token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRComplete"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/QRLoginExpired"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

