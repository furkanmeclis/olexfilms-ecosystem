        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Platform]
      operationId: patchPlatformGoogleIntegrationSettings
      summary: Update Google OAuth integration settings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchOAuthProviderSettingsRequest"
      responses:
        "200":
          description: Updated Google integration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeOAuthProviderSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
