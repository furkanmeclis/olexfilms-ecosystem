    CustomerMergeResult:
      type: object
      required: [source_uuid, target_uuid, dry_run, moved, conflicts, profile, phone_moved, email_moved, sessions_revoked]
      properties:
        source_uuid: { type: string, format: uuid }
        target_uuid: { type: string, format: uuid }
        dry_run: { type: boolean }
        moved:
          type: object
          required: [vehicles, services, warranties, organization_links, consents]
          properties:
            vehicles: { type: integer }
            services: { type: integer }
            warranties: { type: integer }
            organization_links: { type: integer }
            consents: { type: integer }
        conflicts:
          type: object
          required: [organization_links, consents_kept, services_kept, cari_accounts_kept]
          properties:
            organization_links:
              type: integer
              description: Source links folded into the target's link of the same organization.
            consents_kept:
              type: integer
              description: Source consents for a legal text the target already decided (stay on the source).
            services_kept:
              type: integer
              description: Services whose vehicle now belongs to a third person (stay on the source).
            cari_accounts_kept:
              type: integer
              description: Customer cari accounts of the source (ledgers are not moved).
        profile:
          type: string
          enum: [moved, merged, kept, none]
          description: moved = target had no profile; merged = target filled its empty fields.
        phone_moved: { type: boolean }
        email_moved: { type: boolean }
        sessions_revoked: { type: integer }
        merged_at: { type: string, format: date-time, description: Set when applied. }

