        to: { type: string, format: date, description: Statement only }
        as_of: { type: string, format: date, description: Balance report only }
        locale: { type: string, description: Report language override (default the user language), example: tr }

    EnvelopeCariStatement:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/CariStatement" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeAccountingBalanceReport:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/AccountingBalanceReport" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ServiceStatus:
      type: string
      enum: [draft, pending, processing, ready, completed, cancelled]

    ServiceRef:
      type: object
      required: [uuid, name]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }

    ServiceOrgRef:
      type: object
      required: [uuid, name, type]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }

    ServiceCustomerRef:
      type: object
      required: [uuid, name, surname, phone, anonymized]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, description: The anonymized label when anonymized (K19) }
        surname: { type: string }
        phone: { type: [string, "null"] }
        anonymized: { type: boolean }

    ServiceItem:
      type: object
      required: [uuid, product, barcode, unit_kind, kind, quantity, meters, applied_parts, notes, created_at]
      properties:
        uuid: { type: string, format: uuid }
        product:
          type: object
          required: [uuid, sku, name, unit_type]
          properties:
            uuid: { type: string, format: uuid }
            sku: { type: string }
            name: { type: string }
            unit_type: { type: string }
        barcode: { type: string }
        unit_kind: { type: string, enum: [serial, fixed] }
        kind: { type: string, enum: [full, partial] }
        quantity: { type: [integer, "null"], description: Pieces of a fixed barcode }
        meters: { type: [string, "null"], description: Meters cut from a roll (partial) }
        applied_parts:
          type: array
          items: { type: string }
        notes: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    ServiceStockUnit:
      type: object
      required: [uuid, barcode, unit_kind, product, quantity_on_hand, initial_meters, remaining_meters]
      properties:
        uuid: { type: string, format: uuid }
        barcode: { type: string }
        unit_kind: { type: string, enum: [serial, fixed] }
        product:
          type: object
          required: [uuid, sku, name, unit_type, available_parts]
          properties:
            uuid: { type: string, format: uuid }
            sku: { type: string }
            name: { type: string }
            unit_type: { type: string }
            available_parts:
              type: array
              items: { type: string }
              description: Parts of the product category (allowed applied_parts)
        quantity_on_hand: { type: integer, description: "1 for a serial unit, pieces on hand for a fixed barcode" }
        initial_meters: { type: [string, "null"], description: Roll length }
        remaining_meters: { type: [string, "null"], description: Meters left on the roll }

    ServiceImage:
      type: object
      required: [uuid, title, sort_order, url, created_at]
      properties:
        uuid: { type: string, format: uuid }
        title: { type: [string, "null"] }
        sort_order: { type: integer }
        url: { type: string, description: Authenticated download path }
        created_at: { type: string, format: date-time }

    ServiceStatusLog:
      type: object
      required: [from_status, to_status, note, by_other_organization, created_at]
      properties:
        from_status: { type: [string, "null"] }
        to_status: { $ref: "#/components/schemas/ServiceStatus" }
        note: { type: [string, "null"] }
        by_other_organization:
          type: boolean
          description: The change was made by another organization (e.g. the center)
        created_at: { type: string, format: date-time }

    ServiceWarranty:
      type: object
      description: A warranty the completed service issued (TEC-186), detail only.
      required: [uuid, public_code, service_item_uuid, product_name, item_kind, status, start_at, end_at, expired_at, voided_at]
      properties:
        uuid: { type: string, format: uuid }
        public_code: { type: string }
        service_item_uuid: { type: string, format: uuid }
        product_name: { type: string }
        item_kind: { type: string, enum: [full, partial] }
        status: { type: string, enum: [active, expired, void] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        expired_at: { type: [string, "null"], format: date-time }
        voided_at: { type: [string, "null"], format: date-time }

    Service:
      type: object
      required:
        - uuid
        - service_no
        - status
        - status_label
        - organization
        - customer
        - vehicle_uuid
        - car_brand
        - car_model
        - model_year
        - plate
        - plate_country
        - vin
        - km
        - package
        - notes
        - has_measurement
        - cancel_reason
        - completed_at
        - cancelled_at
        - created_at
        - updated_at
        - editable
        - items_editable
        - available_transitions
      properties:
        uuid: { type: string, format: uuid }
        service_no: { type: string, description: DS + 8 alphanumerics }
        status: { $ref: "#/components/schemas/ServiceStatus" }
        status_label: { type: string }
        organization: { $ref: "#/components/schemas/ServiceOrgRef" }
        customer: { $ref: "#/components/schemas/ServiceCustomerRef" }
        vehicle_uuid: { type: string, format: uuid }
        car_brand: { $ref: "#/components/schemas/ServiceRef" }
        car_model: { $ref: "#/components/schemas/ServiceRef" }
        model_year: { type: [integer, "null"] }
        plate: { type: [string, "null"] }
        plate_country: { type: [string, "null"] }
        vin: { type: [string, "null"] }
        km: { type: [integer, "null"] }
        package: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        has_measurement: { type: boolean }
        cancel_reason: { type: [string, "null"] }
        completed_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        editable: { type: boolean, description: The caller may edit the form and images }
        items_editable: { type: boolean, description: The caller may add or remove items }
        available_transitions:
          type: array
          items: { $ref: "#/components/schemas/ServiceStatus" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ServiceItem" }
        images:
          type: array
          items: { $ref: "#/components/schemas/ServiceImage" }
        status_logs:
          type: array
          items: { $ref: "#/components/schemas/ServiceStatusLog" }
        warranties:
          type: array
          items: { $ref: "#/components/schemas/ServiceWarranty" }

    ServiceCreateInput:
      type: object
      required: [customer_uuid, vehicle_uuid]
      properties:
        customer_uuid: { type: string, format: uuid }
        vehicle_uuid: { type: string, format: uuid }
        km: { type: integer, minimum: 0, maximum: 5000000 }
        package: { type: string, maxLength: 255 }
        notes: { type: string, maxLength: 5000 }
        has_measurement: { type: boolean, default: false }

    ServiceUpdateInput:
      type: object
      properties:
        km: { type: [integer, "null"], minimum: 0, maximum: 5000000 }
        package: { type: [string, "null"], maxLength: 255 }
        notes: { type: [string, "null"], maxLength: 5000 }
        has_measurement: { type: boolean }
        vin:
          type: [string, "null"]
          description: >-
            Replaces the VIN snapshot of the service (the vehicle record is
            not changed). Same rules as the vehicle VIN: 17 letters or digits
            without I, O, Q; spaces and dashes are dropped. null or "" clears
            it (400 while has_measurement is true).

    ServiceItemInput:
      type: object
      required: [barcode]
      properties:
        barcode: { type: string, maxLength: 64 }
        product_uuid: { type: string, format: uuid, description: Optional check of the unit's product }
        kind: { type: string, enum: [full, partial], default: full }
        quantity: { type: integer, minimum: 1, description: Pieces of a fixed barcode }
        meters: { type: number, description: "Meters cut from a roll (partial, 2 decimals)" }
        applied_parts:
          type: array
          items: { type: string }
        notes: { type: string, maxLength: 5000 }

    ServiceTransitionInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/ServiceStatus" }
        note: { type: string, maxLength: 5000, description: Kept in the status log; the cancel reason for cancelled }

    EnvelopeService:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/Service" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeServiceStockUnitList:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ServiceStockUnit" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeServiceImage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/ServiceImage" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeServicePage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Service" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    OrderStatus:
      type: string
      enum: [draft, submitted, approved, preparing, ready, processing, shipped, delivered, received, cancelling, cancelled]

    OrderOrgRef:
      type: object
      required: [uuid, name, type]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [center, distributor, dealer] }

    OrderProductRef:
      type: object
      required: [uuid, sku, name, unit_type]
      properties:
        uuid: { type: string, format: uuid }
        sku: { type: string }
        name: { type: string }
        unit_type: { type: string }

    OrderAssignedUnit:
      type: object
      required: [unit_uuid, barcode, unit_kind, quantity, meters, shipped, assigned_at]
      properties:
        unit_uuid: { type: string, format: uuid }
        barcode: { type: string }
        unit_kind: { type: string, enum: [serial, fixed] }
        quantity: { type: [integer, "null"], description: Pieces (1 for a serial piece) }
        meters: { type: [string, "null"], description: Whole roll meters (roll_meter lines) }
        shipped: { type: boolean, description: The order_out movement is written }
        assigned_at: { type: string, format: date-time }

    OrderUnitAssignInput:
      type: object
      description: Give either barcode or unit_uuid.
      properties:
        barcode: { type: string, description: Scanned barcode }
        unit_uuid: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000, description: Fixed barcodes only (serial pieces are 1) }
        meters:
          type: string
          pattern: '^[0-9]{1,8}(\.[0-9]{1,2})?$'
          description: Rolls only; must equal the remaining meters (a roll ships whole); a JSON number is accepted too

    OrderItem:
      type: object
      required: [uuid, product, quantity, meters, unit_price, price_source, line_total, note, assigned, units]
      properties:
        uuid: { type: string, format: uuid }
        product: { $ref: "#/components/schemas/OrderProductRef" }
        quantity: { type: [integer, "null"], description: Pieces (null for roll_meter products) }
        meters: { type: [string, "null"], description: Meters with two decimals (roll_meter products) }
        unit_price:
          type: string
          description: Buyer's purchase price (NUMERIC(14,4)); locked at approval
          example: "80.0000"
        price_source: { type: string, enum: [list, override, distributor_dealer] }
        line_total: { type: string, example: "240.00" }
        note: { type: [string, "null"] }
        assigned:
          type: string
          description: Amount covered by the assigned units (pieces, or meters with two decimals)
          example: "3"
        units:
          type: array
          items: { $ref: "#/components/schemas/OrderAssignedUnit" }

    OrderHistoryEntry:
      type: object
      required: [from_status, to_status, reason, created_at]
      properties:
        from_status:
          oneOf:
            - $ref: "#/components/schemas/OrderStatus"
            - type: "null"
        to_status: { $ref: "#/components/schemas/OrderStatus" }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    OrderRateSnapshot:
      type: object
      description: Rate frozen at approval (1 base = rate quote; quote is TRY).
      required: [base, quote, rate, rate_date, source]
      properties:
        base: { type: string, example: EUR }
        quote: { type: string, example: TRY }
        rate: { type: string, example: "35.1234" }
        rate_date: { type: string, format: date }
        source: { type: string, example: tcmb }
        via: { type: string, description: Pivot currency of a cross rate }

    Order:
      type: object
      required:
        - uuid
        - order_no
        - status
        - status_label
        - role
        - seller
        - buyer
        - currency
        - subtotal
        - tax_total
        - total
        - rate_snapshot
        - try_rate
        - note
        - cancel_reason
        - submitted_at
        - approved_at
        - ready_at
        - shipped_at
        - cancelled_at
        - created_at
        - updated_at
        - available_transitions
      properties:
        uuid: { type: string, format: uuid }
        order_no: { type: string, example: ORD-00000001 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        status_label: { type: string, description: Status in the request language }
        role:
          type: string
          enum: [seller, buyer, observer]
          description: Side of the active organization (observer = inside the read scope only)
        seller: { $ref: "#/components/schemas/OrderOrgRef" }
        buyer: { $ref: "#/components/schemas/OrderOrgRef" }
        currency: { type: string, minLength: 3, maxLength: 3, description: Seller brand currency }
        subtotal: { type: string, example: "240.00" }
        tax_total: { type: string, example: "0.00" }
        total: { type: string, example: "240.00" }
        rate_snapshot:
          oneOf:
            - $ref: "#/components/schemas/OrderRateSnapshot"
            - type: "null"
        try_rate: { type: [string, "null"], description: TRY rate frozen at approval }
        note: { type: [string, "null"] }
        cancel_reason: { type: [string, "null"] }
        submitted_at: { type: [string, "null"], format: date-time }
        approved_at: { type: [string, "null"], format: date-time }
        ready_at: { type: [string, "null"], format: date-time }
        shipped_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        available_transitions:
          type: array
          description: Statuses the caller may move the order to
          items: { $ref: "#/components/schemas/OrderStatus" }
        items:
          type: array
          description: Lines (detail responses only)
          items: { $ref: "#/components/schemas/OrderItem" }
        history:
          type: array
          description: Status history (detail responses only)
          items: { $ref: "#/components/schemas/OrderHistoryEntry" }

    OrderItemInput:
      type: object
      required: [product_uuid]
      description: Prices are never accepted from the client (K8).
      properties:
        product_uuid: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 1000000, description: Pieces (piece/fixed products) }
        meters:
          type: string
          pattern: '^[0-9]{1,8}(\.[0-9]{1,2})?$'
          description: Meters (roll_meter products); a JSON number is accepted too
        note: { type: string }

    OrderItemsInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/OrderItemInput" }

    OrderCreateInput:
      type: object
      required: [items]
      properties:
        note: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/OrderItemInput" }

    OrderTransitionInput:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        reason: { type: string, description: Kept in the history; the cancel reason for cancelling and cancelled }

    EnvelopeOrder:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/Order" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeOrderPage:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [items, total, limit, offset]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Order" }
            total: { type: integer, format: int64 }
            limit: { type: integer }
            offset: { type: integer }
        meta: { $ref: "#/components/schemas/ResponseMeta" }
