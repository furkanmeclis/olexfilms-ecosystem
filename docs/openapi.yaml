  /v1/notifications/{uuid}/action:
    get:
      tags: [Notifications]
      operationId: getNotificationAction
      summary: Redeem a signed notification action
      description: >
        Verifies `exp` + `sig`, marks the in-app notification read, and returns
        the stored destination. Requires `notifications.read`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
        - name: exp
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: sig
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Action destination and updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notifications/{uuid}/read:
    post:
      tags: [Notifications]
      operationId: postNotificationRead
      summary: Mark notification read
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotification"
