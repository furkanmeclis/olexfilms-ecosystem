    # --- TEC-91: mobile API --------------------------------------------------
    MobileDevice:
      type: object
      required: [id, platform]
      properties:
        id:
          type: string
          maxLength: 128
          description: Stable installation id of the app (one refresh chain per device)
        name: { type: string, maxLength: 128, examples: ["Pixel 9"] }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string, maxLength: 32, examples: ["2.0.0"] }

    MobileLoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totp_code: { type: string }
        organization_slug: { type: string }
        device: { $ref: "#/components/schemas/MobileDevice" }

    MobileRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
        app_version:
          type: string
          maxLength: 32
          description: Current app version (updates the stored device)

    MobileSession:
      type: object
      required: [uuid, device, expires_at]
      properties:
        uuid: { type: string, format: uuid }
        device: { $ref: "#/components/schemas/MobileDevice" }
        expires_at: { type: string, format: date-time }

    MobileMe:
      allOf:
        - $ref: "#/components/schemas/Me"
        - type: object
          required: [session, current_warehouse]
          properties:
            session:
              oneOf:
                - $ref: "#/components/schemas/MobileSession"
                - type: "null"
            current_warehouse:
              type: "null"
              description: Warehouse context, reserved for F1 (always null)

    MobileLoginResult:
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [me]
          properties:
            me: { $ref: "#/components/schemas/MobileMe" }

    MobilePushTokenRequest:
      type: object
      required: [expo_push_token]
      properties:
        expo_push_token: { type: string, examples: ["ExponentPushToken[xxxxxxxx]"] }
        platform: { type: string, enum: [ios, android] }
        device_id: { type: string, maxLength: 128 }
        device_name:
          type: string
          description: Accepted for compatibility with the previous mobile API (not stored)
        app_version: { type: string, maxLength: 32 }

    # K28 draft: finalized in F3 (measurement module). Fields can still
    # change there; vin, raw and the version header stay mandatory.
    MobileMeasurementRequest:
      type: object
      required: [vin, device, measured_at, parts, raw]
      properties:
        client_measurement_id:
          type: string
          maxLength: 128
          description: Idempotency key in the body (alternative to the Idempotency-Key header)
        vin: { type: string, minLength: 11, maxLength: 17 }
        plate: { type: string }
        service_uuid: { type: string, format: uuid }
        measured_at: { type: string, format: date-time }
        body_type: { type: string, description: NexPTG body type }
        unit: { type: string, enum: [um], default: um }
        device:
          type: object
          required: [serial]
          properties:
            serial: { type: string }
            model: { type: string }
            firmware: { type: string }
        parts:
          type: array
          items:
            type: object
            required: [part, values]
            properties:
              part: { type: string, description: "Body part key, e.g. hood, roof, front_left_door" }
              place: { type: string, description: "Measuring spot on the part" }
              values:
                type: array
                items: { type: number }
        raw:
          type: object
          additionalProperties: true
          description: Device report as received (NexPTG JSON), stored unchanged

    MobileMeasurementAccepted:
      type: object
      required: [uuid, status]
      properties:
        uuid: { type: string, format: uuid }
        status: { type: string, enum: [accepted] }

    QRRealtime:
      type: object
      required: [enabled, channel, expires_at]
      properties:
        enabled: { type: boolean }
        ws_url: { type: string }
        channel: { type: string, examples: ["qr:3q2-7w1abc"] }
        token:
          type: string
          description: Anonymous connection JWT, server-side subscribed to channel only
        subscription_token:
          type: string
          description: Subscription JWT for channel (clients that subscribe themselves)
