  /hooks/wuzapi:
    post:
      tags: [WhatsApp]
      operationId: postHooksWuzapi
      summary: wuzapi webhook (JSON mode)
      description: |
        Called by wuzapi (WEBHOOK_FORMAT=json). Authenticated by the
        `x-hmac-signature` header: hex(HMAC-SHA256(WUZAPI_WEBHOOK_SECRET, raw body)).
        Message events are stored once (UNIQUE(channel, external_id)) and emit
        `whatsapp.message.received` to the outbox; LoggedOut / TemporaryBan
        update the gateway status and notify WhatsApp admins. A 5xx answer makes
        wuzapi retry.
      security: []
      parameters:
        - name: x-hmac-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                type: { type: string, example: Message }
                event: { type: object, additionalProperties: true }
                token: { type: string }
      responses:
        "200":
          description: Processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeWhatsAppWebhookResult"
        "401":
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: WHATSAPP_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

