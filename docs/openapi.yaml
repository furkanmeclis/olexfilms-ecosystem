      operationId: deleteDistrict
      summary: Remove a district unless referenced (platform.geo.write)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/GeoID"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/platform/territories:
    get:
      tags: [Geo]
      operationId: listTerritories
      summary: Distributor territories of the request brand (platform.territories.read)
      security:
        - bearerAuth: []
      parameters:
        - name: distributor_uuid
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Territories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTerritoryList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Geo]
      operationId: assignTerritory
      summary: Assign a country, province or district to a distributor (platform.territories.write)
      description: >-
        K5: an area belongs to one distributor per brand. The same area and
        any ancestor/descendant overlap (NL with A blocks Amsterdam for B and
        vice versa) answer 409 TERRITORY_CONFLICT; details list the blocking
        territories (code territory_conflict).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTerritoryRequest"
      responses:
        "201":
          description: Territory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTerritory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TerritoryConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/territories/resolve:
    get:
      tags: [Geo]
      operationId: resolveTerritory
      summary: Distributor covering an address (district > province > country)
      security:
        - bearerAuth: []
      parameters:
        - name: country_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: province_id
          in: query
          schema: { type: integer, format: int64 }
        - name: district_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Match (null when no distributor covers the address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTerritoryMatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/territories/{uuid}:
    delete:
      tags: [Geo]
      operationId: deleteTerritory
      summary: Remove a territory; existing dealers keep their parent (platform.territories.write)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/plate-formats:
    get:
      tags: [Geo]
      operationId: listPlateFormats
      summary: Active licence plate formats (plate inputs, masks, badge colors)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plate formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateFormatList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/plate-formats/validate:
    post:
      tags: [Geo]
      operationId: validatePlate
      summary: Validate a plate against its plate country
      description: >-
        The plate country is chosen on the vehicle and is independent of the
        customer's country (a German plate on a Turkish customer validates
        against DE). The regex runs on the compact form (upper case, no
        spaces/dashes/dots). A mismatch answers 422 INVALID_PLATE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, plate]
              properties:
                country: { type: string, example: DE, description: ISO 3166-1 alpha-2 }
                plate: { type: string, example: B AB 1234 }
      responses:
        "200":
          description: Valid plate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidPlate"

  /v1/platform/plate-formats:
    get:
      tags: [Geo]
      operationId: listPlatformPlateFormats
      summary: Every plate format incl. inactive (platform.settings.read)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plate formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateFormatList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Geo]
      operationId: createPlateFormat
      summary: Add a country's plate format (platform.settings.write)
      description: The regex must be anchored and RE2 compatible (no lookaround); the example must match it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlateFormatRequest"
      responses:
        "201":
          description: Plate format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateFormat"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/plate-formats/{iso2}:
    patch:
      tags: [Geo]
      operationId: patchPlateFormat
      summary: Change a country's plate format (platform.settings.write)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CountryISO2"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlateFormatRequest"
      responses:
        "200":
          description: Plate format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateFormat"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Geo]
      operationId: deletePlateFormat
      summary: Remove a country's plate format (platform.settings.write)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CountryISO2"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/currencies:
    get:
      tags: [Rates]
      operationId: listCurrencies
      summary: Active ISO 4217 currencies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Currencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCurrencyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/platform/exchange-rates:
    get:
      tags: [Rates]
      operationId: listExchangeRates
      summary: Stored rates of a day (platform.rates.read)
      description: Without date the latest stored day up to today. effective marks the row the resolver uses.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: base
          in: query
          schema: { type: string, example: EUR }
      responses:
        "200":
          description: Rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExchangeRateDay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/exchange-rates/resolve:
    get:
      tags: [Rates]
      operationId: resolveExchangeRate
      summary: The rate a record of that day would freeze (rate_snapshot)
      description: >-
        Latest stored day not after `date` (up to 10 days back), on that day
        manual > tcmb > ecb, either direction; otherwise a cross rate via TRY
        or EUR. 404 RATE_NOT_FOUND when nothing qualifies.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: base
          in: query
          required: true
          schema: { type: string, example: EUR }
        - name: quote
          in: query
          required: true
          schema: { type: string, example: TRY }
      responses:
        "200":
          description: Rate snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRateSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/exchange-rates/override:
    put:
      tags: [Rates]
      operationId: setExchangeRateOverride
      summary: Manual rate for a day and pair; wins over TCMB/ECB (platform.rates.write)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateOverrideRequest"
      responses:
        "200":
          description: Stored override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRateSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Rates]
      operationId: clearExchangeRateOverride
      summary: Remove a manual rate; the fetched value applies again (platform.rates.write)
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: base
          in: query
          required: true
          schema: { type: string }
        - name: quote
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/platform/exchange-rates/fetch:
    post:
      tags: [Rates]
      operationId: fetchExchangeRates
      summary: Fetch TCMB and ECB now (platform.rates.write)
      description: The worker-core scheduler runs the same fetch on weekdays 18:30 and daily 10:15 (Europe/Istanbul).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fetch report per source (a failing source carries error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFetchReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/portal/consents/pending:
    get:
      tags: [Portal]
      operationId: getPortalPendingConsents
      summary: Legal texts the portal user still has to answer
      description: |
        Returns the current version of each legal text (AI guidelines, K22)
        the user has not answered yet. A declined text is not asked again
        until a new version is published. Locale: `locale` query, else
        Accept-Language; falls back to tr, then en.
      security:
        - bearerAuth: []
      parameters:
        - name: locale
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalTextList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/portal/consents:
    post:
      tags: [Portal]
      operationId: postPortalConsent
      summary: Record accept / decline of a legal text version
      description: |
        Records the decision with time, IP and user agent. Answering the same
        version twice keeps the first decision. A version that is no longer
        current answers 409 `LEGAL_TEXT_STALE`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentDecisionRequest"
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeConsent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: LEGAL_TEXT_STALE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/platform/legal-texts/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [ai_guidelines]
    get:
      tags: [Portal]
      operationId: getPlatformLegalTexts
      summary: Legal text editor (latest per locale + history)
      description: Requires `platform.legal_texts.write`.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalTextAdmin"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Portal]
      operationId: putPlatformLegalText
      summary: Publish a new version of one locale's text (Markdown)
      description: |
        Requires `platform.legal_texts.write`. A changed body becomes a new
        version and every portal user is asked again; an unchanged body is
        not a new version (`created=false`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalTextPublishRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeLegalTextPublish"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # --- TEC-91: mobile API (tag Mobile) -----------------------------------
  /v1/mobile/auth/login:
    post:
      tags: [Mobile]
      operationId: postMobileAuthLogin
      summary: Mobile sign-in (device)
      description: |
        E-mail + password sign-in of the mobile app with the device
        description. Returns a mobile token pair (JWT `aud=mobile`, refresh
        30 days, `JWT_MOBILE_REFRESH_TTL`) and the session hydration. Same
        account rules as the panel (customer / fleet only accounts use the
        portal: 403 `NO_PANEL_ACCESS`). An older session of the same device
        ends. The app keeps the tokens itself and calls
        `/api/v1/mobile/*` with `Authorization: Bearer` (no cookies).
      security: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileLoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMobileLogin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/mobile/auth/refresh:
    post:
      tags: [Mobile]
      operationId: postMobileAuthRefresh
      summary: Rotate the mobile refresh token
      description: |
        Single-use rotation; the new pair continues the device chain. A
        rotated token presented again revokes the whole chain of that device
        (401 `REFRESH_TOKEN_REUSED`): the app signs in again. Web refresh
        tokens are refused here and mobile ones on `/v1/auth/refresh`.
      security: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileRefreshRequest"
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/me:
    get:
      tags: [Mobile]
      operationId: getMobileAuthMe
      summary: Mobile session
      description: |
        `/v1/auth/me` plus the device session and `current_warehouse`
        (reserved for F1, always null now).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeMobileMe"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/logout:
    post:
      tags: [Mobile]
      operationId: postMobileAuthLogout
      summary: Sign this device out
      description: Ends every session of the caller's device and drops its Expo push tokens.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/logout-all:
    post:
      tags: [Mobile]
      operationId: postMobileAuthLogoutAll
      summary: Sign out everywhere
      description: Ends every session of the user (all devices and browsers, this one included) and drops every push token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/organization-context:
    post:
      tags: [Mobile]
      operationId: postMobileAuthOrganizationContext
      summary: Switch the active organization
      description: |
        Re-issues the device's token pair with another active organization
        (`oid`); the current session ends. A `warehouse_id` context (`whid`)
        is reserved for F1.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationContextRequest"
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/push-token:
    put:
      tags: [Mobile]
      operationId: putMobilePushToken
      summary: Register the device's Expo push token
      description: |
        Idempotent upsert into `device_push_tokens` (same store and use case
        as `POST /v1/notifications/push-devices`). Shape of the previous
        mobile API: `expo_push_token` + `platform`; `device_id`, `platform`
        and `app_version` default to the session's device.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobilePushTokenRequest"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePushDevice"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"
    delete:
      tags: [Mobile]
      operationId: deleteMobilePushToken
      summary: Delete an Expo push token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expo_push_token]
              properties:
                expo_push_token: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "426":
          $ref: "#/components/responses/MobileApiVersionUnsupported"

  /v1/mobile/auth/qr/{code}:
    get:
      tags: [Mobile]
      operationId: getMobileAuthQR
      summary: Scan a QR web sign-in
      description: |
        Shows the browser's IP and user agent before the user decides and
        marks the challenge scanned (published as `{status: scanned}`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MobileApiVersion"
        - $ref: "#/components/parameters/QRCode"
      responses:
        "200":
          description: Challenge summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeQRScan"
