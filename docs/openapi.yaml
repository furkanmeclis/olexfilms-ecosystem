          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Get own preferences
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    put:
      tags: [Notifications]
      operationId: putNotificationPreferences
      summary: Update own preferences
      description: |
        Security emails (password reset / email verification) ignore `email_enabled`.
        Web push is its own channel (`webpush`): it needs `push_enabled` (or a rule)
        and an active browser subscription.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferences"
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/platform/notifications:
    get:
      tags: [Platform]
      operationId: getPlatformNotifications
      summary: List platform notifications
      description: |
        Defaults to the caller's own notifications (`scope=me`).
        `platform.notifications.read_all` is required for `scope=all` or `user_uuid`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Sort"
        - name: status
          in: query
          schema: { type: string }
        - name: channel
          in: query
          schema: { type: string }
        - name: scope
          in: query
          description: "me (default) or all (requires read_all)"
          schema:
            type: string
            enum: [me, all]
        - name: user_uuid
          in: query
          description: "Filter to one user (requires read_all)"
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeNotificationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/notifications/meta:
    get:
      tags: [Platform]
      operationId: getPlatformNotificationsMeta
      summary: Platform notifications meta
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeResourceMeta"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/notification-events:
    get:
      tags: [Notifications]
      operationId: getNotificationEvents
      summary: Notification event catalog
      description: |
