        K5: an area belongs to one distributor per brand. The same area and
        any ancestor/descendant overlap (NL with A blocks Amsterdam for B and
        vice versa) answer 409 TERRITORY_CONFLICT; details list the blocking
        territories (code territory_conflict).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignTerritoryRequest"
      responses:
        "201":
          description: Territory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTerritory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TerritoryConflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/territories/resolve:
    get:
      tags: [Geo]
      operationId: resolveTerritory
      summary: Distributor covering an address (district > province > country)
      security:
        - bearerAuth: []
      parameters:
        - name: country_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: province_id
          in: query
          schema: { type: integer, format: int64 }
        - name: district_id
          in: query
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Match (null when no distributor covers the address)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeTerritoryMatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/territories/{uuid}:
    delete:
      tags: [Geo]
      operationId: deleteTerritory
      summary: Remove a territory; existing dealers keep their parent (platform.territories.write)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/plate-formats:
    get:
      tags: [Geo]
      operationId: listPlateFormats
      summary: Active licence plate formats (plate inputs, masks, badge colors)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plate formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateFormatList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/plate-formats/validate:
    post:
      tags: [Geo]
      operationId: validatePlate
      summary: Validate a plate against its plate country
      description: >-
        The plate country is chosen on the vehicle and is independent of the
        customer's country (a German plate on a Turkish customer validates
        against DE). The regex runs on the compact form (upper case, no
        spaces/dashes/dots). A mismatch answers 422 INVALID_PLATE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, plate]
              properties:
                country: { type: string, example: DE, description: ISO 3166-1 alpha-2 }
                plate: { type: string, example: B AB 1234 }
      responses:
        "200":
          description: Valid plate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidPlate"

  /v1/platform/plate-formats:
    get:
      tags: [Geo]
      operationId: listPlatformPlateFormats
      summary: Every plate format incl. inactive (platform.settings.read)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Plate formats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateFormatList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Geo]
      operationId: createPlateFormat
      summary: Add a country's plate format (platform.settings.write)
      description: The regex must be anchored and RE2 compatible (no lookaround); the example must match it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlateFormatRequest"
      responses:
        "201":
          description: Plate format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateFormat"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/plate-formats/{iso2}:
    patch:
      tags: [Geo]
      operationId: patchPlateFormat
      summary: Change a country's plate format (platform.settings.write)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CountryISO2"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlateFormatRequest"
      responses:
        "200":
          description: Plate format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopePlateFormat"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Geo]
      operationId: deletePlateFormat
      summary: Remove a country's plate format (platform.settings.write)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CountryISO2"
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/currencies:
    get:
      tags: [Rates]
      operationId: listCurrencies
      summary: Active ISO 4217 currencies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Currencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCurrencyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /v1/platform/exchange-rates:
    get:
      tags: [Rates]
      operationId: listExchangeRates
      summary: Stored rates of a day (platform.rates.read)
      description: Without date the latest stored day up to today. effective marks the row the resolver uses.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: base
          in: query
          schema: { type: string, example: EUR }
      responses:
        "200":
          description: Rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExchangeRateDay"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/platform/exchange-rates/resolve:
    get:
      tags: [Rates]
      operationId: resolveExchangeRate
      summary: The rate a record of that day would freeze (rate_snapshot)
      description: >-
        Latest stored day not after `date` (up to 10 days back), on that day
        manual > tcmb > ecb, either direction; otherwise a cross rate via TRY
        or EUR. 404 RATE_NOT_FOUND when nothing qualifies.
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: base
          in: query
          required: true
          schema: { type: string, example: EUR }
        - name: quote
          in: query
          required: true
          schema: { type: string, example: TRY }
      responses:
        "200":
          description: Rate snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRateSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/platform/exchange-rates/override:
    put:
      tags: [Rates]
      operationId: setExchangeRateOverride
      summary: Manual rate for a day and pair; wins over TCMB/ECB (platform.rates.write)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateOverrideRequest"
      responses:
        "200":
          description: Stored override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeRateSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      tags: [Rates]
      operationId: clearExchangeRateOverride
      summary: Remove a manual rate; the fetched value applies again (platform.rates.write)
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: base
          in: query
          required: true
          schema: { type: string }
        - name: quote
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/platform/exchange-rates/fetch:
    post:
      tags: [Rates]
      operationId: fetchExchangeRates
      summary: Fetch TCMB and ECB now (platform.rates.write)
      description: The worker-core scheduler runs the same fetch on weekdays 18:30 and daily 10:15 (Europe/Istanbul).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fetch report per source (a failing source carries error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeFetchReport"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CountryISO2:
      name: iso2
      in: path
      required: true
      description: ISO 3166-1 alpha-2 country code (case-insensitive)
      schema: { type: string, example: NL }
    GeoID:
      name: id
      in: path
      required: true
      description: Province or district id
      schema: { type: integer, format: int64 }
    ModuleKey:
      name: key
      in: path
      required: true
      description: Module key from the backend catalog (GET /v1/features)
      schema: { type: string, example: ai_assistant }
    ResourceUUID:
      name: uuid
      in: path
      required: true
      description: Resource UUID
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Q:
      name: q
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      description: Comma-separated fields; prefix `-` for descending
      schema: { type: string }

  responses:
    Deleted:
      description: Deleted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeDeleted"
    TerritoryConflict:
      description: >-
        409 TERRITORY_CONFLICT: the area, an ancestor or a descendant already
        belongs to a distributor of the brand (details[].code territory_conflict).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidPlate:
      description: 422 INVALID_PLATE (or VALIDATION_ERROR for a malformed country code)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ModuleError:
      description: >-
        409 FEATURE_DISABLED (closed one level up) or MODULE_ADMIN_OVERRIDE;
        422 MODULE_CORE (core modules cannot be switched off)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Validation or malformed request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: >-
        A well-formed value that is not accepted, such as an unsupported locale
        or an unknown timezone (code VALIDATION_ERROR, details[].field names it).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Missing or invalid credentials / access token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Conflict (duplicate / constraint)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:

    SearchSpec:
      type: object
      required: [id, label_key]
      properties:
        id: { type: string, example: users }
        label_key: { type: string, example: search.specs.users }
        permission: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        searchable_fields:
          type: array
          items: { type: string }
        filterable_fields:
          type: array
          items: { type: string }
        tenant_scoped: { type: boolean }

    SearchHit:
      type: object
      required: [spec, id, title, href]
      properties:
        spec: { type: string }
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        href: { type: string }
        icon: { type: [string, "null"] }
        score: { type: [number, "null"], format: double }

    SearchSpecsData:
      type: object
      required: [items, enabled]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchSpec" }
        enabled: { type: boolean }

    SearchHitsData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SearchHit" }

    EnvelopeSearchSpecs:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchSpecsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    EnvelopeSearchHits:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { $ref: "#/components/schemas/SearchHitsData" }
        meta: { $ref: "#/components/schemas/ResponseMeta" }

    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error code
          examples:
            - VALIDATION_ERROR
            - INVALID_RESET_CODE
            - INVALID_VERIFICATION_CODE
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PASSWORD_RESET_FAILED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }

    Error:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/ErrorBody"
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    Tokens:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          examples: [Bearer]
        expires_in:
          type: integer
          format: int64
          description: Access token lifetime in seconds
        refresh_expires_at:
          type: string
          format: date-time

    PublicUser:
      type: object
      required: [uuid, email, name, surname, status, is_super_admin, email_verified]
      properties:
        uuid:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        surname:
          type: string
        status:
          type: string
          examples: [active, disabled]
        is_super_admin:
          type: boolean
        email_verified:
          type: boolean
        locale:
          description: The user's own language; null inherits from the organization (see Me.effective_locale).
          oneOf:
            - $ref: "#/components/schemas/Locale"
            - type: "null"
        timezone:
          type: [string, "null"]
          description: The user's own IANA timezone; null inherits from the organization.
          examples: ["Asia/Dubai"]

    Locale:
      type: string
      description: >-
        Canonical locale code (K10). Inputs are normalized: "zh_CN", "zh-cn"
        and "zh" become zh-CN; a regional code falls back to its language
        ("tr-TR" -> tr). Unknown codes are rejected with 422.
      enum: [tr, en, bg, de, el, uk, ru, fr, es, it, zh-CN, az, ar]

    MeLinks:
      type: object
      required: [profile, change_password, notification_preferences]
      properties:
        profile: { type: string, examples: ["/v1/auth/profile"] }
        change_password: { type: string, examples: ["/v1/auth/password/change"] }
        notification_preferences: { type: string, examples: ["/v1/notification-preferences"] }

    MeChannels:
      type: object
      properties:
        user:
          type: string
          description: Centrifugo channel hint
          examples: ["user:uuid"]

    MeRealtime:
      type: object
      required: [enabled, user_channel]
      properties:
        enabled: { type: boolean }
        ws_url: { type: string }
        user_channel:
          type: string
          examples: ["user:uuid"]

    Me:
      type: object
      required: [user, roles, permissions, links, channels, realtime, effective_locale, effective_timezone]
      properties:
        effective_locale:
          description: >-
            Resolved language: user -> active organization -> brand center ->
            Accept-Language -> tr.
          $ref: "#/components/schemas/Locale"
        effective_timezone:
          type: string
          description: >-
            Resolved IANA timezone: user -> active organization -> brand
            center -> Europe/Istanbul.
          examples: ["Europe/Istanbul"]
        user:
          $ref: "#/components/schemas/PublicUser"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        grants:
          type: object
          description: >-
            Permission slug -> scope in the active organization context (global
            roles + roles of the active membership).
          additionalProperties:
            $ref: "#/components/schemas/PermissionScope"
        active_organization_uuid:
          type: string
          format: uuid
        organization_roles:
          type: array
          description: Roles of the user in the active organization.
          items:
            type: string
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
        links:
          $ref: "#/components/schemas/MeLinks"
        channels:
          $ref: "#/components/schemas/MeChannels"
        realtime:
          $ref: "#/components/schemas/MeRealtime"
        impersonation:
          $ref: "#/components/schemas/MeImpersonation"

    MeImpersonation:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/PublicUser"

    OrganizationMembership:
      type: object
      required: [uuid, slug, name, role, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [owner, staff]
        logo_url:
          type: [string, "null"]
        status:
          type: string
        access_ends_at:
          type: [string, "null"]
          format: date-time
        type:
          $ref: "#/components/schemas/OrganizationType"
        brand:
          $ref: "#/components/schemas/BrandRef"
        parent:
          oneOf:
            - $ref: "#/components/schemas/OrganizationParentRef"
            - type: "null"

    OrganizationType:
      type: string
      enum: [center, distributor, dealer]

    OrganizationStatus:
      type: string
      description: pending and expired are legacy values kept for compatibility.
      enum: [pending, active, read_only, suspended, expired]

    BrandRef:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
        name:
          type: string

    OrganizationParentRef:
      type: object
      required: [uuid, name]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string

    PublicBrand:
      type: object
      required: [uuid, slug, name, status]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive]

    PublicOrganization:
      type: object
      required: [uuid, slug, name, status, access_ok]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
        logo_url:
          type: [string, "null"]
        access_ok:
          type: boolean

    Organization:
      type: object
      required: [uuid, slug, name, city, district, phone, address, status, access_starts_at, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        city:
          type: string
        district:
          type: string
        phone:
          type: string
        address:
          type: string
        status:
          type: string
        plan_code:
          type: [string, "null"]
        access_starts_at:
          type: string
          format: date-time
        access_ends_at:
          type: [string, "null"]
          format: date-time
        logo_url:
          type: [string, "null"]
        country_id:
          type: [integer, "null"]
          format: int64
          description: Structured address (GET /v1/geo/countries); city/district are the display copy.
        province_id:
          type: [integer, "null"]
          format: int64
        district_id:
          type: [integer, "null"]
