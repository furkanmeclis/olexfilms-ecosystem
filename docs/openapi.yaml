  /v1/customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      summary: Customers linked to the organizations in scope
      description: >-
        customers.read. A dealer sees the customers linked to its organization
        (customer_organizations), a distributor its subtree, the center the
        brand; always the domain brand (K20). Anonymized customers are listed
        masked (`anonymized: true`, localized name, no contact data).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Q"
        - name: status
          in: query
          schema: { type: string, enum: [active, disabled, pending, anonymized] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Create or link a customer by phone (one phone = one user)
      description: >-
        customers.write. The phone is normalized to E.164 (default region:
        the organization's country, TR when unknown). An existing user with
        that phone is linked to the active organization instead of creating
        a second user (200, `existing_user: true`); its name, e-mail and
        profile are only filled where empty, differing values are listed in
        `ignored_fields`. A new user gets the customer role (201). National
        id and tax number are stored encrypted; only their last four
        characters are ever returned.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerCreateInput"
      responses:
        "200":
          description: Existing user linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerWrite"
        "201":
          description: New customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerWrite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: PII_ENCRYPTION_UNAVAILABLE (CUSTOMER_PII_KEY not configured)

  /v1/customers/{uuid}:
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: One customer of the scope
      description: Out-of-scope customers answer 404.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomer"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Customers]
      operationId: updateCustomer
      summary: Edit a customer
      description: >-
        customers.write. Absent keys keep the stored value, null or "" clears
        it. Values are replaced only when `identity_editable` is true (every
        link of the customer is in the caller's scope and the user has no
        panel membership); otherwise only empty fields are filled and the rest
        is listed in `ignored_fields`. Anonymized customers answer 409
        CUSTOMER_ANONYMIZED.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdateInput"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerWrite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          description: PII_ENCRYPTION_UNAVAILABLE (CUSTOMER_PII_KEY not configured)

  /v1/customers/{uuid}/upgrade-to-dealer:
    post:
      tags: [Customers]
      operationId: upgradeCustomerToDealer
      summary: Make a customer a member of an existing dealer
      description: >-
        customers.write in a center organization or a distributor above the
        dealer (dealers get 403, dealers outside the reach 404). Adds an
        organization_members row with the dealer_owner or dealer_staff role;
        no organization is created. The customer role, links, vehicles and
        history stay, so the same user signs in to the portal (WhatsApp OTP)
        and to the panel. A second upgrade into the same dealer answers 409
        ALREADY_MEMBER.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpgradeInput"
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerUpgrade"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/customers/{uuid}/anonymize:
    post:
      tags: [Customers]
      operationId: anonymizeCustomer
      summary: KVKK/GDPR anonymization of a customer (irreversible, idempotent)
      description: >-
        customers.anonymize (center roles) in a center organization, plus a
        fresh step-up (403 STEP_UP_REQUIRED). No row is deleted: vehicles,
        plates/VINs, services and warranties stay attached to the user.
        Name, surname, e-mail, phone, timezone, address, company, tax office
        and the encrypted identity numbers are overwritten; the account gets
        status anonymized, its refresh tokens are revoked and it can no
        longer sign in. A second call answers 200 with changed=false and
        changes nothing. A customer who is also an organization user answers
        409 CUSTOMER_HAS_PANEL_ACCOUNT. Every call is written to the audit
        log (customers.anonymized).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Anonymized (or already anonymized)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerAnonymizeResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/customers/{uuid}/merge/preview:
    post:
      tags: [Customers]
      operationId: previewCustomerMerge
      summary: Dry run of a customer merge (writes nothing)
      description: >-
        customers.merge (center roles) in a center organization. Runs the
        same statements as the merge in a transaction that is rolled back
        and reports what would move from this customer (source) to
        target_uuid: vehicles, services, warranties, organization links and
        consents, the unique-key conflicts that are folded (a link to the
        same organization on both users) and the records that stay with the
        source. No audit row, no event. Refusals (409):
        CUSTOMER_MERGE_SELF, CUSTOMER_ALREADY_MERGED (source or target was
        already merged), CUSTOMER_MERGE_ANONYMIZED,
        CUSTOMER_HAS_PANEL_ACCOUNT (either user is an organization user),
        CUSTOMER_MERGE_PENDING_TRANSFER (open vehicle transfer of the
        source), CUSTOMER_INACTIVE (target disabled).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerMergeInput"
      responses:
        "200":
          description: What the merge would move
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerMergeResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/customers/{uuid}/merge:
    post:
      tags: [Customers]
      operationId: mergeCustomer
      summary: Merge this customer (source) into another one (irreversible)
      description: >-
        customers.merge (center roles) in a center organization, plus a
        fresh step-up (403 STEP_UP_REQUIRED). One transaction: vehicles,
        services (following their vehicle), warranties (holder),
        organization links (duplicates folded into the target's link),
        consents and the profile move to target_uuid; the phone / e-mail the
        target lacks is handed over. Nothing is deleted: the source keeps
        its row with merged_into_user_id = target and status disabled, its
        refresh tokens are revoked and it can no longer sign in. Customer
        cari accounts are not moved (reported). Writes the audit row
        customers.merged and the outbox event customer.merged. Same
        refusals as the preview.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerMergeInput"
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeCustomerMergeResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/customers/{uuid}/data-export:
    post:
      tags: [Customers]
      operationId: requestCustomerDataExport
      summary: Queue a personal data export of a customer (JSON or PDF)
      description: >-
        customers.anonymize in a center organization, plus a fresh step-up.
        The job runs on worker-docs (exports queue): JSON is one structured
        document (profile, vehicles, services, warranties of the domain
        brand), PDF is rendered by Gotenberg in the requested language.
        Identity numbers are exported masked (last four characters). The
        request is written to the audit log (customers.data_export_requested).
        Poll and download through /v1/customer-data-exports/{uuid}.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerDataExportInput"
      responses:
        "202":
          description: Export job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/customer-data-exports/{uuid}:
    get:
      tags: [Customers]
      operationId: getCustomerDataExport
      summary: A customer data export job of the active organization
      description: download_url points at /v1/customer-data-exports/{uuid}/download once completed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceUUID"
      responses:
        "200":
          description: Export job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeExportJob"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
