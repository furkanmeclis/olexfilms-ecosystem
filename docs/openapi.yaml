  /v1/stock/import:
    post:
      tags: [Stock]
      operationId: importStockUnits
      summary: Upload a stock import file (brand center, staged)
      description: >-
        Needs `stock.import` and the brand center (K14). Columns: barcode,
        product_sku (required), quantity (fixed barcodes), meters (rolls),
        location_code (optional, a location of the center; default the
        organization). Map, preview, confirm and undo through
        `/v1/tenant/imports/{uuid}`: the preview stages the rows of the batch
        (batch uuid = job uuid) and classifies them as new, duplicate,
        invalid or conflict with their target; confirm (worker-core import
        queue) creates the new units and posts their entry movements through
        the stock ledger in one transaction, and confirming again writes
        nothing; rollback voids the units that saw no other movement and
        refuses the others row by row (STOCK_IMPORT_UNDO_UNIT_TOUCHED).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                format: { type: string, enum: [csv, tsv, xlsx, json], default: csv }
                locale: { type: string, example: tr }
      responses:
        "201":
          description: Import job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeImportJob"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/stock/import/sample:
    get:
      tags: [Stock]
      operationId: stockImportSample
      summary: Sample stock import file
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, tsv, xlsx, json], default: xlsx }
        - name: locale
          in: query
          schema: { type: string, example: tr }
      responses:
        "200":
          description: Sample file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

  /v1/stock/units/by-barcode/{barcode}:
    parameters:
      - name: barcode
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    get:
      tags: [Stock]
      operationId: getStockUnitHistory
      summary: Current state and movement history of a barcode
      description: >-
        Needs `stock.read`, filtered on the holding organization
        (`holder_org_id`, TEC-94 decision 4). Scope `all` (center warehouse,
        K20) sees every unit and every name. A restricted viewer (managed,
        subtree, brand) sees a unit only while it is held inside its reach
        (404 otherwise). It then gets the whole history: rows of its own
        organizations and of its supplier chain are named; rows of any other
        organization are masked (`organization_masked`, owner `masked`, no
        location, reference or reason). Movements are in ledger order
        (oldest first) and paged with `limit`/`offset`. Fixed barcodes list
        the quantity per owner in `holdings` instead of `current`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Unit and its history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockUnitHistory"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stock/organizations/{uuid}/products:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Stock]
      operationId: listStockOrganizationProducts
      summary: Product stock of an organization
      description: >-
        Needs `stock.read`; the organization must be inside the viewer's
        reach (404 otherwise). Rows come from the
        `organization_product_stocks` projection: available and placed
        units only (in transit, used and void are not counted). `quantity`
        counts pieces and fixed barcode quantities, `meters` the remaining
        roll meters; `fixed_barcodes` lists the fixed barcode quantities on
        hand. `q` matches product name or SKU.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/StockProductUUIDFilter"
        - $ref: "#/components/parameters/StockCategoryUUIDFilter"
        - $ref: "#/components/parameters/StockStatusFilter"
      responses:
        "200":
          description: Product stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stock/locations/{uuid}/products:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Stock]
      operationId: listStockLocationProducts
      summary: Product stock of a warehouse location (bin)
      description: >-
        Needs `stock.read`; the location's organization must be inside the
        viewer's reach (404 otherwise). Rows come from the
        `bin_product_stocks` projection; same shape and filters as the
        organization stock.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/StockProductUUIDFilter"
        - $ref: "#/components/parameters/StockCategoryUUIDFilter"
        - $ref: "#/components/parameters/StockStatusFilter"
      responses:
        "200":
          description: Bin product stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/platform/stock/rebuild-check:
    post:
      tags: [Stock]
      operationId: checkStockRebuild
      summary: Stock projection drift check (super_admin, dry run)
      description: >-
        Replays `stock_movements` chronologically, rebuilds the expected
        projections (unit_current_state, fixed_barcode_holdings,
        units.status / remaining_meters, bin and organization product
        stocks) and reports every value that differs from the stored
        projection. Never writes; the repair runs from
        `cmd/inventory-rebuild -apply` (one locked transaction plus an audit
        row). Without `organization_uuid` every organization is scanned. At
        most 1000 differences are returned (`diffs_truncated`).
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockRebuildCheckInput" }
      responses:
        "200":
          description: Drift report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockRebuildReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stock/reclassifications:
    get:
      tags: [Stock]
      operationId: listStockReclassifications
      summary: Reclassification requests (barcode kept, product changed)
      description: >-
        Needs `stock.read`; requests of the organizations inside the
        viewer's reach (the requesting organization is the one holding the
        unit), newest first. `status` filters pending, approved, rejected or
        cancelled requests (TEC-157).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/StockReclassificationStatus" }
      responses:
        "200":
          description: Reclassification requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockReclassificationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      tags: [Stock]
      operationId: createStockReclassification
      summary: Request a reclassification of a unit
      description: >-
        Needs `stock.write`. The unit (by `barcode` or `unit_uuid`) must be
        on hand (available or placed) at the caller's active organization.
        The routing is checked at once and again on approval; each wrong
        routing has its own code: target of another brand (422
        STOCK_RECLASSIFICATION_BRAND_MISMATCH), another unit type, roll vs
        piece or fixed vs serial (422
        STOCK_RECLASSIFICATION_UNIT_TYPE_MISMATCH), the same product (422
        STOCK_RECLASSIFICATION_SAME_PRODUCT), a passive product (422
        STOCK_RECLASSIFICATION_PRODUCT_INACTIVE), a fixed barcode (422
        STOCK_RECLASSIFICATION_FIXED_BARCODE), a used or void unit (409
        STOCK_RECLASSIFICATION_UNIT_CONSUMED), a unit held by another
        organization, in transit or not in stock yet (409
        STOCK_RECLASSIFICATION_UNIT_ELSEWHERE), a unit on an open service or
        reserved for an order (409 STOCK_RECLASSIFICATION_UNIT_IN_USE). At
        most one pending request per unit (409
        STOCK_RECLASSIFICATION_PENDING_EXISTS). Nothing moves until a center
        user approves; the request is written to the audit log
        (`stock.reclassification.requested`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockReclassificationInput" }
      responses:
        "201":
          description: Pending request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockReclassification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/stock/reclassifications/{uuid}:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    get:
      tags: [Stock]
      operationId: getStockReclassification
      summary: One reclassification request
      description: Needs `stock.read`; the requesting organization must be inside the viewer's reach (404 otherwise).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reclassification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockReclassification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/stock/reclassifications/{uuid}/approve:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Stock]
      operationId: approveStockReclassification
      summary: Approve and apply a reclassification
      description: >-
        Needs `stock.reclassify` (center, sensitive: 403 STEP_UP_REQUIRED
        without a recent step-up) with a scope reaching the request. The
        requester cannot approve its own request (403
        STOCK_RECLASSIFICATION_SELF_APPROVAL). In one transaction the
        routing is checked again under the unit lock (same codes as the
        request; 409 STOCK_RECLASSIFICATION_PRODUCT_CHANGED when the unit no
        longer has the requested source product), one `reclassification`
        ledger movement is written (same owner and status, the new product,
        idempotency key
        `reclassification:stock_reclassification:<id>:reclassification:<barcode>`),
        the unit keeps its barcode and moves to the target product in the
        product stock projections, the request becomes approved with its
        movement, a `stock.reclassification` outbox event and an audit row
        (`stock.reclassification.approved`) are written. Approving an
        approved request again returns it and writes nothing; a rejected or
        cancelled request answers 409 STOCK_RECLASSIFICATION_NOT_PENDING.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockReclassificationDecisionInput" }
      responses:
        "200":
          description: Approved request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockReclassification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v1/stock/reclassifications/{uuid}/reject:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Stock]
      operationId: rejectStockReclassification
      summary: Reject a pending reclassification
      description: >-
        Needs `stock.reclassify` with a scope reaching the request. Nothing
        moves; repeating the rejection is a no-op, an approved or cancelled
        request answers 409 STOCK_RECLASSIFICATION_NOT_PENDING. Audit:
        `stock.reclassification.rejected`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockReclassificationDecisionInput" }
      responses:
        "200":
          description: Rejected request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockReclassification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/stock/reclassifications/{uuid}/cancel:
    parameters:
      - $ref: "#/components/parameters/ResourceUUID"
    post:
      tags: [Stock]
      operationId: cancelStockReclassification
      summary: Withdraw a pending reclassification
      description: >-
        Needs `stock.write`; only the requesting organization (404
        otherwise). Nothing moves; repeating is a no-op, a decided request
        answers 409 STOCK_RECLASSIFICATION_NOT_PENDING. Audit:
        `stock.reclassification.cancelled`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockReclassificationDecisionInput" }
      responses:
        "200":
          description: Cancelled request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeStockReclassification"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/public/product-images/{key}:
    get:
      tags: [Catalog]
      operationId: getPublicProductImage
      summary: Product image (public, cacheable)
      description: >-
        No auth, no signed URL. The frontend serves it at the fixed URL
        `/product-images/{key}`. Answers the uploaded image with a strong
        `ETag` and `Cache-Control: public, max-age=86400`; a matching
        `If-None-Match` gets 304. Only images of active products are served;
        removed, unknown and inactive-product images are 404.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32}\\.(jpg|png|webp)$" }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Image bytes
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "304":
          description: Not modified (If-None-Match matched the ETag)
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/public/brand-logos/{uuid}:
    get:
      tags: [VehicleCatalog]
      operationId: getPublicBrandLogo
      summary: Car brand logo (public, cacheable)
      description: >-
        No auth, no signed URL. The frontend serves it at the fixed URL
        `/brand-logos/{uuid}`. Answers the stored logo (JPEG/PNG/WebP) with a
        strong `ETag` and `Cache-Control: public, max-age=86400`; a matching
        `If-None-Match` gets 304. The ETag changes with every upload. A brand
        without a logo gets an SVG placeholder (`max-age=3600`).
      security: []
      parameters:
        - $ref: "#/components/parameters/VehicleCatalogUUID"
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: Logo bytes (or the placeholder)
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "304":
          description: Not modified (If-None-Match matched the ETag)
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

