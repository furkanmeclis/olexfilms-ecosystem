# TEC-1011: manual fallback for shipping the iOS app from EAS end to end.
# The automatic path is the GitHub Actions job "mobile-release" (ci.yml):
# it decides OTA vs build on the GitHub runner, because EAS Workflows'
# Linux queue waited about an hour per job (2026-10-26). This file keeps
# the same decision for a hand-started run:
#   npx eas-cli@latest workflow:run deploy-ios.yml   (from mobile/)
#
#   fingerprint  -> native hash of the project with the production env
#   get_ios_build -> is there already a finished production build with it?
#     yes -> publish_ios_update: JS-only change, OTA on channel "production"
#     no  -> build_ios + submit_ios: new TestFlight build
name: Deploy iOS (TestFlight or OTA)

on:
  workflow_dispatch: {}

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_ios_build:
    name: Existing iOS build for this fingerprint?
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_ios:
    name: Build iOS (fingerprint changed)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  publish_ios_update:
    name: OTA update (fingerprint unchanged)
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      channel: production
      platform: ios
